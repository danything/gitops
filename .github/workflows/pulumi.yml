# **Cloudflare の設定(いまは R2 だけ)を Pulumi で当てる。** 中身は pulumi/。
#
#   PR       → preview。差分を PR にコメントする(読み取りの鍵だけ)
#   main     → up。**マージした時点で当たる**(書き込みの鍵は Environment `pulumi-apply` に置き、
#              main からしか使えない)
#   毎週月曜 → preview --refresh --expect-no-changes。Cloudflare 側を直接いじったら落ちる。
#              Pulumi で表せない残り(カスタムドメイン・容量)も pulumi/report.ts で見る
#
# 書き込みの鍵は R2 の設定を書き換えられる(= バックアップのバケットを消せる)。
# 守りは 2 つ: Environment で main に限ること、doany-restic に `protect` が付いていること
# (外すと Pulumi は消すのを拒否しなくなる。pulumi/index.ts)。
#
# 秘密(リポジトリの Actions secrets):
#   PULUMI_BACKEND_URL        state の置き場(R2 の doany-pulumi。endpoint にアカウント ID が入るので secrets)
#   PULUMI_CONFIG_PASSPHRASE  state の暗号化。state に秘密は入れていないので、失くしたら作り直せる(pulumi/README.md)
#   CLOUDFLARE_ACCOUNT_ID
#   PREVIEW_CLOUDFLARE_API_TOKEN / PREVIEW_AWS_ACCESS_KEY_ID / PREVIEW_AWS_SECRET_ACCESS_KEY
#                             R2 の設定の読み取り + doany-pulumi の読み書き(state のロックに要る)
#   PREVIEW_NB_PAT            NetBird の読み取り (サービスユーザー gitops-pulumi-preview、Auditor)
# Environment `pulumi-apply` の秘密:
#   CLOUDFLARE_API_TOKEN / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#                             R2 の設定の書き込み + doany-pulumi の読み書き
#   NB_PAT                    NetBird の書き込み (サービスユーザー gitops-pulumi-apply、Admin)
# AWS_* は state の置き場(R2 の S3 API)のため。値は同じ API トークンから作る(ID と値の sha256)。
#
# Entra(pulumi/entra.ts)には**鍵を置かずに**入る。GitHub Actions の OIDC トークンを Entra の
# ワークロード ID のフェデレーションで受ける(id-token: write が要る)。ID は秘密ではないので Variables:
#   AZURE_TENANT_ID           リポジトリの Variables
#   PREVIEW_AZURE_CLIENT_ID   リポジトリの Variables。アプリ登録「gitops pulumi preview (Entra read)」
#                             (Application.Read.All。PR と main から入れる)
#   AZURE_CLIENT_ID           Environment `pulumi-apply` の Variables。「gitops pulumi apply (Entra write)」
#                             (Application.ReadWrite.OwnedBy。所有者になっている共用のアプリ登録しか書けない)
name: pulumi

on:
  pull_request:
    paths:
      - pulumi/**
      - .github/workflows/pulumi.yml
  push:
    branches: [main]
    paths:
      - pulumi/**
      - .github/workflows/pulumi.yml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # doany.io のゾーン(dns.ts)。アカウント ID と同じく git に置かない
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  # Cloudflare の通知の送り先(notifications.ts)。hookshot の受け口の ID を含むので secrets に
  CLOUDFLARE_NOTIFY_WEBHOOK_URL: ${{ secrets.CLOUDFLARE_NOTIFY_WEBHOOK_URL }}
  # cf / Pulumi のテレメトリを切る
  DO_NOT_TRACK: "1"
  PULUMI_SKIP_UPDATE_CHECK: "true"
  # azuread provider は GitHub Actions の OIDC トークン(ACTIONS_ID_TOKEN_REQUEST_*)を自分で拾う
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}

jobs:
  preview:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # 同じ PR の古い preview は捨ててよい。up とは別の列にする ── 1 列にまとめると、GitHub は
    # 待ちを 1 件しか持たないので、マージ後の up が後から来た preview に押し出されて消えうる
    concurrency:
      group: pulumi-preview-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      # 差分を PR にコメントする
      pull-requests: write
      # Entra へ OIDC で入る
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.PREVIEW_AZURE_CLIENT_ID }}
      # NetBird のサービスユーザー gitops-pulumi-preview (Auditor、読み取りだけ)
      NB_PAT: ${{ secrets.PREVIEW_NB_PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PREVIEW_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: pulumi/.bun-version
      # CLI だけを入れる (command なし)
      - uses: pulumi/actions@v7
        with:
          pulumi-version-file: pulumi/.pulumi-version
      # SDK (Pulumi.yaml の packages) を作って bun install まで済ませる。lock がずれたら落とす (--frozen-lockfile の代わり)。
      # Renovate の枝では postUpgradeTasks が同じ pulumi install で lock を作るので、ずれない (pulumi/README.md)
      - run: |
          pulumi install
          git diff --exit-code -- package.json bun.lock || {
            echo "::error::pulumi install で package.json / bun.lock が変わった。手元で pulumi install してコミットする"
            exit 1
          }
        working-directory: pulumi
      # bun は .ts を走らせるだけで型は見ない
      - run: bun run typecheck
        working-directory: pulumi

      - uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: prod
          work-dir: pulumi
          cloud-url: ${{ secrets.PULUMI_BACKEND_URL }}
          pulumi-version-file: pulumi/.pulumi-version
          comment-on-pr: true
          edit-pr-comment: true
          # 毎週の実行(と手動実行)は実物を読み直し、1 つでも差分があれば落とす(= Cloudflare 側を直接いじった)
          refresh: ${{ github.event_name != 'pull_request' }}
          expect-no-changes: ${{ github.event_name != 'pull_request' }}

      # preview がずれで落ちても流す(ずれと公開状態を同じ実行で見たい)
      - if: always() && github.event_name != 'pull_request'
        run: bun report.ts
        working-directory: pulumi

  up:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pulumi-apply
    # 走っている up は止めない(途中で切ると state がロックされたまま残る)。待ちが押し出されても、
    # 残るのは新しい main なので取りこぼしは無い。preview と同時に走ると片方がロックで落ちるが、
    # state は壊れない(落ちた方を流し直す)
    concurrency:
      group: pulumi-up
      cancel-in-progress: false
    permissions:
      contents: read
      # Entra へ OIDC で入る
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      # NetBird のサービスユーザー gitops-pulumi-apply (Admin)
      NB_PAT: ${{ secrets.NB_PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: pulumi/.bun-version
      - uses: pulumi/actions@v7
        with:
          pulumi-version-file: pulumi/.pulumi-version
      - run: |
          pulumi install
          git diff --exit-code -- package.json bun.lock || {
            echo "::error::pulumi install で package.json / bun.lock が変わった。手元で pulumi install してコミットする"
            exit 1
          }
        working-directory: pulumi
      - run: bun run typecheck
        working-directory: pulumi

      - uses: pulumi/actions@v7
        with:
          command: up
          stack-name: prod
          work-dir: pulumi
          cloud-url: ${{ secrets.PULUMI_BACKEND_URL }}
          pulumi-version-file: pulumi/.pulumi-version
          always-include-summary: true
