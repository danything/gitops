# Cloudflare・Entra・NetBird を Pulumi で当てる(pulumi/)。PR → preview、main → up、
# 毎週 → refresh して差分があれば落とす + report.ts + 鍵の期限。
# 書き込みの鍵はバックアップのバケットを消せるので Environment `pulumi-apply`(main だけ)に置く。
# 秘密と Variables の一覧は pulumi/README.md。
name: pulumi

on:
  pull_request:
    paths: &paths
      - pulumi/**
      - .github/workflows/pulumi.yml
      - .github/actions/pulumi-setup/**
  push:
    branches: [main]
    paths: *paths
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      report:
        description: 鍵の期限を、遠いものも含めて全部投稿する (expiry の動作確認用)
        type: boolean
        default: false

permissions:
  contents: read

env:
  PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  CLOUDFLARE_NOTIFY_WEBHOOK_URL: ${{ secrets.CLOUDFLARE_NOTIFY_WEBHOOK_URL }}
  DO_NOT_TRACK: "1"
  PULUMI_SKIP_UPDATE_CHECK: "true"
  # azuread provider は GitHub Actions の OIDC トークン(ACTIONS_ID_TOKEN_REQUEST_*)を自分で拾う
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}

jobs:
  preview:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # up と別の列にする(待ちは 1 件だけなので、up が preview に押し出されうる)
    concurrency:
      group: pulumi-preview-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      # Entra へ OIDC で入る
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.PREVIEW_AZURE_CLIENT_ID }}
      NB_PAT: ${{ secrets.PREVIEW_NB_PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PREVIEW_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pulumi-setup

      - uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: prod
          work-dir: pulumi
          cloud-url: ${{ secrets.PULUMI_BACKEND_URL }}
          pulumi-version-file: pulumi/.pulumi-version
          comment-on-pr: true
          edit-pr-comment: true
          # 週次と手動は実物を読み直し、差分があれば落とす
          refresh: ${{ github.event_name != 'pull_request' }}
          expect-no-changes: ${{ github.event_name != 'pull_request' }}

      # preview がずれで落ちても流す(ずれと公開状態を同じ実行で見たい)
      - if: always() && github.event_name != 'pull_request'
        run: bun report.ts
        working-directory: pulumi

  up:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pulumi-apply
    # 走っている up は止めない(途中で切ると state がロックされたまま残る)
    concurrency:
      group: pulumi-up
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      NB_PAT: ${{ secrets.NB_PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pulumi-setup

      - uses: pulumi/actions@v7
        with:
          command: up
          stack-name: prod
          work-dir: pulumi
          cloud-url: ${{ secrets.PULUMI_BACKEND_URL }}
          pulumi-version-file: pulumi/.pulumi-version
          always-include-summary: true

  # 鍵の期限。PR ではログだけ。鍵は自分の期限しか読めないので preview 用と apply 用を別々に見る
  # (apply 用は main だけ)。
  expiry:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        key: ${{ github.event_name == 'pull_request' && fromJSON('["preview"]') || fromJSON('["preview", "apply"]') }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.key == 'apply' && 'pulumi-apply' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      KEY: ${{ matrix.key }}
      NB_PAT: ${{ matrix.key == 'apply' && secrets.NB_PAT || secrets.PREVIEW_NB_PAT }}
      CF_TOKEN: ${{ matrix.key == 'apply' && secrets.CLOUDFLARE_API_TOKEN || secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WEBHOOK: ${{ secrets.MATRIX_SERVER_WEBHOOK_URL }}
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
      REPORT_ALL: ${{ inputs.report == true }}
      WARN_DAYS: "30"
    steps:
      - uses: actions/checkout@v7
      - if: matrix.key == 'preview'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.PREVIEW_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: pulumi/expiry.sh
      # 確かめられなかったことも知らせる(鍵が切れて 401 など)
      - if: failure() && github.event_name != 'pull_request'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg text ":warning: 鍵の期限を確かめられなかった ($KEY 用)。鍵が切れているかもしれない: $RUN_URL" '{text: $text}' |
            curl -fsS -X POST -H "Content-Type: application/json" --data-binary @- "$WEBHOOK"
