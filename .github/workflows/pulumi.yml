# **Cloudflare の設定(いまは R2 だけ)を Pulumi で当てる。** 中身は pulumi/。
#
#   PR       → preview。差分を PR にコメントする(読み取りの鍵だけ)
#   main     → up。**マージした時点で当たる**(書き込みの鍵は Environment `pulumi-apply` に置き、
#              main からしか使えない)
#   毎週月曜 → preview --refresh --expect-no-changes。Cloudflare 側を直接いじったら落ちる。
#              Pulumi で表せない残り(カスタムドメイン・容量)も pulumi/report.ts で見る
#
# 書き込みの鍵は R2 の設定を書き換えられる(= バックアップのバケットを消せる)。
# 守りは 2 つ: Environment で main に限ること、doany-restic に `protect` が付いていること
# (外すと Pulumi は消すのを拒否しなくなる。pulumi/index.ts)。
#
# 秘密(リポジトリの Actions secrets):
#   PULUMI_BACKEND_URL        state の置き場(R2 の doany-pulumi。endpoint にアカウント ID が入るので secrets)
#   PULUMI_CONFIG_PASSPHRASE  state の暗号化。state に秘密は入れていないので、失くしたら作り直せる(pulumi/README.md)
#   CLOUDFLARE_ACCOUNT_ID
#   PREVIEW_CLOUDFLARE_API_TOKEN / PREVIEW_AWS_ACCESS_KEY_ID / PREVIEW_AWS_SECRET_ACCESS_KEY
#                             R2 の設定の読み取り + doany-pulumi の読み書き(state のロックに要る)
# Environment `pulumi-apply` の秘密:
#   CLOUDFLARE_API_TOKEN / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#                             R2 の設定の書き込み + doany-pulumi の読み書き
# AWS_* は state の置き場(R2 の S3 API)のため。値は同じ API トークンから作る(ID と値の sha256)。
name: pulumi

on:
  pull_request:
    paths:
      - pulumi/**
      - .github/workflows/pulumi.yml
  push:
    branches: [main]
    paths:
      - pulumi/**
      - .github/workflows/pulumi.yml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# state はロックされるが、待たずに落ちるので並べない。走っているものは止めない(up の途中で切らない)
concurrency:
  group: pulumi
  cancel-in-progress: false

permissions:
  contents: read

env:
  PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # cf / Pulumi のテレメトリを切る
  DO_NOT_TRACK: "1"
  PULUMI_SKIP_UPDATE_CHECK: "true"

jobs:
  preview:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 差分を PR にコメントする
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PREVIEW_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: pulumi/.bun-version
      - run: bun install --frozen-lockfile
        working-directory: pulumi
      # bun は .ts を走らせるだけで型は見ない
      - run: bun run typecheck
        working-directory: pulumi

      - uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: prod
          work-dir: pulumi
          cloud-url: ${{ secrets.PULUMI_BACKEND_URL }}
          pulumi-version-file: pulumi/.pulumi-version
          comment-on-pr: true
          edit-pr-comment: true
          # 毎週の実行は実物を読み直し、1 つでも差分があれば落とす(= Cloudflare 側を直接いじった)
          refresh: ${{ github.event_name == 'schedule' }}
          expect-no-changes: ${{ github.event_name == 'schedule' }}

      - if: github.event_name != 'pull_request'
        run: bun report.ts
        working-directory: pulumi

  up:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pulumi-apply
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: pulumi/.bun-version
      - run: bun install --frozen-lockfile
        working-directory: pulumi
      - run: bun run typecheck
        working-directory: pulumi

      - uses: pulumi/actions@v7
        with:
          command: up
          stack-name: prod
          work-dir: pulumi
          cloud-url: ${{ secrets.PULUMI_BACKEND_URL }}
          pulumi-version-file: pulumi/.pulumi-version
          always-include-summary: true
