# bootstrap/render.sh の machine config を runner の QEMU(KVM)で起動し、クラスタが立つところまで見る。
# 秘密はゼロ(使い捨てとダミー)。外に副作用を出さない: ArgoCD の extraObjects と通知先、
# 本物の ClusterIssuer(自己署名に差し替え)、infisical の SMTP を抜く。手順の元は docs/talos.md。
name: talos boot

on:
  pull_request:
    # YAML のアンカーは読むが、マージキー `<<:` は読まない
    paths: &paths
      - bootstrap/**
      - apps/argocd/httproute.yaml
      - apps/gateway/**
      - .github/workflows/talos-boot.yml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# PR では古い方を止める。main は止めない
concurrency:
  group: talos-boot-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 本番と同じアドレス。SLIRP の網をこれに合わせて、machine config の住所は書き換えない
  NODE: 10.0.0.2
  TALOSCONFIG: /tmp/out/talosconfig
  KUBECONFIG: /tmp/kubeconfig
  # 3 枚の NIC の MAC。名前は maintenance mode で MAC から引く(VM の名前は QEMU の挿し方で変わる)
  MAC_ENO1: 52:54:00:00:00:01
  MAC_ENO2: 52:54:00:00:00:02
  MAC_ENO4: 52:54:00:00:00:04

jobs:
  boot:
    runs-on: ubuntu-latest
    # 実測 8 分(PVC と再起動を足す前)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: bootstrap/talos.sops.yaml の先頭のコメントから版と schematic を読む
        id: v
        run: |
          set -euo pipefail
          # render.sh の tver と同じ読み方(`# renovate:` の depName の次の `# version:`)
          tver() { awk -v dep="depName=$1" 'f {if (sub(/^# version: */, "")) print; exit} /^# renovate: / && $NF == dep {f=1}' bootstrap/talos.sops.yaml; }
          VER=$(tver siderolabs/talos)
          SCH=$(sed -n '/^# schematic: /{s/^# schematic: *//p;q;}' bootstrap/talos.sops.yaml)
          K8S=$(tver kubernetes/kubernetes)
          [ -n "$VER" ] && [ -n "$SCH" ] && [ -n "$K8S" ] || { echo "::error::talos.sops.yaml から版を読めなかった"; exit 1; }
          echo "  talos=$VER schematic=$SCH k8s=$K8S"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "schematic=$SCH" >> "$GITHUB_OUTPUT"
          echo "k8s=$K8S" >> "$GITHUB_OUTPUT"

      - name: QEMU・talosctl・kubectl を入れる
        run: |
          set -euo pipefail
          # runner の /dev/kvm は root しか開けない
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 ovmf zstd >/dev/null
          sudo curl -fsSL -o /usr/local/bin/talosctl \
            "https://github.com/siderolabs/talos/releases/download/${{ steps.v.outputs.version }}/talosctl-linux-amd64"
          sudo curl -fsSL -o /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/${{ steps.v.outputs.k8s }}/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/talosctl /usr/local/bin/kubectl
          talosctl version --client --short
          kubectl version --client

      - name: ディスクイメージを取る
        run: |
          set -euo pipefail
          # VM のディスクは疎なファイルで、ゲストが書いた分だけ runner のディスクを食う(イメージの取得で十数 GB)。
          # 置き場が埋まるとゲストには I/O エラーとして見え、etcd が落ちてクラスタが上がらない(2026-10-23)。
          # **/tmp には置かない。** runner の /tmp は 8 GB ほどの別のファイルシステム(/ は 88 GB 空いていても)。
          # /tmp/vm は後の手順のための名前だけにして、実体は RUNNER_TEMP(/ の上)と /mnt のうち空きの大きい方に置く
          df -h / /tmp /mnt "$RUNNER_TEMP" 2>/dev/null || true
          free_kb() { df -Pk "$1" 2>/dev/null | awk 'NR==2 {print $4}'; }
          dir=$RUNNER_TEMP/vm
          if [ -d /mnt ] && [ "$(free_kb /mnt || echo 0)" -gt "$(free_kb "$RUNNER_TEMP")" ]; then
            sudo mkdir -p /mnt/vm && sudo chown "$(id -u):$(id -g)" /mnt/vm && dir=/mnt/vm
          fi
          mkdir -p "$dir" && ln -sfn "$dir" /tmp/vm
          echo "VM のディスク: $(readlink -f /tmp/vm)($(df -h "$(readlink -f /tmp/vm)" | awk 'NR==2 {print $4}') 空き)"
          curl -fsSL --retry 3 \
            "https://factory.talos.dev/image/${{ steps.v.outputs.schematic }}/${{ steps.v.outputs.version }}/metal-amd64.raw.zst" \
            | zstd -d -o /tmp/vm/disk.raw
          # EPHEMERAL の maxSize 64GiB と r-lvm(LVM の PV)の minSize 50GiB が両方取れる大きさ
          truncate -s 140G /tmp/vm/disk.raw
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/vm/OVMF_VARS.fd

      - name: machine config を生成する
        run: |
          set -euo pipefail
          talosctl gen secrets -o /tmp/secrets.yaml
          # talos.sops.yaml は password(fj.doany.io)だけ暗号化してある。ダミーに置き換える
          # (ダミーは fj.doany.io に置いたまま。ghcr.io に置くと kubelet の取得が 403 で落ちる)
          yq 'del(.sops) | (.. | select(tag == "!!str" and test("^ENC\\["))) |= "ci-dummy"' \
            bootstrap/talos.sops.yaml > /tmp/controlplane.yaml
          # <name>-values.sops.yaml も秘密の値だけ暗号化してある。平文の部分は本物を使う。
          # argocd: 秘密(通知先と GitHub App の鍵)は抜く。extraObjects は app-of-apps と repo-creds。CI で本物を同期させない
          yq -I4 'del(.sops) | del(.notifications.notifiers) | del(.githubAppRepoCreds.stringData.githubAppPrivateKey)
            | .extraObjects = []' \
            bootstrap/argocd-values.sops.yaml > /tmp/argocd-values.yaml
          # infisical: 1 つめ(chart の値)はパスワードをダミーにして SMTP の env を抜く。2 つめ(Secret)は作り直す
          # (ENCRYPTION_KEY は 16 バイトの hex でないと infisical が起動しない)。render.sh は `---` で分ける
          {
            yq -I4 'select(document_index == 0) | del(.sops)
              | (.. | select(tag == "!!str" and test("^ENC\\["))) |= "ci-dummy"
              | .infisical.extraEnv |= map(select(.name | test("^SMTP_") | not))' \
              bootstrap/infisical-values.sops.yaml
            echo ---
            yq -I4 "select(document_index == 1) | del(.sops)
              | del(.stringData.CLIENT_ID_GITHUB_LOGIN) | del(.stringData.CLIENT_SECRET_GITHUB_LOGIN)
              | .stringData.ENCRYPTION_KEY = \"$(openssl rand -hex 16)\"
              | .stringData.AUTH_SECRET = \"$(openssl rand -base64 32)\"
              | .stringData.TELEMETRY_ENABLED = \"false\"" \
              bootstrap/infisical-values.sops.yaml
          } > /tmp/infisical-values.yaml
          # cert-manager: 2 つめ(DNS-01 の Secret)のトークンをダミーに
          yq -I4 'del(.sops) | (.. | select(tag == "!!str" and test("^ENC\\["))) |= "ci-dummy"' \
            bootstrap/cert-manager-values.sops.yaml > /tmp/cert-manager-values.yaml
          for f in /tmp/controlplane.yaml /tmp/argocd-values.yaml /tmp/infisical-values.yaml /tmp/cert-manager-values.yaml; do
            ! grep -q 'ENC\[' "$f" || { echo "::error::$f に暗号文が残っている"; exit 1; }
          done
          SECRETS=/tmp/secrets.yaml CONTROLPLANE=/tmp/controlplane.yaml \
            ARGOCD_VALUES=/tmp/argocd-values.yaml INFISICAL_VALUES=/tmp/infisical-values.yaml \
            CERT_MANAGER_VALUES=/tmp/cert-manager-values.yaml \
            ./bootstrap/render.sh /tmp/out
          talosctl config endpoint 127.0.0.1
          talosctl config node "$NODE"

      - name: VM を起動する
        run: |
          set -euo pipefail
          # runner は 16G なので 8G(12G だと runner が苦しい)。bond0(eno1 + eno2)はハブ越しに本番と同じ網の SLIRP へ。
          # dhcpstart は maintenance mode でも hostfwd の宛先に居させるため。ipv4=on は省けない(ipv6=on だけだと IPv4 が無効)。
          # virtio-scsi は /dev/sda に見えるので diskSelector を書き換えずに済む。
          qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host -smp 4 -m 8192 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=/tmp/vm/OVMF_VARS.fd \
            -device virtio-scsi-pci,id=scsi0 \
            -drive file=/tmp/vm/disk.raw,format=raw,if=none,id=d0,cache=unsafe,discard=unmap \
            -device scsi-hd,drive=d0,bus=scsi0.0 \
            -netdev "user,id=up,net=10.0.0.0/24,host=10.0.0.1,dhcpstart=$NODE,ipv4=on,ipv6=on,ipv6-net=240f:6d:842b:1::/64,ipv6-host=240f:6d:842b:1::1,hostfwd=tcp:127.0.0.1:50000-$NODE:50000,hostfwd=tcp:127.0.0.1:6443-$NODE:6443,hostfwd=tcp:127.0.0.1:18080-$NODE:80,hostfwd=tcp:127.0.0.1:18443-$NODE:443" \
            -netdev hubport,id=hub-up,hubid=0,netdev=up \
            -netdev hubport,id=hub1,hubid=0 -device virtio-net-pci,netdev=hub1,mac=$MAC_ENO1 \
            -netdev hubport,id=hub2,hubid=0 -device virtio-net-pci,netdev=hub2,mac=$MAC_ENO2 \
            -netdev user,id=lan10,net=10.10.0.0/24,host=10.10.0.1,ipv6=off,restrict=on \
            -device virtio-net-pci,netdev=lan10,mac=$MAC_ENO4 \
            -display none -serial file:/tmp/vm/serial.log \
            -daemonize -pidfile /tmp/vm/qemu.pid

      - name: maintenance mode で NIC の名前を引いて config を当てる
        timeout-minutes: 5
        run: |
          set -euo pipefail
          until talosctl get links --insecure -e 127.0.0.1 -n 127.0.0.1 -o json > /tmp/links.json 2>/dev/null; do sleep 5; done
          name() { jq -rs --arg m "$1" '.[] | select(.spec.hardwareAddr == $m) | .metadata.id' /tmp/links.json; }
          N1=$(name "$MAC_ENO1"); N2=$(name "$MAC_ENO2"); N4=$(name "$MAC_ENO4")
          echo "  eno1 -> $N1  eno2 -> $N2  eno4 -> $N4"
          [ -n "$N1" ] && [ -n "$N2" ] && [ -n "$N4" ] || { echo "::error::NIC の名前が引けない"; exit 1; }
          # NIC は MAC で選ぶ(LinkAliasConfig)ので、実機の MAC を VM の MAC に差し替える。sysctl はカーネルの名前で書くので名前も
          sed -e "s/30:e1:71:60:fe:a8/$MAC_ENO1/g" -e "s/30:e1:71:60:fe:a9/$MAC_ENO2/g" -e "s/30:e1:71:60:fe:ab/$MAC_ENO4/g" \
            -e "s/\beno4\b/$N4/g" /tmp/out/controlplane.yaml > /tmp/vm/controlplane.yaml
          talosctl apply-config --insecure -e 127.0.0.1 -n 127.0.0.1 -f /tmp/vm/controlplane.yaml

      - name: bootstrap して kubeconfig を取る
        timeout-minutes: 8
        run: |
          set -euo pipefail
          until talosctl version >/dev/null 2>&1; do sleep 5; done
          until talosctl bootstrap 2>/dev/null; do sleep 5; done
          talosctl kubeconfig "$KUBECONFIG" --force
          kubectl config set-cluster doany --server=https://127.0.0.1:6443
          until kubectl get --raw /readyz >/dev/null 2>&1; do sleep 5; done
          echo "  API サーバが応答した"

      - name: ノードと bootstrap 層が上がるのを待つ
        timeout-minutes: 12
        run: |
          set -euo pipefail
          # inlineManifest は順に流れるので、在るまで待ってから rollout status
          ro() { # $1=namespace  $2=kind/name
            until kubectl -n "$1" get "$2" >/dev/null 2>&1; do sleep 5; done
            kubectl -n "$1" rollout status "$2" --timeout=10m
          }
          until kubectl get node main >/dev/null 2>&1; do sleep 5; done
          kubectl wait --for=condition=Ready node/main --timeout=10m
          V=$(kubectl get node main -o jsonpath='{.status.nodeInfo.kubeletVersion}')
          [ "$V" = "${{ steps.v.outputs.k8s }}" ] || { echo "::error::kubelet が $V(talos.sops.yaml は ${{ steps.v.outputs.k8s }})"; exit 1; }
          echo "  node/main Ready, $V"
          ro kube-system ds/cilium
          ro kube-system ds/cilium-envoy
          ro kube-system deploy/cilium-operator
          ro kube-system deploy/coredns
          until kubectl -n kube-system get secret hubble-server-certs hubble-relay-client-certs >/dev/null 2>&1; do sleep 5; done
          ro kube-system deploy/hubble-relay
          ro kube-system deploy/hubble-ui
          # PVC の置き場(bootstrap/storage.yaml)。thin プールが出来てラベルが付くまで OpenEBS のノードの Pod は出てこない
          ro kube-system ds/lvm-thinpool
          ro kube-system ds/lvm-localpv-node
          ro kube-system deploy/lvm-localpv-controller
          ro kube-system deploy/snapshot-controller
          ro cert-manager deploy/cert-manager
          ro cert-manager deploy/cert-manager-webhook
          ro cert-manager deploy/cert-manager-cainjector
          ro argocd deploy/argocd-server
          ro argocd deploy/argocd-repo-server
          ro argocd sts/argocd-application-controller
          # postgres の PVC は既定の StorageClass(OpenEBS LVM の thin)なので、ここで PV の経路も見ている
          ro infisical deploy/infisical
          kubectl -n infisical wait --for=jsonpath='{.status.phase}'=Bound pvc --all --timeout=1m
          # 上の一覧に無い Pod の取りこぼし止め
          for i in $(seq 24); do
            BAD=$(kubectl get pods -A --no-headers --field-selector=status.phase!=Running,status.phase!=Succeeded)
            [ -z "$BAD" ] && break
            sleep 5
          done
          [ -z "$BAD" ] || { echo "$BAD"; echo "::error::Running でない Pod がある"; exit 1; }
          # Kubernetes 側の項目は SKIP になるので上で見ている
          talosctl health --wait-timeout 5m

      - name: GatewayClass と Gateway
        timeout-minutes: 8
        run: |
          set -euo pipefail
          until kubectl get gatewayclass cilium >/dev/null 2>&1; do sleep 5; done
          kubectl wait --for=condition=Accepted gatewayclass/cilium --timeout=3m
          # 本物の ClusterIssuer と同じ名前の自己署名
          cat > /tmp/issuer.yaml <<'YAML'
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt
          spec:
            selfSigned: {}
          YAML
          until kubectl apply -f /tmp/issuer.yaml 2>/dev/null; do sleep 5; done
          until kubectl apply -f apps/gateway/gateway.yaml -f apps/gateway/redirect-https.yaml -f apps/argocd/httproute.yaml; do sleep 5; done
          kubectl -n kube-system wait --for=condition=Ready certificate --all --timeout=3m
          kubectl -n kube-system wait --for=condition=Programmed gateway/doany --timeout=3m
          # http は https への 301、https は argocd-server まで
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$@" || true; }
          for i in $(seq 36); do
            H=$(code -H 'Host: ac.doany.io' http://127.0.0.1:18080/)
            S=$(code -k --resolve ac.doany.io:18443:127.0.0.1 https://ac.doany.io:18443/)
            echo "  http=$H https=$S"
            [ "$H" = 301 ] && [ "$S" = 200 ] && exit 0
            sleep 5
          done
          echo "::error::Gateway を通らない(http=$H https=$S。期待は 301 / 200)"
          exit 1

      - name: ディスクとネットワーク
        timeout-minutes: 5
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          talosctl get volumestatus -o json > /tmp/vol.json
          for v in EPHEMERAL r-lvm; do
            P=$(jq -rs --arg v "$v" '.[] | select(.metadata.id == $v) | .spec.phase' /tmp/vol.json)
            [ "$P" = ready ] || fail "volume $v が ready でない($P)"
            echo "  volume $v: $P"
          done

          WANT=$(yq -r 'select(.kind == "BondConfig") | .hardwareAddr' bootstrap/talos.sops.yaml)
          GOT=$(talosctl get links bond0 -o json | jq -r .spec.hardwareAddr)
          [ "$GOT" = "$WANT" ] || fail "bond0 の MAC が $GOT(talos.sops.yaml は $WANT)"
          echo "  bond0 hardwareAddr: $GOT"

          # 以下は forwarding=1 のあとで見ないと意味が無い(talos.sops.yaml の accept_ra)
          F=$(talosctl read /proc/sys/net/ipv6/conf/bond0/forwarding)
          [ "$F" = 1 ] || fail "bond0 の forwarding が $F。前提が成り立っていない"

          # グローバルな IPv6 は静的な ::2 だけ(SLAAC は autoconf=0 で止めている)
          STATIC=$(yq -r 'select(.kind == "BondConfig") | .addresses[].address | select(test(":"))' bootstrap/talos.sops.yaml)
          GLOBAL=$(talosctl get addresses -o json \
            | jq -rs '.[] | select(.spec.linkName == "bond0" and .spec.family == "inet6" and .spec.scope != "link") | .spec.address' | sort)
          echo "  bond0 の IPv6(link-local 以外): $(echo $GLOBAL)"
          [ "$GLOBAL" = "$STATIC" ] || fail "bond0 のグローバル IPv6 が静的な $STATIC だけになっていない"

          # SLIRP の RA は間隔が長いので待つ
          for i in $(seq 24); do
            R=$(talosctl get routes -o json \
              | jq -rs '[.[] | select(.spec.family == "inet6" and .spec.outLinkName == "bond0" and (.spec.dst // "") == "" and .spec.protocol == "ra")] | length')
            [ "$R" -gt 0 ] && { echo "  IPv6 の既定経路(RA)あり"; exit 0; }
            sleep 5
          done
          fail "bond0 に RA 由来の IPv6 既定経路が無い"

      - name: PVC・スナップショット・スナップショットからの戻し
        timeout-minutes: 8
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          # thin プールは VG の 90%(bootstrap/storage.yaml)。OpenEBS が最初の PVC の大きさで作ったものではないこと
          kubectl -n kube-system exec ds/lvm-thinpool -c watch -- lvs -a -o lv_name,lv_size,data_percent,metadata_percent,lv_attr data
          VG=$(kubectl -n kube-system exec ds/lvm-thinpool -c watch -- vgs --noheadings --units b --nosuffix -o vg_size data | tr -d ' ')
          POOL=$(kubectl -n kube-system exec ds/lvm-thinpool -c watch -- lvs --noheadings --units b --nosuffix -o lv_size data/data_thinpool | tr -d ' ')
          [ $((POOL * 100 / VG)) -ge 85 ] || fail "thin プールが VG の $((POOL * 100 / VG))%(90% のはず)"

          # 既定の StorageClass で書き、スナップショットを取り、そこから別の PVC を作って同じ中身が読めるか(VolSync の populator の前提)
          cat > /tmp/pvc.yaml <<'YAML'
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: t-src
          spec:
            accessModes: [ReadWriteOnce]
            resources: {requests: {storage: 1Gi}}
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: t-src
          spec:
            securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
            containers:
              - name: c
                image: mirror.gcr.io/library/busybox:1.38
                # 再起動で起き直しても書き直さない(下の「再起動しても PV が戻る」が中身の残りを見る)
                command: [sh, -c, '[ -f /data/marker ] || echo hello > /data/marker; sleep 86400']
                securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
                volumeMounts: [{name: v, mountPath: /data}]
            volumes: [{name: v, persistentVolumeClaim: {claimName: t-src}}]
          YAML
          kubectl apply -f /tmp/pvc.yaml
          kubectl wait --for=condition=Ready pod/t-src --timeout=3m
          kubectl wait --for=jsonpath='{.status.phase}'=Bound pvc/t-src --timeout=1m
          [ "$(kubectl exec t-src -- cat /data/marker)" = hello ] || fail "PVC に書けていない"
          FS=$(kubectl exec t-src -- sh -c "grep ' /data ' /proc/mounts | cut -d' ' -f3")
          [ "$FS" = xfs ] || fail "PVC が xfs でない($FS)"
          echo "  PVC t-src: Bound, xfs, 書けた"

          cat > /tmp/snap.yaml <<'YAML'
          apiVersion: snapshot.storage.k8s.io/v1
          kind: VolumeSnapshot
          metadata:
            name: t-snap
          spec:
            source: {persistentVolumeClaimName: t-src}
          YAML
          kubectl apply -f /tmp/snap.yaml
          kubectl wait --for=jsonpath='{.status.readyToUse}'=true volumesnapshot/t-snap --timeout=3m
          echo "  VolumeSnapshot t-snap: readyToUse(既定の VolumeSnapshotClass $(kubectl get volumesnapshot t-snap -o jsonpath='{.spec.volumeSnapshotClassName}'))"

          # t-dst はスナップショットの中身を読むだけ(書かない)
          sed -e 's/name: t-src$/name: t-dst/' -e 's/claimName: t-src/claimName: t-dst/' \
            -e 's/\[ -f \/data\/marker \] || echo hello > \/data\/marker; //' /tmp/pvc.yaml \
            | yq '(select(.kind == "PersistentVolumeClaim") | .spec.dataSource) = {"apiGroup": "snapshot.storage.k8s.io", "kind": "VolumeSnapshot", "name": "t-snap"}' \
            > /tmp/dst.yaml
          ! grep -q 'echo hello' /tmp/dst.yaml || fail "t-dst が書いてしまう形になっている"
          grep -q 'kind: VolumeSnapshot' /tmp/dst.yaml || fail "t-dst に dataSource が付いていない"
          kubectl apply -f /tmp/dst.yaml
          kubectl wait --for=condition=Ready pod/t-dst --timeout=3m
          [ "$(kubectl exec t-dst -- cat /data/marker)" = hello ] || fail "スナップショットから戻した PVC に中身が無い"
          echo "  PVC t-dst(t-snap から): 中身が戻った"
          kubectl -n kube-system exec ds/lvm-thinpool -c watch -- lvs -a -o lv_name,lv_size,pool_lv,origin,data_percent data

      - name: 再起動しても PV が戻る
        timeout-minutes: 10
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          # thin プールと LV は Talos が起動時に有効にする(thin_check が無いのは飛ばされる)。
          # lvm-thinpool の pool も起動のたびに走るので、壊さないことも見ている
          talosctl reboot --wait --timeout 8m
          until kubectl get --raw /readyz >/dev/null 2>&1; do sleep 5; done
          kubectl wait --for=condition=Ready node/main --timeout=5m
          for p in t-src t-dst; do
            until kubectl wait --for=condition=Ready "pod/$p" --timeout=10s >/dev/null 2>&1; do sleep 5; done
            [ "$(kubectl exec "$p" -- cat /data/marker)" = hello ] || fail "再起動のあと $p の中身が無い"
          done
          kubectl -n infisical rollout status statefulset/postgresql --timeout=5m
          kubectl -n kube-system rollout status ds/lvm-thinpool --timeout=3m
          kubectl -n kube-system logs ds/lvm-thinpool -c pool
          echo "  再起動のあとも t-src・t-dst・infisical の Postgres が上がった"

      - name: 失敗したときの様子
        if: failure()
        run: |
          set +e
          # ゲストの I/O エラーは runner のディスクが埋まったときに出る(上の「ディスクイメージを取る」)
          echo "::group::runner のディスク"; df -h / /tmp /mnt "$(readlink -f /tmp/vm)" 2>/dev/null; du -h --apparent-size /tmp/vm/disk.raw; du -h /tmp/vm/disk.raw; echo "::endgroup::"
          echo "::group::kubectl get pods -A"; kubectl get pods -A -o wide; echo "::endgroup::"
          echo "::group::events"; kubectl get events -A --sort-by=.lastTimestamp | tail -150; echo "::endgroup::"
          echo "::group::Running でない Pod の describe"
          kubectl get pods -A --no-headers | awk '$4 != "Running" && $4 != "Completed" {print $1, $2}' \
            | while read -r ns p; do kubectl -n "$ns" describe pod "$p" | tail -40; done
          echo "::endgroup::"
          echo "::group::GatewayClass / Gateway / Certificate"
          kubectl get gatewayclass,gateway -A -o yaml; kubectl get certificate -A
          echo "::endgroup::"
          echo "::group::PVC の置き場(LVM)"
          kubectl get sc,volumesnapshotclass,pvc,pv,volumesnapshot,volumesnapshotcontent -A
          kubectl -n kube-system get lvmnode,lvmvolume,lvmsnapshot -o yaml | tail -120
          kubectl -n kube-system logs ds/lvm-thinpool -c pool --tail=50
          kubectl -n kube-system logs ds/lvm-localpv-node -c openebs-lvm-plugin --tail=80
          kubectl -n kube-system logs deploy/lvm-localpv-controller -c openebs-lvm-plugin --tail=50
          kubectl -n kube-system logs deploy/lvm-localpv-controller -c csi-provisioner --tail=50
          kubectl -n kube-system logs deploy/lvm-localpv-controller -c csi-snapshotter --tail=50
          kubectl -n kube-system logs deploy/snapshot-controller --tail=50
          talosctl get volumestatus
          talosctl get rd | awk 'tolower($4) ~ /lvm/ {print $4}' | while read -r r; do talosctl get "$r" -o yaml 2>/dev/null | head -60; done
          echo "::endgroup::"
          echo "::group::talosctl services"; talosctl services; echo "::endgroup::"
          echo "::group::talosctl get links / addresses / routes"
          talosctl get links; talosctl get addresses; talosctl get routes
          echo "::endgroup::"
          echo "::group::talosctl dmesg(末尾)"; talosctl dmesg | tail -300; echo "::endgroup::"
          echo "::group::serial(末尾)"; tail -200 /tmp/vm/serial.log; echo "::endgroup::"

      - name: VM を止める
        if: always()
        run: |
          [ -f /tmp/vm/qemu.pid ] && kill "$(cat /tmp/vm/qemu.pid)" || true
