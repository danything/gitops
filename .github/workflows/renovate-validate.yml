# renovate.json の見張り。壊れていても Renovate は黙って止まるだけで気づきにくい
# (知らないキーは `ignorePathsDescription` のようなものもエラー)。
name: renovate validate

on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate-validate.yml
  push:
    branches: [main]
    paths:
      - renovate.json

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
      # 版は固定しない(最新の Renovate が受け付けるかを見る)
      - run: npx --yes --package renovate renovate-config-validator --strict
