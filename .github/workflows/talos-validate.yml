# talos/render.sh が machine config を作れるか、中身が想定どおりか(needle は render.sh)を PR ごとに検証する。
# **クラスタにも実機にも触らず、適用もしない**(talos/README.md「適用は CI にやらせない」)。
name: talos validate

on:
  # bootstrap/ の chart の値と版も render.sh が読むので、そこを直したときも見る
  pull_request:
    paths:
      - talos/**
      - bootstrap/cilium/**
      - bootstrap/cert-manager/**
      - .github/workflows/talos-validate.yml
  push:
    branches: [main]
    paths:
      - talos/**
      - bootstrap/cilium/**
      - bootstrap/cert-manager/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: talosctl を入れる
        run: |
          set -euo pipefail
          VER=$(yq -r '.talos.version' talos/versions.yaml)
          curl -fsSL -o /usr/local/bin/talosctl \
            "https://github.com/siderolabs/talos/releases/download/$VER/talosctl-linux-amd64"
          chmod +x /usr/local/bin/talosctl
          talosctl version --client

      - name: machine config を生成する
        run: |
          set -euo pipefail
          # **本番と同じ道具で作る。** ここで別の作り方をすると、CI が通っても当日は通らない、が起こる。
          # 生成物の中身の確かめ(needle)も render.sh がやる。
          #
          # **秘密は使い捨てとダミー。** 本物は SOPS 済みで、age の鍵は CI に渡さない。
          # SECRETS などを渡すと render.sh は sops を呼ばない。
          talosctl gen secrets -o /tmp/secrets.yaml
          cat > /tmp/registries.yaml <<'PATCH'
          machine:
            registries:
              config:
                fj.doany.io:
                  auth:
                    username: ci-dummy
                    password: ci-dummy
          PATCH
          # **argocd / infisical の HelmChart CR もダミーで渡す。** 本物は SOPS 済みで、
          # age の鍵は CI に渡さない。値は既定のままでよく、**確かめたいのは
          # 「CR から chart/repo/version/values を取り出して helm template まで通るか」**と、
          # **CRD が URL 側に出て inline に入らないこと**。
          cat > /tmp/argocd-chart.yaml <<'PATCH'
          apiVersion: helm.cattle.io/v1
          kind: HelmChart
          metadata:
              name: argocd
          spec:
              chart: argo-cd
              repo: https://argoproj.github.io/argo-helm
              version: 10.8.1
              targetNamespace: argocd
              values:
                  dex:
                      enabled: false
          PATCH
          cat > /tmp/infisical-chart.yaml <<'PATCH'
          apiVersion: helm.cattle.io/v1
          kind: HelmChart
          metadata:
              name: infisical
          spec:
              chart: infisical-standalone
              repo: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
              version: 1.10.0
              targetNamespace: infisical
              values:
                  infisical:
                      fullnameOverride: infisical
          PATCH
          # **SOPS 済みの Secret もダミーで。** 中身は見ないので、名前と形だけ合わせる。
          cat > /tmp/infisical-secret.yaml <<'PATCH'
          apiVersion: v1
          kind: Secret
          metadata:
            name: infisical-secrets
            namespace: infisical
          type: Opaque
          stringData:
            ENCRYPTION_KEY: ci-dummy
          PATCH
          cat > /tmp/cloudflare-secret.yaml <<'PATCH'
          apiVersion: v1
          kind: Secret
          metadata:
            name: cloudflare-secret
            namespace: cert-manager
          type: Opaque
          stringData:
            CF_DNS_API_TOKEN: ci-dummy
          PATCH
          SECRETS=/tmp/secrets.yaml REGISTRIES=/tmp/registries.yaml \
            ARGOCD_CHART=/tmp/argocd-chart.yaml INFISICAL_CHART=/tmp/infisical-chart.yaml \
            INFISICAL_SECRET=/tmp/infisical-secret.yaml CLOUDFLARE_SECRET=/tmp/cloudflare-secret.yaml \
            ./talos/render.sh /tmp/out
