# bootstrap/ を main へのマージ時にクラスタへ当てる。
#
# **保存している秘密はゼロ。** GitHub Actions の OIDC トークンを API サーバが直接受ける
# (bootstrap/apiserver/authentication-config.yaml)。kubeconfig も age 鍵も置いていない。
#
# **SOPS で暗号化した 4 ファイルは当てない**(復号鍵を GitHub に置かないため)。
# あれらは滅多に変わらないので手で当てる。判定はファイルの中身を見てやっているので、
# 暗号化ファイルが増えても自動で除外される。
name: bootstrap apply

on:
  push:
    branches: [main]
    paths:
      - bootstrap/**
      - .github/workflows/bootstrap-apply.yml
  workflow_dispatch:

# 同時に 2 つ走らせない
concurrency: bootstrap-apply

permissions:
  # OIDC トークンの発行にこれが要る
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 当てるファイルを決める
        id: files
        run: |
          set -euo pipefail
          # 除外するもの:
          #   cilium/values.yaml   Helm の値でマニフェストではない
          #   apiserver/           **ここを当てさせない。** rbac.yaml を当てられると
          #                        ワークフローが自分の権限を書き換えられてしまう。
          #                        authentication-config.yaml はそもそも k8s の
          #                        リソースではない(API サーバに渡すファイル)
          #   `sops:` を含むもの   SOPS で暗号化済み。復号鍵を GitHub に置かない
          mapfile -d '' FILES < <(
            find bootstrap -name '*.yaml' \
              ! -path 'bootstrap/cilium/*' \
              ! -path 'bootstrap/apiserver/*' -print0 \
              | xargs -0 grep -LZ '^sops:'
          )
          printf '  %s\n' "${FILES[@]}"
          printf 'list=%s\n' "$(printf -- '-f %s ' "${FILES[@]}")" >> "$GITHUB_OUTPUT"

      - name: OIDC トークンを取る
        id: token
        run: |
          set -euo pipefail
          T=$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://ks.doany.io" | jq -r .value)
          # ログに出さない
          echo "::add-mask::${T}"
          echo "token=${T}" >> "$GITHUB_OUTPUT"

      - name: 差分を出す（先に見る）
        env:
          T: ${{ steps.token.outputs.token }}
        run: |
          kubectl --server=https://ks.doany.io:6443 \
                  --certificate-authority=bootstrap/apiserver/ca.crt \
                  --token="$T" \
                  diff ${{ steps.files.outputs.list }} || true

      - name: apply
        env:
          T: ${{ steps.token.outputs.token }}
        run: |
          kubectl --server=https://ks.doany.io:6443 \
                  --certificate-authority=bootstrap/apiserver/ca.crt \
                  --token="$T" \
                  apply ${{ steps.files.outputs.list }}

      # **Gateway の Service の nodePort を 80/443 に揃える。**
      # これは git に書けない唯一の値で、しかも**公開経路そのもの**
      # (Cilium の L7LB リダイレクト。bootstrap/cilium/values.yaml の `nodePort` に実測あり)。
      # Cilium が Service を作り直すと API サーバが範囲内のランダムな値を割り当てるので、
      # **復元後は必ずズレている。**
      #
      # k3s 期は `recovery/restore.sh` が当てているが、**Talos にはシェルが無い**ので
      # あちらは持っていけない。復元手順を「machine config を当てる →
      # このワークフローを `workflow_dispatch` で流す」にすると、両方の時代で同じ形になる。
      #
      # 冪等。既に 80/443 なら `unchanged` になるだけ。Service がまだ無ければ黙って諦める
      # (Cilium が Gateway を処理する前に流したとき)。
      - name: Gateway の nodePort を 80/443 に揃える
        env:
          T: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          k() {
            kubectl --server=https://ks.doany.io:6443 \
                    --certificate-authority=bootstrap/apiserver/ca.crt \
                    --token="$T" "$@"
          }
          if ! k -n kube-system get svc cilium-gateway-doany >/dev/null 2>&1; then
            echo "::warning::cilium-gateway-doany がまだ無い。Gateway が上がってから再実行すること"
            exit 0
          fi
          k -n kube-system patch svc cilium-gateway-doany --type=json -p '[
            {"op":"replace","path":"/spec/ports/0/nodePort","value":80},
            {"op":"replace","path":"/spec/ports/1/nodePort","value":443}
          ]'
          k -n kube-system get svc cilium-gateway-doany \
            -o jsonpath='{range .spec.ports[*]}{.name}={.nodePort} {end}'
          echo
