# **一時的。** NetBird の今の設定 (名前と ID) をログに出し、pulumi/netbird.ts に書き起こすためのもの。
# 取り込みの PR をマージする前に消す。トークンは preview 用 (Auditor、読み取りだけ)。
name: netbird-discover

on:
  pull_request:
    paths:
      - .github/workflows/netbird-discover.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      NB_PAT: ${{ secrets.PREVIEW_NB_PAT }}
      API: https://nb.doany.io/api
    steps:
      - run: |
          get() { curl -fsS -H "Authorization: Token $NB_PAT" -H "Accept: application/json" "$API/$1"; }
          echo "== groups";            get groups | jq -c '.[] | {id, name, issued, peers_count, resources_count}'
          echo "== peers";             get peers | jq -c '.[] | {id, name, groups: [.groups[].name]}'
          echo "== dns settings";      get dns/settings | jq -c .
          echo "== nameservers";       get dns/nameservers | jq -c '.[]'
          echo "== dns zones";         get dns/zones | jq -c '.[] | {id, name, domain, enabled, enable_search_domain, distribution_groups}'
          for z in $(get dns/zones | jq -r '.[].id'); do
            echo "== dns records $z";  get "dns/zones/$z/records" | jq -c '.[]'
          done
          echo "== networks";          get networks | jq -c '.[] | {id, name, description, routers, resources, policies}'
          for n in $(get networks | jq -r '.[].id'); do
            echo "== network routers $n";   get "networks/$n/routers" | jq -c '.[]'
            echo "== network resources $n"; get "networks/$n/resources" | jq -c '.[] | del(.groups) + {groups: [.groups[].id]}'
          done
          echo "== routes";            get routes | jq -c '.[]'
          echo "== policies";          get policies | jq -c '.[] | {id, name, description, enabled, source_posture_checks, rules: [.rules[] | {id, name, enabled, action, bidirectional, protocol, ports, port_ranges, sources: [.sources[]?.id], destinations: [.destinations[]?.id], destinationResource, sourceResource}]}'
          echo "== posture checks";    get posture-checks | jq -c '.[]'
          echo "== setup keys";        get setup-keys | jq -c '.[] | {id, name, type, auto_groups, ephemeral, reusable, expires, revoked, usage_limit}'
          echo "== account settings";  get accounts | jq -c '.[] | {id, settings}'
