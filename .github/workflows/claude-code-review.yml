name: Claude Code Review

on:
  pull_request:
    # **`labeled` が要る。** bot の PR は `opened` の時点ではスキップされるので、
    # あとから `needs-review` を貼っても再実行されなかった(2026-09-07 に #85 で発覚)。
    # 下の `if` がラベルの有無を見ているので、無関係なラベルで起動しても素通りする。
    types: [opened, synchronize, reopened, ready_for_review, labeled]

jobs:
  claude-review:
    # Draft PR はスキップ。fork からの PR も対象外 (secrets が渡らないため) —
    # そちらは claude-code-review-fork.yml がラベル起動で処理する。
    #
    # bot の PR も原則スキップするが、**`needs-review` ラベルが付いていれば見る**。
    # 自分でマージされる PR をレビューしても誰も読まないので飛ばす。人を待つ PR は
    # レビューする価値がある、という切り分け。Renovate は自動マージしないまとまり
    # (メジャーと chart) にだけこのラベルを付ける (5ym/renovate-config)。
    #
    # 実例: #7 に postgres 17 → 18 が入っていた。PVC の PG_VERSION は 17 なので
    # そのまま上げると起動を拒否する。1 行の差分でも、依存そのものに内在するリスクは
    # レビューで拾える。
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        !endsWith(github.event.pull_request.user.login, '[bot]') ||
        contains(github.event.pull_request.labels.*.name, 'needs-review')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # **Renovate の PR をレビューするのに要る。** action 自身が bot 起動を拒否し、
          # `Workflow initiated by non-human actor` で落ちる(2026-09-07 に #85 で発覚)。
          # 上の `if` で「bot は needs-review が付いているときだけ」に絞ってあるので、
          # ここは `*` ではなく renovate だけを名指しする。`*` は公開リポジトリでは
          # 外部の App がプロンプトを持ち込める(action のドキュメントの警告)。
          allowed_bots: "renovate[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このプルリクエストをレビューしてください。回答は日本語で書いてください。

            観点:
            1. 不具合 — ロジックの誤り、null/境界値、エラーハンドリング漏れ、競合状態
            2. セキュリティ — 入力値の検証、認証・認可、シークレットの混入
            3. 設計 — 既存コードとの一貫性、重複、過剰な複雑さ
            4. テスト — 変更に対するテストの有無と質

            進め方:
            - リポジトリの規約 (CLAUDE.md / README / 周辺コード) に従うこと
            - 具体的な問題は該当行にインラインコメントを付けること
            - 全体的な所感は 1 つのトップレベルコメントにまとめること
            - 確信が持てない指摘は「要確認」と明記すること
            - 問題が無ければ簡潔に問題無しと述べること。無理に指摘を作らないこと
            - スタイルの好みだけの指摘や、変更されていない箇所の指摘はしないこと

            依存の更新 PR (Renovate) のとき:
            - **リリースノートを実際に読むこと。** 「未参照」で済ませない。
              Renovate の本文に載っていないことがある (Docker タグの更新では元リポジトリを
              辿れず、Release Notes の節ごと欠ける)。その場合は自分で探す:
              `gh release view <tag> -R <owner>/<repo>` か、無ければ WebFetch で公式の
              リリースノートを読む
            - 見るのは破壊的変更・移行手順・既定値の変更。**このリポジトリの設定と
              突き合わせて**影響を言うこと (例: PVC の PG_VERSION と major の不一致)
            - リリースノートが本当に見つからなければ、探した先を書いたうえで「要確認」とすること

          # WebFetch と gh release はリリースノートを読むため。**読み取りだけ**に絞る。
          # 取ってくる中身は第三者が書いたもので、レビュー本文への指示が混ざりうる
          # (プロンプトインジェクション)。このワークフローはコメントしかできず、
          # マージも push もできないので影響は限定される。
          #
          # **注釈をこのブロックの中に書かないこと。** `claude_args: |` は YAML の
          # ブロックスカラーなので `#` はコメントにならず、そのまま CLI の引数として
          # 渡って --allowedTools の解釈が壊れる(2026-09-07 に踏んだ。レビューが
          # 「WebFetch の権限が無い」と言うのに設定上は許可されている、という形で出た)。
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh release view:*),Bash(gh release list:*),WebFetch"
