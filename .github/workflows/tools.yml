# tools/ のイメージが作れて全部のコマンドが動くかを PR で見る(版で URL の形が変わると 404 になる)。
name: tools

on:
  pull_request:
    paths:
      - tools/**
      - compose.yaml
      - .github/workflows/tools.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tools tools
      - run: >-
          docker run --rm tools sh -euc '
          kubectl version --client; talosctl version --client --short; helm version --short;
          sops --version; age --version; age-keygen --version; infisical --version; restic version;
          pulumi version; bun --version; cf --version'
