# 手元の運用のコマンドを Docker で動かす(tools/README.md)。直接ではなく tools/t から使う
services:
  tools:
    build: tools
    # 手元のユーザーのまま(作ったファイルの持ち主が root にならないように)。tools/t が入れる
    user: "${HOST_UID:?tools/t から動かすこと}:${HOST_GID:?}"
    # cf のログイン(ブラウザから localhost に戻ってくる)と、kubectl / talosctl の接続のため
    network_mode: host
    working_dir: /repo
    environment:
      # **ログインと鍵はリポジトリの .home/ に置く**(.gitignore 済み)。手元のホームは汚さない
      - HOME=/repo/.home
      # 手元で設定しているときだけ渡す
      - INFISICAL_PROFILE
    volumes:
      - .:/repo
