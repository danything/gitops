# 手元の運用のコマンドをコンテナで動かす(tools/README.md)。直接ではなく tools/t.ps1 から使う(wslc-compose)
services:
  tools:
    build: tools
    image: gitops-tools:latest
    # wslc は host ネットワークに対応していない(ブラウザから戻ってくる方式のログインは使えない)
    working_dir: /repo
    environment:
      # ログインと鍵はリポジトリの .home/(.gitignore 済み)
      - HOME=/repo/.home
    volumes:
      - .:/repo
