# ディスクの割り方。既定だと EPHEMERAL(/var)が全部を取り、PVC の暴走で etcd ごと道連れになる。
# ボリュームの設定は未確保のときにしか効かない(あとから書き足しても黙って無視され、直すには入れ直し)。
# EPHEMERAL に maxSize が無いと grow が全部持っていく(siderolabs/talos#12713)。
# 64GiB は実機の使用量(containerd 22G ほか)から。残りが local-path 用。
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  maxSize: 64GiB
  grow: true
---
# PV データの置き場。/var/mnt/<name> 固定で、../manifests/local-path.yaml の paths がここを指す。
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-path
provisioning:
  diskSelector:
    match: system_disk
  minSize: 50GiB
  grow: true
filesystem:
  type: xfs
# /var 系は既定で nosuid,nodev,noexec になり、PVC の中の実行ファイル(Forgejo のサーバ側フック)が動かない。
# コンテナは PSA と securityContext で押さえている。
mount:
  secure: false
