# ディスクの割り方。既定だと EPHEMERAL (= /var) がディスク全部を取り、etcd も
# コンテナイメージも PV データも同じ 1 枚に同居する。local-path は PVC の容量を
# 強制しないので、1 個の PVC が暴走すると etcd ごと道連れになる。
#
# ボリュームの設定は「まだ確保されていないとき」にしか効かない。あとから書き足しても
# 黙って無視されるので、直すにはディスクを消して入れ直すことになる。
# システムボリュームがユーザーボリュームより先に確保されるため、EPHEMERAL に maxSize を
# 書き忘れると grow が全部持っていって取り分が残らない (siderolabs/talos#12713)。
#
# 64GiB の根拠は実機の使用量 (containerd 22G / etcd 84M / kubelet 925M / log 1.2G)。
# 上限を切るほうが kubelet のイメージ GC (既定 85%) が現実的なところで効く。
# 残り約 380 GB が下の local-path 用。
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  maxSize: 64GiB
  grow: true
---
# PV データの置き場。マウント先は Talos が決める (/var/mnt/<name> 固定) ので、
# ../manifests/local-path.yaml の paths がここを指している。
# PVC の容量を強制するわけではなく、溢れてもこのパーティションの中で止まる、が効き目。
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-path
provisioning:
  diskSelector:
    match: system_disk
  minSize: 50GiB
  grow: true
filesystem:
  type: xfs
# noexec を外す。Talos v1.14 から /var 系は既定で nosuid,nodev,noexec になり、
# PVC の中の実行ファイルが動かない。Mattermost はプラグイン 4 つを PVC から exec
# するので落ちる (実機の PVC に実行ファイルは 5 本)。上流も Longhorn / vCluster が
# 同じ理由で壊れたと言っていて、mount.secure がその逃げ道。
# nosuid と nodev も一緒に外れるが、PVC に書けるのはコンテナだけで、そこは
# PSA と securityContext で押さえているので釣り合うと判断した。
mount:
  secure: false
