# クラスタ共通。**v1.14 では型付きドキュメントと v1alpha1 を併記できない**ので、
# 項目ごとに書く場所が決まっている(../docs/talos-install-media.md 参照)。
machine:
  sysctls:
    # **これが無いと IPv6 の既定経路が消える。** Kubernetes が上がると
    # `net.ipv6.conf.{all,bond0}.forwarding` が 1 になり、既定の `accept_ra=1` は
    # 「forwarding が有効なら RA を無視する」なのでカーネルが RA 由来の default route を落とす。
    # 2 = forwarding でも RA を受ける。Ubuntu 期は NetworkManager が userspace で RA を
    # 処理していた(実機は `accept_ra=0` のまま `proto ra` の既定経路が載っている)ので
    # この問題が出なかった。QEMU で再現・修正を確認済み(../docs/talos.md「VM ブートドリル」)。
    net.ipv6.conf.bond0.accept_ra: "2"
    # bond0 の SLAAC の IID を MAC 由来(EUI-64)にしない。
    # **値は 3(random)。** stable-privacy(2)は `stable_secret` が要り、未設定のまま 2 を書くと
    # `write /proc/sys/net/ipv6/conf/bond0/addr_gen_mode: invalid argument` で
    # KernelParamSpecController が数秒おきに失敗し続ける(実測)。
    # 3 は再起動ごとに IID が変わる。ブート間で固定したくなったら `stable_secret` を足して 2 に戻す。
    # **公開する AAAA は下の静的アドレス(::2)。** SLAAC のぶんは並んで付くだけ。
    # 実機の NetworkManager も ipv6.token は使っておらず、静的アドレスを直接書いている
    # (`ip token show` はどのインタフェースも `token ::`)。
    net.ipv6.conf.bond0.addr_gen_mode: "3"
    # IPv6 は bond0 に一本化する。eno4 側の RA でデフォルトルートを奪われると非対称ルーティングになる。
    net.ipv6.conf.eno4.disable_ipv6: "1"
  kubelet:
    # local-path-provisioner のデータ置き場。/var は EPHEMERAL パーティションなのでアップグレードで消えない。
    # KubeletConfig ドキュメントには extraMounts が無いため、下でそれを削ってから v1alpha1 に書いている。
    extraMounts:
      - destination: /var/local-path-provisioner
        type: bind
        source: /var/local-path-provisioner
        options: [bind, rshared, rw]
  network:
    # 名前は main 固定。local-path の PV の nodeAffinity が main を指している。
    hostname: main
    interfaces:
      - interface: bond0
        bond:
          interfaces: [eno1, eno2]
          mode: balance-alb
          miimon: 100
        dhcp: false
        addresses:
          - 10.0.0.2/24
          # **実機と同じ静的アドレス。** プレフィックスは ISP 由来なので変わりうるが、
          # それは NetworkManager で運用しているいまも同じリスク。変わったときは
          # cloudflare-ddns(local.iface.stable:bond0)が実際のアドレスを公開する。
          - 240f:6d:842b:1::2/64
        routes:
          # IPv6 の既定経路は RA 由来(`default via fe80::… proto ra`)なので書かない。
          # 上の `accept_ra: "2"` とセット。**Kubernetes が上がったあと**に
          # `talosctl get routes -o yaml` で `protocol: ra` の `dst: ""` が残っていることを確かめること
          # (クラスタ起動前だけ見ても意味が無い。forwarding が 1 になるのはそのあと)。
          - network: 0.0.0.0/0
            gateway: 10.0.0.1
      - interface: eno4
        dhcp: false
        addresses:
          - 10.10.0.4/24
        routes:
          - network: 10.10.0.0/24
            gateway: 10.10.0.1
---
# extraMounts を v1alpha1 側に書くため、このドキュメントごと消す。
apiVersion: v1alpha1
kind: KubeletConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
    - 10.42.0.0/16
    - fd42::/64
serviceSubnets:
    - 10.43.0.0/16
    # **/64 は Talos に弾かれる(/108 以下が必須)。k3s の fd43::/64 から変わるので ClusterIP は振り直しになる。
    - fd43::/108
---
# **HostnameConfig は消して v1alpha1 側に書く。** gen config が既定で入れる
# `auto: stable` と `hostname` は併記できず、パッチからは `auto` を消せない
# (`auto: null` も `$patch: replace` も効かない)。KubeletConfig と同じ手で
# ドキュメントごと落としてから、下の machine.network.hostname を効かせる。
apiVersion: v1alpha1
kind: HostnameConfig
$patch: delete
---
# ノード自身の名前解決。実機の systemd-resolved と同じ Cloudflare を見る。
# クラスタ内の名前解決は CoreDNS、LAN 向けの公開リゾルバは AdGuard で、どちらもこれとは別。
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
    - address: 2606:4700:4700::1111
    - address: 2606:4700:4700::1001
    - address: 1.1.1.1
    - address: 1.0.0.1
