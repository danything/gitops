# クラスタ共通。v1.14 では型付きドキュメントと v1alpha1 を併記できないので、
# 項目ごとに書く場所が決まっている(../docs/talos.md「machine config の作法」)。
machine:
  sysctls:
    # これが無いと IPv6 の既定経路が消える。Kubernetes が上がると
    # `net.ipv6.conf.{all,bond0}.forwarding` が 1 になり、既定の `accept_ra=1` は
    # 「forwarding が有効なら RA を無視する」なのでカーネルが RA 由来の default route を落とす。
    # 2 = forwarding でも RA を受ける。Ubuntu 期は systemd-networkd(2026-09-24 までは NetworkManager)が userspace で RA を
    # 処理していた(実機は `accept_ra=0` のまま `proto ra` の既定経路が載っている)ので
    # この問題が出なかった。QEMU で再現・修正を確認済み(../docs/talos.md「VM ブートドリル」)。
    net.ipv6.conf.bond0.accept_ra: "2"
    # bond0 の SLAAC の IID を MAC 由来(EUI-64)にしない。
    # 値は 3(random)。stable-privacy(2)は `stable_secret` が要り、未設定のまま 2 を書くと
    # `write /proc/sys/net/ipv6/conf/bond0/addr_gen_mode: invalid argument` で
    # KernelParamSpecController が数秒おきに失敗し続ける(実測)。
    # 3 は再起動ごとに IID が変わる。ブート間で固定したくなったら `stable_secret` を足して 2 に戻す。
    # 公開する AAAA は下の静的アドレス(::2)。SLAAC のぶんは並んで付くだけ。
    # Ubuntu 期も IPv6 のトークンは使っておらず、静的アドレスを直接書いている
    # (`ip token show` はどのインタフェースも `token ::`)。
    net.ipv6.conf.bond0.addr_gen_mode: "3"
    # Forgejo の Runner(dind)で vite などがファイル監視を使う。既定の 128 は全コンテナの root で
    # 共有なので足りず、worklog-cloud の e2e が EMFILE で落ちた(2026-09-15)。k3s 期はホストの
    # /etc/sysctl.d/90-inotify.conf に同じ値
    fs.inotify.max_user_instances: "8192"
    fs.inotify.max_user_watches: "1048576"
    # IPv6 は bond0 に一本化する。eno4 側の RA でデフォルトルートを奪われると非対称ルーティングになる。
    net.ipv6.conf.eno4.disable_ipv6: "1"
  network:
    # 名前は main 固定。local-path の PV の nodeAffinity が main を指している。
    # インタフェースは下の BondConfig / LinkConfig(型付きドキュメント)に書く。v1alpha1 の
    # machine.network.interfaces は bond の MAC を指定できないため(2026-10-17 に移した)。
    hostname: main
---
# 10.0 側。**MAC は e6:2c:1b:1a:a0:39 に固定する。** ルーターの IPv6 ホスト公開のエントリがこの MAC を
# 指している(docs/router.md)。指定しないと bond は links の先頭(eno1)の MAC を引き継ぎ、
# Talos に替えた日と Z440 に移した日に変わって、外からの IPv6 が全部止まる。
# Ubuntu 期も netplan に macaddress を書いて同じ値に固定する(2026-10-17。それまでは指定が無く、
# 再起動で 3a:43:95:a9:3e:b1 に変わっていた)。
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
    - eno1
    - eno2
bondMode: balance-alb
miimon: 100
hardwareAddr: e6:2c:1b:1a:a0:39
addresses:
    - address: 10.0.0.2/24
    # 実機と同じ静的アドレス。プレフィックスは ISP 由来なので変わりうる(Ubuntu 期も同じリスク)。
    # 変わったときは cloudflare-ddns(local.iface.stable:bond0)が実際のアドレスを公開する。
    - address: 240f:6d:842b:1::2/64
routes:
    # destination を書かないと gateway の側の既定経路になる。
    # IPv6 の既定経路は RA 由来(`default via fe80::… proto ra`)なので書かない。
    # 上の `accept_ra: "2"` とセット。Kubernetes が上がったあとに
    # `talosctl get routes -o yaml` で `protocol: ra` の `dst: ""` が残っていることを確かめること
    # (クラスタ起動前だけ見ても意味が無い。forwarding が 1 になるのはそのあと)。
    - gateway: 10.0.0.1
---
# 10.10 側。DHCP は DHCPv4Config / DHCPv6Config を書かない限り無効(明示の設定が 1 つでもあれば既定の DHCP は止まる)
apiVersion: v1alpha1
kind: LinkConfig
name: eno4
addresses:
    - address: 10.10.0.4/24
routes:
    - destination: 10.10.0.0/24
      gateway: 10.10.0.1
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
    - 10.42.0.0/16
    - fd42::/64
serviceSubnets:
    - 10.43.0.0/16
    # /64 は Talos に弾かれる(/108 以下が必須)。k3s の fd43::/64 から変わるので ClusterIP は振り直しになる。
    - fd43::/108
---
# HostnameConfig は消して v1alpha1 側に書く。gen config が既定で入れる
# `auto: stable` と `hostname` は併記できず、パッチからは `auto` を消せない
# (`auto: null` も `$patch: replace` も効かない)。下の KubeNodeConfig と同じ手で
# ドキュメントごと落としてから、下の machine.network.hostname を効かせる。
apiVersion: v1alpha1
kind: HostnameConfig
$patch: delete
---
# ノード自身の名前解決。実機の systemd-resolved と同じ Cloudflare を見る。
# クラスタ内の名前解決は CoreDNS、LAN 向けの公開リゾルバは AdGuard で、どちらもこれとは別。
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
    - address: 2606:4700:4700::1111
    - address: 2606:4700:4700::1001
    - address: 1.1.1.1
    - address: 1.0.0.1
---
# ノード(containerd)から fj.doany.io のイメージを取るため、名前を中継の ClusterIP に向ける。
# ノード自身からは Gateway の 443 に繋がらない(bootstrap/cilium/values.yaml の nodePort の 3)。
# 中継は apps/forgejo/node-access.yaml。k3s 期はホストの /etc/hosts に同じ行(2026-09-15)
apiVersion: v1alpha1
kind: StaticHostConfig
name: 10.43.200.10
hostnames:
    - fj.doany.io
---
# 単一ノードなので control-plane に taint を付けない。
#
# `KubeNodeConfig` は既定で `node-role.kubernetes.io/control-plane: NoSchedule` を入れる。
# ノードが 1 台しかないこのクラスタでは、toleration を持たない Pod が全部 Pending になる
# (k3s は単一ノードを control-plane 兼 worker として扱うので、この問題が無かった)。
#
# 2026-09-08 の VM ドリルで実際に踏んだ。cilium と CoreDNS は toleration を持っているので上がり、
# ノードは `Ready` に見えるまま、metrics-server・hubble・local-path-provisioner が
# `no nodes available to schedule pods` で止まっていた。移行当日にアプリが 1 つも上がらない。
#
# taints だけを消す方法が無い
#
# `taints` はマップなので、`taints: {}` では消えない(マージなので何も起きない)。
# 中に `$patch: replace` を書くとキーとして残ってしまい `name "$patch" is invalid` で
# validate が落ちる(実測)。上の HostnameConfig と同じく、
# ドキュメントごと消して labels だけ書き戻すのが唯一の手。
apiVersion: v1alpha1
kind: KubeNodeConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeNodeConfig
# labels は書き戻すこと。消したままだと `kubectl get nodes` の ROLES が `<none>` になる。
labels:
    node-role.kubernetes.io/control-plane: ""
    node.kubernetes.io/exclude-from-external-load-balancers: ""
