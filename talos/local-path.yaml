# local-path-provisioner。Talos には無いので、入れないと PVC が 1 つも bind せず、
# ストレージを持つアプリが全部 Pending で止まる。
#
# - データの置き場は `/var/mnt/local-path`([`controlplane.yaml`](controlplane.yaml) の
#   `UserVolumeConfig` が切る別パーティション)。ディレクトリは `pvc-<uid>_<ns>_<name>`
# - namespace は `local-path-storage`(PSA は privileged。ヘルパー Pod が hostPath を使う)
# - StorageClass は既定の `local-path` 1 つだけ。PVC を守るのは Retain ではなく日次の restic
#   (docs/decisions.md「PVC を守る仕掛けをやめた」)
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
  labels:
    # ヘルパー Pod が hostPath を使うので baseline では通らない。
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: local-path-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumeclaims, configmaps, pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      serviceAccountName: local-path-provisioner-service-account
      containers:
        - name: local-path-provisioner
          # Docker Hub の匿名の取得は絞られるので mirror.gcr.io(Docker Hub の pull-through キャッシュ。中身は同じ)。
          # 下の busybox も同じ
          image: mirror.gcr.io/rancher/local-path-provisioner:v0.0.37
          command: [local-path-provisioner, start, --config, /etc/config/config.json]
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      volumes:
        - name: config-volume
          configMap:
            name: local-path-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  config.json: |-
    {
      "nodePathMap":[
      {
        "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
        "paths":["/var/mnt/local-path"]
      }
      ]
    }
  # `setup` と `teardown` は必須。ヘルパー Pod はこの ConfigMap を
  # `subPath` で 1 キーずつマウントするので、キーが無いとヘルパー Pod が
  # `configmap references non-existent config key: setup` で ContainerCreating のまま止まり、
  # PVC が永遠に Pending になる(2026-09-08 の VM ドリルで踏んだ。上流の
  # deploy/local-path-storage.yaml には入っている)。
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
        - name: helper-pod
          image: mirror.gcr.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
