# Talos と Kubernetes の版の出どころ。
#
# ここは Renovate が書き換える。手で触るのは schematic を変えたときだけ
# (拡張やカーネル引数を足したら Image Factory で新しい ID が出る)。
#
# 上げること自体は自動化しない(ノード 1 台なので Talos の upgrade は全停止)。Renovate の PR は
# 新しい版が出たという通知として使い、適用は自分の都合のいい時間に手で。
# 理由と手順は README.md「上げ方 / 当て直し方」。

talos:
  # Talos のリリースを追う。Image Factory はどの版でもその場で installer を作るので、
  # リリースされた版はそのまま使える。Factory のレジストリはタグの一覧を返さない (/v2/…/tags/list が 404)
  # ので、installer イメージを docker で追う形では Renovate が版を引けなかった (2026-10-07 まで)。
  # 手元の talosctl (tools/Dockerfile) と同じ depName なので、同じ PR で上がる。
  # PT3 のドライバ(dvb-pt3)が v1.15.0-alpha.1 からしか無いので、2026-10-13 から alpha に乗せている
  # (../docs/decisions.md「PT3 チューナー」)。いまの版がプレリリースなので、Renovate は次の alpha / beta も PR にしてくる。
  # renovate: datasource=github-releases depName=siderolabs/talos
  version: v1.15.0-alpha.1
  # 拡張(dvb-pt3、intel-ucode)とカーネル引数(intel_iommu=on / iommu=pt)を焼き込んだ ID。
  # 中身を変えたら Image Factory で作り直して、この値を差し替える。
  schematic: 96371c8f956f7f5f9d09925bb49fe096c0cad05c5cf5bdb464790982c0b067ca

kubernetes:
  # `gen config` に `--kubernetes-version` で渡すこと。渡さないと Talos の既定
  # (v1.14.0 なら v1.37.0)になり、ここに書いた値は無視される。2026-09-07 の Talos ブート
  # ドリルで、生成物が v1.37.0 になっているのを見つけた(render.sh が渡し、needle で見ている)。
  # 上げるのは `upgrade-k8s`(README.md「上げ方 / 当て直し方」)。マイナーを飛ばさないこと。
  # 手元の kubectl は tools/Dockerfile が同じ depName で揃える。
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  version: v1.37.1

metricsServer:
  # Talos には metrics-server が無い(無いと `kubectl top` と、各 UI の使用量表示が死ぬ)。
  # inlineManifest として載せる(../talos/render.sh)。
  # renovate: datasource=helm depName=metrics-server registryUrl=https://kubernetes-sigs.github.io/metrics-server/
  version: 3.14.0

gatewayAPI:
  # Gateway API の CRD。無いと `Gateway` も `HTTPRoute` も `GRPCRoute` も
  # 適用できず、公開経路が丸ごと消える。Cilium の chart は CRD を同梱しないので
  # (`gatewayAPI.enabled: true` は「CRD は自分で入れてある前提」)、こちらで入れる。
  #
  # standard チャンネルで足りる。使っているのは Gateway / HTTPRoute /
  # GRPCRoute / ReferenceGrant の 4 つ(GRPCRoute は v1.1 から standard)。
  # standard-install.yaml は TCPRoute / UDPRoute / TLSRoute / ListenerSet / BackendTLSPolicy も含めて
  # CRD を 10 個とも持っている(2026-09-08 に中身を確認)。
  #
  # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
  version: v1.6.3
