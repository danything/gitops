# Talos と Kubernetes の版。Renovate が書き換えるが、適用は手で(ノード 1 台なので upgrade は全停止)。
# 手順は README.md「上げ方 / 当て直し方」。

talos:
  # Factory のレジストリはタグ一覧を返さないので github-releases で追う。tools/Dockerfile の talosctl と同じ depName。
  # dvb-pt3 が v1.15.0-alpha.1 からなので alpha に乗っている(Renovate は次の alpha / beta も出す)。
  # renovate: datasource=github-releases depName=siderolabs/talos
  version: v1.15.0-alpha.2
  # 拡張(dvb-pt3、intel-ucode)とカーネル引数(intel_iommu=on / iommu=pt)を焼き込んだ Image Factory の ID。
  schematic: 96371c8f956f7f5f9d09925bb49fe096c0cad05c5cf5bdb464790982c0b067ca

kubernetes:
  # 上げるのは upgrade-k8s で、マイナーを飛ばさない。tools/Dockerfile の kubectl と同じ depName。
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  version: v1.37.1

gatewayAPI:
  # Gateway API の CRD(standard チャンネルで足りる)。
  # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
  version: v1.6.3
