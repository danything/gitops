# 平文の秘密を SOPS(age)で暗号化する規則。鍵は recovery/sops-age.key.age
# (env.age と同じパスフレーズ)。復号は
#   tools/t.ps1 sh -c 'mkdir -p ~/.config/sops/age && age -d -o ~/.config/sops/age/keys.txt recovery/sops-age.key.age'
# のあと `tools/t.ps1 sops -d`(tools/t.ps1 の中の ~ はリポジトリの .home/)。
creation_rules:
  # bootstrap/*/secret-values.yaml(chart の値のうち秘密だけ)は丸ごと暗号化する。
  # 秘密しか入れない約束なので選り分けない。値の残りは同じ場所の平文の values.yaml。
  - path_regex: ^bootstrap/[^/]+/secret-values\.yaml$
    age: age1sgnnkn67wpt4wgjsff4c36w3cmjkk557ng504e4aczx2lzls9y6ssy0x9r
  # 残りの bootstrap/ は「そのキーだけ」を暗号化する。マニフェストの構造は git で読めたほうが
  # レビューできるため。
  - path_regex: ^bootstrap/.*\.yaml$
    encrypted_regex: ^(ENCRYPTION_KEY|AUTH_SECRET|CLIENT_ID_GITHUB_LOGIN|CLIENT_SECRET_GITHUB_LOGIN|CF_DNS_API_TOKEN)$
    age: age1sgnnkn67wpt4wgjsff4c36w3cmjkk557ng504e4aczx2lzls9y6ssy0x9r
  # talos/secrets.yaml は丸ごと暗号化する。`talosctl gen secrets` の出力は
  # 全部が秘密(Talos の CA、Kubernetes の CA、etcd の CA、bootstrap token)で、
  # 選り分ける意味が無い。この規則が無いと talos/README.md の `sops -e -i secrets.yaml`
  # が「一致する creation rule が無い」で落ちる。
  - path_regex: ^talos/secrets\.yaml$
    age: age1sgnnkn67wpt4wgjsff4c36w3cmjkk557ng504e4aczx2lzls9y6ssy0x9r
  # talos/registries.yaml も丸ごと。中身は fj.doany.io の pull トークンだけなので
  # 選り分ける意味が無い。
  - path_regex: ^talos/registries\.yaml$
    age: age1sgnnkn67wpt4wgjsff4c36w3cmjkk557ng504e4aczx2lzls9y6ssy0x9r
