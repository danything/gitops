# 平文の秘密を SOPS(age)で暗号化する規則。鍵は recovery/sops-age.key.age
# (env.age と同じパスフレーズ)。復号は
#   tools/t.ps1 sh -c 'mkdir -p ~/.config/sops/age && age -d -o ~/.config/sops/age/keys.txt recovery/sops-age.key.age'
# のあと `tools/t.ps1 sops -d`(tools/t.ps1 の中の ~ はリポジトリの .home/)。
# 上から順に見て、最初に当たった規則を使う。どれにも当たらない名前は暗号化できない(bootstrap/README.md)。
#
# mac_only_encrypted は MAC が暗号化した値だけを見る。平文の部分(コメントの `# version:` も)は sops を通さず
# 直接直せて、Renovate が書き換えても `sops -d` が落ちない。コメントは encrypted_regex に当たらないので平文のまま。
# SOPS はドキュメントごとに sops: を付け、インデントを 4 にする。
creation_rules:
  # 全部が秘密なので丸ごと(CA 一式)
  - path_regex: ^bootstrap/talos-secrets\.sops\.yaml$
    age: age1sgnnkn67wpt4wgjsff4c36w3cmjkk557ng504e4aczx2lzls9y6ssy0x9r
  # 手で書く machine config。秘密は password の値だけ(fj.doany.io)
  - path_regex: ^bootstrap/talos\.sops\.yaml$
    encrypted_regex: ^password$
    mac_only_encrypted: true
    age: age1sgnnkn67wpt4wgjsff4c36w3cmjkk557ng504e4aczx2lzls9y6ssy0x9r
  # 秘密を含む chart の値(と、2 つめのドキュメントの Secret)。秘密のキーだけ。キーを足したらここにも足す
  # (当たらないキーは平文のままコミットされる)。
  - path_regex: ^bootstrap/[^/]+-values\.sops\.yaml$
    encrypted_regex: ^(service\.webhook\.mattermost|githubAppPrivateKey|password|postgresPassword|ENCRYPTION_KEY|AUTH_SECRET|CLIENT_ID_GITHUB_LOGIN|CLIENT_SECRET_GITHUB_LOGIN|CF_DNS_API_TOKEN)$
    mac_only_encrypted: true
    age: age1sgnnkn67wpt4wgjsff4c36w3cmjkk557ng504e4aczx2lzls9y6ssy0x9r
