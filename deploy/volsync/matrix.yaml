# matrix の PVC を VolSync で取る(取り方・Secret・時刻の決め方は application.yaml の冒頭)。
# リポジトリは PVC ごとに `<bucket>/volsync/matrix/<pvc>`
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: volsync
  namespace: matrix
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        # k8up と同じ R2 の資格情報とリポジトリのパスワード(経路だけ分ける)
        secretsPath: /k8up/k8up-global
        recursive: false
  managedKubeSecretReferences:
    - secretName: volsync-tuwunel-data
      secretNamespace: matrix
      creationPolicy: Orphan
      template:
        data:
          RESTIC_REPOSITORY: "s3:{{ .endpoint.Value }}/{{ .bucket.Value }}/volsync/matrix/tuwunel-data"
          RESTIC_PASSWORD: "{{ .repoPassword.Value }}"
          AWS_ACCESS_KEY_ID: "{{ .accessKeyId.Value }}"
          AWS_SECRET_ACCESS_KEY: "{{ .secretAccessKey.Value }}"
          AWS_DEFAULT_REGION: auto
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: tuwunel-data
  namespace: matrix
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sourcePVC: tuwunel-data
  trigger:
    schedule: "0 20 * * *"
  restic:
    repository: volsync-tuwunel-data
    copyMethod: Snapshot
    volumeSnapshotClassName: lvm
    retain: {daily: 7, weekly: 4, monthly: 6}
    pruneIntervalDays: 7
    moverSecurityContext: {runAsUser: 0, runAsGroup: 0}
