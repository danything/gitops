# VolSync。PVC をスナップショットから restic で R2 に取る(理由は docs/decisions.md
# 「ストレージを OpenEBS LVM LocalPV に、バックアップを VolSync にする」)。
# 取る PVC は同じフォルダの <namespace>.yaml の ReplicationSource(denpa-raw だけは取らない)。
# VolSync には PVC をラベルやワイルドカードで選ぶ仕組みが無いので、1 本ずつ名前で書く。
#
# - **リポジトリは PVC ごと**に `<bucket>/volsync/<namespace>/<pvc>`。Secret(`volsync-<pvc>`)は namespace ごとの InfisicalSecret
#   `volsync` が、`/k8up/k8up-global`(endpoint・bucket・鍵・repoPassword)からテンプレートで組む
# - **スナップショットから取る**(copyMethod: Snapshot。既定の VolumeSnapshotClass `lvm` を使う。bootstrap/storage.yaml)。
#   止めずに取れて、Postgres・SQLite・RocksDB は crash-consistent なスナップショットから自分で立ち直る
# - **mover は root**(PVC の中の持ち主がアプリごとに違う)。namespace に `volsync.backube/privileged-movers: "true"` が要る。
#   Argo CD が作る namespace は bootstrap/argocd-repos.yaml の managedNamespaceMetadata、自分で Namespace を書いているところはそのファイル、
#   bootstrap 層(infisical など)は bootstrap/render.sh が付ける。PVC を足したら、その namespace に注釈があるかを見る
# - **時刻は全部 19:00 UTC(04:00 JST)。** VolSync は並べて流し、22 本で 5 分ほどで終わる(2026-11-02 に全部を同時に取って確かめた)。
#   保持は日次 7・週次 4・月次 6(録画だけ 1 世代)、prune は VolSync の既定の 7 日ごと
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: volsync
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: volsync-system
  source:
    repoURL: https://backube.github.io/helm-charts
    chart: volsync
    targetRevision: 0.17.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # CRD より先に同期しにいくと既定の 5 回で諦める。15s から倍々・上限 5 分・10 回
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
