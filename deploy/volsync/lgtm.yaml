# lgtm の PVC を VolSync で取る(取り方・Secret・時刻の決め方は application.yaml の冒頭)。
# リポジトリは PVC ごとに `<bucket>/volsync/lgtm/<pvc>`
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: volsync
  namespace: lgtm
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /k8up/k8up-global
        recursive: false
  managedKubeSecretReferences:
    - secretName: volsync-lgtm-db
      secretNamespace: lgtm
      creationPolicy: Orphan
      template:
        data:
          RESTIC_REPOSITORY: "s3:{{ .endpoint.Value }}/{{ .bucket.Value }}/volsync/lgtm/lgtm-db"
          RESTIC_PASSWORD: "{{ .repoPassword.Value }}"
          AWS_ACCESS_KEY_ID: "{{ .accessKeyId.Value }}"
          AWS_SECRET_ACCESS_KEY: "{{ .secretAccessKey.Value }}"
          AWS_DEFAULT_REGION: auto
    - secretName: volsync-lgtm-images
      secretNamespace: lgtm
      creationPolicy: Orphan
      template:
        data:
          RESTIC_REPOSITORY: "s3:{{ .endpoint.Value }}/{{ .bucket.Value }}/volsync/lgtm/lgtm-images"
          RESTIC_PASSWORD: "{{ .repoPassword.Value }}"
          AWS_ACCESS_KEY_ID: "{{ .accessKeyId.Value }}"
          AWS_SECRET_ACCESS_KEY: "{{ .secretAccessKey.Value }}"
          AWS_DEFAULT_REGION: auto
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: lgtm-db
  namespace: lgtm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sourcePVC: lgtm-db
  trigger:
    schedule: "0 19 * * *"
  restic:
    repository: volsync-lgtm-db
    copyMethod: Snapshot
    retain: {daily: 7, weekly: 4, monthly: 6}
    moverSecurityContext: {runAsUser: 0, runAsGroup: 0}
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: lgtm-images
  namespace: lgtm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sourcePVC: lgtm-images
  trigger:
    schedule: "0 19 * * *"
  restic:
    repository: volsync-lgtm-images
    copyMethod: Snapshot
    retain: {daily: 7, weekly: 4, monthly: 6}
    moverSecurityContext: {runAsUser: 0, runAsGroup: 0}
