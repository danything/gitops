# この namespace の PVC を VolSync で R2 に取り(ReplicationSource)、PVC を作るときに埋める(ReplicationDestination <pvc>-dst)。
# リポジトリは PVC ごとに `<bucket>/volsync/netbird/<pvc>`、その Secret(volsync-<pvc>)は secrets.sops.yaml。取り方は ../volsync/application.yaml
# アプリと一緒に置くので、アプリを消せばこれも消える
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: netbird-data
  namespace: netbird
spec:
  sourcePVC: netbird-data
  trigger:
    schedule: "0 19 * * *"
  restic:
    repository: volsync-netbird-data
    copyMethod: Snapshot
    retain: {daily: 7, weekly: 4, monthly: 6}
    moverSecurityContext: {runAsUser: 0, runAsGroup: 0}
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: netbird-routing-peer-data
  namespace: netbird
spec:
  sourcePVC: netbird-routing-peer-data
  trigger:
    schedule: "0 19 * * *"
  restic:
    repository: volsync-netbird-routing-peer-data
    copyMethod: Snapshot
    retain: {daily: 7, weekly: 4, monthly: 6}
    moverSecurityContext: {runAsUser: 0, runAsGroup: 0}
---
# 戻す側(populator)。PVC netbird-data の dataSourceRef がこれを指すので、PVC を新しく作ると R2 の最新から中身を埋めてから渡す
# (入れ直したクラスタ・PVC を消して作り直したとき)。今ある PVC には効かない。作られたときに 1 回だけ戻す
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: netbird-data-dst
  namespace: netbird
spec:
  trigger:
    manual: restore-once
  restic:
    repository: volsync-netbird-data
    copyMethod: Snapshot
    capacity: 2Gi
    accessModes: [ReadWriteOnce]
    storageClassName: local-path
    moverSecurityContext: {runAsUser: 0, runAsGroup: 0}
    # 戻した中身はスナップショットに残るので、作業用の PVC は消す
    cleanupTempPVC: true
    cleanupCachePVC: true
---
# 戻す側(populator)。PVC netbird-routing-peer-data の dataSourceRef がこれを指すので、PVC を新しく作ると R2 の最新から中身を埋めてから渡す
# (入れ直したクラスタ・PVC を消して作り直したとき)。今ある PVC には効かない。作られたときに 1 回だけ戻す
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: netbird-routing-peer-data-dst
  namespace: netbird
spec:
  trigger:
    manual: restore-once
  restic:
    repository: volsync-netbird-routing-peer-data
    copyMethod: Snapshot
    capacity: 512Mi
    accessModes: [ReadWriteOnce]
    storageClassName: local-path
    moverSecurityContext: {runAsUser: 0, runAsGroup: 0}
    # 戻した中身はスナップショットに残るので、作業用の PVC は消す
    cleanupTempPVC: true
    cleanupCachePVC: true
