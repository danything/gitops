# 2 本とも VolSync がスナップショットから取る(../volsync/adguardhome.yaml)。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguardhome-conf
  namespace: adguardhome
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguardhome-work
  namespace: adguardhome
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      # クエリログ(deployment.yaml の querylog.interval)の 2 本ぶん。LVM なのでこれが本当の上限になる。
      # 1 日 10 GB は外からの 53 番の増幅攻撃のぶんで、network-policy.yaml で閉じてからはふだんの量に戻った。
      # 合計を thin プールに収めるため小さめにしている(bootstrap/lvm-localpv-values.yaml)
      storage: 10Gi
