# 2 本とも VolSync がスナップショットから取る(volsync.yaml)。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguardhome-conf
  namespace: adguardhome
spec:
  # 新しく作るときは VolSync が R2 の最新から中身を埋める(volsync.yaml の adguardhome-conf-dst)。今ある PVC には効かない
  dataSourceRef: {apiGroup: volsync.backube, kind: ReplicationDestination, name: adguardhome-conf-dst}
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguardhome-work
  namespace: adguardhome
spec:
  # 新しく作るときは VolSync が R2 の最新から中身を埋める(volsync.yaml の adguardhome-work-dst)。今ある PVC には効かない
  dataSourceRef: {apiGroup: volsync.backube, kind: ReplicationDestination, name: adguardhome-work-dst}
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      # クエリログ(deployment.yaml の querylog.interval)の 2 本ぶん。LVM なのでこれが本当の上限になる。
      # 1 日 10 GB は外からの 53 番の増幅攻撃のぶんで、network-policy.yaml で閉じてからはふだんの量に戻った。
      # 合計を thin プールに収めるため小さめにしている(bootstrap/lvm-localpv-values.yaml)
      storage: 10Gi
