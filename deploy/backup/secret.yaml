# Secret backup を Infisical(/k8up/k8up-global。パスの名前は k8up の頃のまま)から作る。
#
# キーは endpoint / bucket / accessKeyId / secretAccessKey / repoPassword /
# mattermostWebhook の 6 つ。値は `age -d recovery/env.age` にある。
# endpoint は RESTIC_REPOSITORY の `s3:` だけを外した形で、https:// は残す。
#
# ../volsync/ の InfisicalSecret も同じフォルダから R2 の資格情報とパスワードを組む。
# 災害復旧のときは Infisical を先に戻す(recovery/README.md の 6)。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: backup
  namespace: backup
  # 2 つとも必須。bootstrap/README.md「InfisicalSecret には sync-options を 2 つ付けること」。
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /k8up/k8up-global
        recursive: false
  managedKubeSecretReferences:
    - secretName: backup
      secretNamespace: backup
      # Orphan: CR を消しても Secret は残す(バックアップの資格情報を巻き込まない)
      creationPolicy: Orphan
