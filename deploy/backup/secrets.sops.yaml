# backup の namespace の秘密(Secret backup)。キーは endpoint / bucket / accessKeyId / secretAccessKey / repoPassword / mattermostWebhook。
# 値は `age -d recovery/env.age` にもある。endpoint は RESTIC_REPOSITORY の `s3:` だけを外した形で、https:// は残す。
# 各アプリの VolSync の Secret(volsync-<pvc>)も同じ R2 の資格情報とパスワード(変えるときは全部)。
# 値は SOPS で暗号化してある(../../.sops.yaml。管理者の鍵とクラスタの鍵)。直すときは `tools/t sops edit <このファイル>` して push する。
