# 公開経路。証明書は Gateway(deploy/gateway/)のワイルドカードなので指定しない。
# 画面・API(REST・GraphQL)・MCP・Microsoft の戻り先(/auth/microsoft/redirect)は全部 3000 の 1 つの口。
# 最初のワークスペースは、経路ができたあと最初に入った人が作る。作ったら持ち主が info@doany.io かを確かめる(README「最初のワークスペース」)。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: twenty
  namespace: twenty
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https
  hostnames: ["t.doany.io"]
  rules:
    - backendRefs:
        - name: twenty
          port: 3000
      # 画面は WebSocket(GraphQL の購読)でつなぎ続け、添付のアップロードもある。Gateway の既定の 15 秒では切れる
      timeouts:
        request: 0s
