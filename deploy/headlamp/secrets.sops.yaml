# headlamp の namespace の秘密(Secret headlamp-oidc)。chart が envFrom で丸ごと読むので、キーは環境変数名そのまま:
# OIDC_CLIENT_ID / OIDC_CLIENT_SECRET / OIDC_ISSUER_URL。OIDC_CLIENT_SECRET は Entra の共用のアプリ登録の値(auth などと同じ。変えるときは全部)。
# 値は SOPS で暗号化してある(../../.sops.yaml。管理者の鍵とクラスタの鍵)。直すときは `tools/t sops edit <このファイル>` して push する。
# クラスタの中では sops-secrets-operator が Secret にし、Reloader の注釈のある workload が入れ替わる。
