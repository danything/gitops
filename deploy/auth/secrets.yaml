# Infisical の /auth/auth-secrets を operator が Secret にする(UI で書き換えれば数秒で同期)。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: auth-secrets
  namespace: auth
  annotations:
    # bootstrap/README.md「`InfisicalSecret` には sync-options を 2 つ付けること」
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /auth/auth-secrets
  managedKubeSecretReferences:
    - secretName: auth-secrets
      secretNamespace: auth
