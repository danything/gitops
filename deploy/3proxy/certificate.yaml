# px.doany.io の証明書。Gateway は TLS を passthrough するだけなので、終端は Pod 内の
# サイドカー(tls-terminator)が行う。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: 3proxy-tls
  namespace: 3proxy
spec:
  secretName: 3proxy-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - px.doany.io
