# forgejo の namespace の秘密。
#   forgejo-db      postgres-password(英数字だけ。記号は app.ini でコメント扱いになりうる。最初の起動後は変えない)
#   forgejo-oauth   key(Entra の共用のアプリ登録のクライアント ID)/ secret(同じ登録のシークレット。auth などと同じ値)
#   forgejo-runner  runner-secret(16 進 40 文字。Forgejo の init と Runner の両方が読む。runner.yaml)
#   volsync-<pvc>   VolSync の restic の Secret(backup/secrets.sops.yaml と同じ R2 の資格情報とパスワード)
# forgejo-db・forgejo-oauth が無いと Forgejo の init が上がらない。
# 値は SOPS で暗号化してある(../../.sops.yaml。管理者の鍵とクラスタの鍵)。直すときは `tools/t sops edit <このファイル>` して push する。
# クラスタの中では sops-secrets-operator が Secret にし、Reloader の注釈のある workload が入れ替わる。
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
