# 公開経路。証明書は Gateway(deploy/gateway/)のワイルドカードなので指定しない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    # Cloudflare を通さない(コンテナイメージの大きな層の push が、Cloudflare の 100MB の上限に当たる)。deploy/external-dns/README.md
    external-dns.kubernetes.io/cloudflare-proxied: "false"
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https
  hostnames: ["fj.doany.io"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: forgejo-web
          port: 3000
      # 大きいリポジトリの clone / push やコンテナイメージの push は 15 秒では終わらない
      timeouts:
        request: 0s
