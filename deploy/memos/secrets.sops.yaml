# memos の namespace の秘密。
#   memos: oidc-client-secret(Entra の共用のアプリ登録 Main。auth・matrix などと同じ値)/
#     admin-password(管理者 info のパスワード。Entra が使えないときの非常口。英数字 24 文字。
#     変えたら memos.yaml の lifecycle の writeOnlyVersion を上げる。README「管理者」)
#   volsync-data: VolSync の restic の Secret(backup/secrets.sops.yaml と同じ R2 の資格情報とパスワード)
# 値は SOPS で暗号化してある(../../.sops.yaml。管理者の鍵とクラスタの鍵)。直すときは `tools/t sops edit <このファイル>` して push する。
# クラスタの中では sops-secrets-operator が Secret にし、Reloader の注釈のある workload が入れ替わる。
