# ArgoCD の OIDC ログインの client secret(bootstrap/argocd-values.sops.yaml の $argocd-oidc:client-secret)。ラベルで argocd-server が読む。
# 同期は GitHub App の鍵で動くので、Infisical が落ちても復旧は止まらない。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
  annotations:
    # bootstrap/README.md「`InfisicalSecret` には sync-options を 2 つ付けること」
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /argocd/argocd-oidc
  managedKubeSecretReferences:
    - secretName: argocd-oidc
      secretNamespace: argocd
      template:
        # includeAllSecrets が無いと template がフォルダの中身を捨てて空の Secret になる
        includeAllSecrets: true
        metadata:
          labels:
            app.kubernetes.io/part-of: argocd
