# argocd の namespace の秘密。
#   argocd-oidc         OIDC ログインの client secret(bootstrap/argocd-values.sops.yaml の $argocd-oidc:client-secret)。ラベルで argocd-server が読む。
#                       Entra の共用のアプリ登録の値で、auth・headlamp・forgejo・matrix の秘密にも同じ値がある(変えるときは全部)
#   forgejo-repo-creds  Argo CD が Forgejo の doa/* を読む資格情報(repo-creds)。bootstrap/argocd-repos.yaml の gitea scmProvider も使う。
#                       url は https://fj.doany.io/doa(組織名を変えたら直す)、password は read:repository と read:organization だけのトークン
# 値は SOPS で暗号化してある(../../.sops.yaml。管理者の鍵とクラスタの鍵)。直すときは `tools/t sops edit <このファイル>` して push する。
# クラスタの中では sops-secrets-operator が Secret にし、Reloader の注釈のある workload が入れ替わる。
