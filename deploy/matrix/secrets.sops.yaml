# matrix の namespace の秘密。
#   matrix: oidc-client-secret(Entra の共用のアプリ登録。auth などと同じ値)/ hookshot-as-token・hookshot-hs-token(Tuwunel と hookshot の合言葉)/
#           hookshot-passkey-b64(hookshot が秘密を暗号化する RSA 鍵の PEM を base64 で 1 行)/ hook-<部屋>(通知の webhook の ID)/
#           livekit-secret(LiveKit の API キー matrix の秘密。LiveKit と lk-jwt-service で共有)
#   volsync-<pvc>: VolSync の restic の Secret(backup/secrets.sops.yaml と同じ R2 の資格情報とパスワード)
# 値は SOPS で暗号化してある(../../.sops.yaml。管理者の鍵とクラスタの鍵)。直すときは `tools/t sops edit <このファイル>` して push する。
# クラスタの中では sops-secrets-operator が Secret にし、Reloader の注釈のある workload が入れ替わる。
