# 置き場への入口。どの namespace の ExternalSecret もこれを指す(`secretStoreRef: {kind: ClusterSecretStore, name: infisical}`)。
# 認証は Infisical の Kubernetes auth。ESO のコントローラーの ServiceAccount のトークンで、InfisicalSecret と同じ Machine Identity に入る
# (Identity の ID は下の auth.yaml が Secret にする。ESO は ID を Secret からしか読めない)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      # ESO は /api を自分で足す
      hostAPI: http://infisical.infisical.svc:8080
      auth:
        kubernetesAuthCredentials:
          identityId:
            name: infisical-auth
            namespace: external-secrets
            key: identityId
      secretsScope:
        projectSlug: doa
        environmentSlug: prod
---
# Machine Identity の ID(秘密ではない)を Secret にする。Argo CD は Secret を扱わない(resource.exclusions)ので、
# 移すまでの間は Infisical の operator に作らせる(フォルダの中身は使わず、ID を書くだけ)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-auth
  namespace: external-secrets
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: infisical-auth
      secretNamespace: external-secrets
      template:
        data:
          identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
