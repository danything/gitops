# Secret external-dns を Infisical (/external-dns/external-dns) から作る。
#
#   cloudflare-api-token  Cloudflare の Account API token「external-dns (doany.io DNS write)」。
#                         権限は doany.io のゾーンだけの Zone Read + DNS Write
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: external-dns
  namespace: external-dns
  # 2 つとも必須。bootstrap/README.md「InfisicalSecret には sync-options を 2 つ付けること」。
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /external-dns/external-dns
  managedKubeSecretReferences:
    - secretName: external-dns
      secretNamespace: external-dns
