# この namespace の PVC を VolSync で R2 に取る(リポジトリは PVC ごとに `<bucket>/volsync/infisical/<pvc>`)。
# 取り方・時刻・Secret の組み方は ../volsync/application.yaml。アプリと一緒に置くので、アプリを消せばこれも消える
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: volsync
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /backup/backup
        recursive: false
  managedKubeSecretReferences:
    - secretName: volsync-data-postgresql-0
      secretNamespace: infisical
      creationPolicy: Orphan
      template:
        data:
          RESTIC_REPOSITORY: "s3:{{ .endpoint.Value }}/{{ .bucket.Value }}/volsync/infisical/data-postgresql-0"
          RESTIC_PASSWORD: "{{ .repoPassword.Value }}"
          AWS_ACCESS_KEY_ID: "{{ .accessKeyId.Value }}"
          AWS_SECRET_ACCESS_KEY: "{{ .secretAccessKey.Value }}"
          AWS_DEFAULT_REGION: auto
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: data-postgresql-0
  namespace: infisical
spec:
  sourcePVC: data-postgresql-0
  trigger:
    schedule: "0 19 * * *"
  restic:
    repository: volsync-data-postgresql-0
    copyMethod: Snapshot
    retain: {daily: 7, weekly: 4, monthly: 6}
    moverSecurityContext: {runAsUser: 0, runAsGroup: 0}
