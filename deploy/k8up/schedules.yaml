# k8up の Schedule。取る中身は README.md「何をどう取っているか」。
# 注釈だけでは動かない。namespace に Schedule が無いとジョブが作られないので、注釈を足したらここも足す。
#
# - SkipDryRunOnMissingResource は必須(README「CRD がまだ無いクラスタで apps を止めないこと」)
# - prune は `--host=<namespace>` のものしか消さない(`restic/cli/prune.go`)ので namespace ごとに要り、
#   etcd など他のホストには届かない。`tags: [k8up]` は二重の歯止め。check はリポジトリ全体なので 1 本
# - backend は書かない(R2 のアカウント ID が git に載る)。operator のグローバル設定(application.yaml)に
#   寄せてある。ジョブの履歴の数もあちら
# - `runAsUser: 0` は全部に要る。既定の nonroot では 0600 のファイルが読めず、restic は 0 バイトの
#   スナップショットを作り、k8up はそれを Succeeded にする(README「空のスナップショット」)
#
# 時刻は固定で、重ねない。k8up 同士(backup・prune・check)は operator が順に待たせる(`operator/locker/locker.go`)が、
# k8up の外の CronJob は待たない。etcd-snapshot(13:00 UTC)と denpa-encoded-forget(18:30 UTC)の forget と
# k8up の prune はリポジトリを排他でロックするので、重なるとどちらかが落ちる。notify は 18:00 UTC、
# restore-check は毎月 1 日 06:00 UTC。`@daily-random` は時刻がこれらに重なりうるので使わない。
# いまの枠: backup 13:30〜17:45 UTC、prune 日曜 20:30〜23:45 と月曜 00:15 UTC、check 日曜 23:00 UTC
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: matrix
  namespace: matrix
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  backup: {schedule: "30 13 * * *", tags: [k8up], podSecurityContext: {runAsUser: 0, runAsGroup: 0}}
  prune:
    schedule: "15 0 * * 1"
    retention: {keepDaily: 7, keepWeekly: 4, keepMonthly: 6, tags: [k8up]}
---
