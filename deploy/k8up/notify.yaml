# k8up の状態を日次で通知の部屋に 1 行流す。k8up には通知が無く、ArgoCD の通知は Application しか見ない。
# 見張りの中身は下の notify.js のコメント。秘密は `k8up-global` の `mattermostWebhook` に相乗り。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8up-notify
  namespace: k8up
---
# 読むだけ。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8up-notify
rules:
  - apiGroups: [k8up.io]
    resources: [schedules, backups, prunes, checks, restores]
    verbs: [get, list]
  # Schedule の付け忘れ(注釈はあるのに namespace に Schedule が無い)を捕まえるため。名前と注釈しか読まない
  - apiGroups: [""]
    resources: [persistentvolumeclaims, pods]
    verbs: [list]
  # k8up の namespace の CronJob(etcd-snapshot・restore-check など)が最後まで走ったか。status しか読まない
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8up-notify
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8up-notify
subjects:
  - kind: ServiceAccount
    name: k8up-notify
    namespace: k8up
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8up-notify
  namespace: k8up
spec:
  # バックアップ(〜17:45 UTC)の後。同じ時刻に始まった初回のバックアップは「来ていない」と鳴る
  schedule: "0 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: k8up-notify
          initContainers:
            # k8up のイメージに入っている restic でスナップショットの一覧を取る。読むだけ
            - name: snapshots
              image: ghcr.io/k8up-io/k8up:v2.16.1
              command:
                - sh
                - -ec
                - |
                  export RESTIC_REPOSITORY="s3:${ENDPOINT}/${BUCKET}"
                  restic snapshots --json > /work/snapshots.json
                  wc -c /work/snapshots.json
              env:
                - name: ENDPOINT
                  valueFrom: {secretKeyRef: {name: k8up-global, key: endpoint}}
                - name: BUCKET
                  valueFrom: {secretKeyRef: {name: k8up-global, key: bucket}}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: k8up-global, key: accessKeyId}}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: k8up-global, key: secretAccessKey}}
                - name: RESTIC_PASSWORD
                  valueFrom: {secretKeyRef: {name: k8up-global, key: repoPassword}}
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            - name: notify
              # netbird のサイドカーと同じイメージ。kubectl も jq も要らない。
              image: oven/bun:1.4.4-slim
              command: [bun, /script/notify.js]
              env:
                - name: WEBHOOK
                  valueFrom:
                    secretKeyRef:
                      name: k8up-global
                      key: mattermostWebhook
                # Bun の fetch にクラスタの CA を教える。
                - name: NODE_EXTRA_CA_CERTS
                  value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /script
                - name: work
                  mountPath: /work
          volumes:
            - name: script
              configMap:
                name: k8up-notify
            - name: work
              emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8up-notify
  namespace: k8up
data:
  notify.js: |
    // **見るのは restic の中身。** k8up の Backup オブジェクトは掃除され、Schedule を書き換えても消えるので、
    // 有無は「取れたか」の証拠にならない。
    //
    // 見張りは重ねてある(どれか 1 つでは穴が残る):
    //   - 履歴: 過去 8 日に出てきた (host, path) の最新が 25 時間以内か。経路ごとの退行を拾い、一覧を人が持たなくてよい
    //   - Schedule: backup を持つ namespace のホストに 25 時間以内のスナップショットがあるか。履歴は 8 日で忘れるため
    //   - 中身が 0 バイト: 読めないファイルがあっても restic は空のスナップショットを作り、k8up は Succeeded にする
    //   - 注釈があるのに Schedule が無い PVC / Pod: ジョブ自体が作られず、上の 3 つでは一度も来ないものが見えない
    //   - k8up の CR の失敗と、k8up の namespace の CronJob が最後まで走ったか
    // 残る穴: 経路を複数持つ namespace で 1 本だけ 8 日を超えて止まると無音に戻る(その 8 日は毎日鳴る)。
    const WINDOW_H = 25;
    const LEARN_H = 24 * 8;

    const snapshots = await Bun.file("/work/snapshots.json").json();
    const now = Date.now();
    const hours = (t) => (now - Date.parse(t)) / 3600e3;

    const latest = new Map();
    for (const s of snapshots) {
      for (const path of s.paths ?? []) {
        const h = hours(s.time);
        if (h > LEARN_H) continue;
        const key = `${s.hostname}:${path}`;
        if (!latest.has(key) || h < latest.get(key).h) {
          latest.set(key, {
            h,
            host: s.hostname,
            path,
            key: `${s.hostname}${path}`,
            // undefined = 古い restic で summary が無い。0 と区別する。
            bytes: s.summary?.total_bytes_processed,
          });
        }
      }
    }

    // やめた経路を失敗と呼ばない。同じホストでより上の階層が新しく取れていれば、その中身も取れている。
    const fresh = [...latest.values()].filter((x) => x.h <= WINDOW_H);
    const superseded = (x) =>
      fresh.some((f) => f.host === x.host && x.path.startsWith(f.path.replace(/\/$/, "") + "/"));

    const TOKEN = await Bun.file("/var/run/secrets/kubernetes.io/serviceaccount/token").text();
    const fetchAll = async (url, what) => {
      const r = await fetch(url, { headers: { Authorization: `Bearer ${TOKEN}` } });
      if (!r.ok) throw new Error(`${what}: ${r.status} ${await r.text()}`);
      return (await r.json()).items ?? [];
    };
    const get = (kind) => fetchAll(`https://kubernetes.default.svc/apis/k8up.io/v1/${kind}`, kind);
    const getCore = (kind) => fetchAll(`https://kubernetes.default.svc/api/v1/${kind}`, kind);

    // 止めてあるアプリ(Running / Pending の Pod が無い namespace)の stale / 空 / 無音は見送る。
    // 寝かせている間ずっと鳴るため。orphans は設定の話なので止めていても言う。
    const backupNs = new Set(
      (await get("schedules")).filter((s) => s.spec?.backup).map((s) => s.metadata.namespace),
    );
    const pods = await getCore("pods");
    const live = new Set(
      pods.filter((o) => ["Running", "Pending"].includes(o.status?.phase)).map((o) => o.metadata.namespace),
    );
    const parked = [...backupNs].filter((n) => !live.has(n)).sort();
    const isParked = (ns) => parked.includes(ns);

    const stale = [...latest.values()]
      .filter((x) => x.h > WINDOW_H && !superseded(x) && !isParked(x.host))
      .sort((a, b) => b.h - a.h);

    // 中身が 0 バイト(README「空のスナップショット」)。`summary` の無い古いスナップショットは見送る。
    const empty = [...latest.values()].filter(
      (x) => x.h <= WINDOW_H && x.bytes === 0 && !superseded(x) && !isParked(x.host),
    );

    const failed = [];
    for (const kind of ["backups", "prunes", "checks", "restores"]) {
      for (const o of await get(kind)) {
        const c = (o.status?.conditions ?? []).find((x) => x.type === "Completed");
        if (c && c.reason !== "Succeeded") {
          failed.push(`${o.metadata.namespace}/${o.metadata.name}: ${(c.message ?? "").slice(0, 120)}`);
        }
      }
    }

    // Schedule から見た「あるべき姿」。履歴と違って時間で減衰しない。
    const freshHosts = new Set(fresh.map((x) => x.host));
    const silent = [...backupNs].filter((n) => !freshHosts.has(n) && !isParked(n));

    // Schedule の付け忘れ。ファイルは PVC の `k8up.io/backup`、DB は Pod の `k8up.io/backupcommand` なので両方見る。
    const wanted = [
      ...(await getCore("persistentvolumeclaims")).filter(
        (o) => o.metadata.annotations?.["k8up.io/backup"] === "true",
      ),
      ...pods.filter((o) =>
        Object.keys(o.metadata.annotations ?? {}).some((k) =>
          k.startsWith("k8up.io/backupcommand"),
        ),
      ),
    ];
    const orphans = [
      ...new Set(
        wanted
          .filter((o) => !backupNs.has(o.metadata.namespace))
          .map((o) => `${o.metadata.namespace}/${o.metadata.name}`),
      ),
    ];

    // k8up の namespace の CronJob が最後まで走ったか。restore-check は OOMKilled や期限切れでは投稿まで届かない。
    // 最後に予定された回より最後に成功した回が古ければ拾う。走っている最中(自分も)は見ない
    const unfinished = (
      await fetchAll("https://kubernetes.default.svc/apis/batch/v1/namespaces/k8up/cronjobs", "cronjobs")
    )
      .filter(({ status: s = {} }) =>
        s.lastScheduleTime && !(s.active ?? []).length &&
        !(s.lastSuccessfulTime && Date.parse(s.lastSuccessfulTime) >= Date.parse(s.lastScheduleTime)),
      )
      .map((c) => `${c.metadata.name} (${c.status.lastScheduleTime} の回)`);

    const lines = [];
    if (unfinished.length) {
      lines.push(`**最後の回が成功していない CronJob**`);
      for (const u of unfinished) lines.push(`- ${u}`);
    }
    if (stale.length) {
      lines.push(`**${stale.length} 件が ${WINDOW_H} 時間以上更新されていない**`);
      for (const s of stale.slice(0, 15)) lines.push(`- ${s.key} (${s.h.toFixed(0)} 時間前)`);
      if (stale.length > 15) lines.push(`- ほか ${stale.length - 15} 件`);
    }
    if (empty.length) {
      lines.push(`**中身が空のスナップショット(読めていない可能性)**`);
      for (const e of empty.slice(0, 15)) lines.push(`- ${e.key} (0 バイト)`);
    }
    if (silent.length) {
      lines.push(`**${WINDOW_H} 時間以内のスナップショットが 1 つも無い namespace**`);
      for (const n of silent) lines.push(`- ${n}`);
    }
    if (orphans.length) {
      lines.push(`**注釈はあるが namespace に Schedule が無い PVC / Pod**`);
      for (const o of orphans) lines.push(`- ${o}`);
    }
    if (failed.length) {
      lines.push(`**失敗したジョブ**`);
      for (const f of failed.slice(0, 10)) lines.push(`- ${f}`);
    }

    const parkedNote = parked.length ? `。止めてある: ${parked.join(", ")}` : "";
    const text = lines.length
      ? `[k8up] FAILED ❌\n${lines.join("\n")}`
      : `[k8up] OK ✅ (${latest.size} 系統すべて ${WINDOW_H} 時間以内${parkedNote})`;

    console.log(text);
    const r = await fetch(process.env.WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!r.ok) {
      console.error(`Matrix への投稿に失敗: ${r.status} ${await r.text()}`);
      process.exit(1);
    }
    // FAILED でも exit 0。「投稿できた」がこの Job の成功。非ゼロにすると backoffLimit ぶん同じ警告を投稿し、
    // CronJob が Degraded になって ArgoCD が deploy/ の同期を retry に入れて止まる。
