# 最初の管理者を作る。AFFiNE は利用者が 0 人のあいだだけ /api/setup/create-admin-user を受け付け、
# 最初の 1 人に administrator を付ける(src/core/selfhost/controller.ts)。先に誰かが Entra で入ると、
# 管理者のいないまま「初期化済み」になるので、公開の経路(httproute.yaml)より先にクラスタの中から作る。
#
# メールアドレスは Entra で入る info@doany.io と同じにする。Entra で初めて入ったとき、同じアドレスの
# このアカウントに結び付く(plugins/oauth/service.ts の fulfill)。パスワードは Secret の admin-password で、
# Entra が使えないときの非常口(README「最初の管理者」)。
#
# パスワードは printf で JSON に埋めるので、" や \ を含めない(secrets.sops.yaml では英数字 24 文字で作った)。
#
# 2 回目以降は「First user already created」で断られるので、それも成功として扱う(Argo CD が流し直しても同じ)。
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-admin
  namespace: affine
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup-admin
          image: curlimages/curl:8.23.0
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: affine
                  key: admin-password
          command:
            - sh
            - -c
            - |
              set -eu
              until curl -sf http://affine:3010/info >/dev/null; do echo "AFFiNE を待っている"; sleep 10; done
              body=$(printf '{"email":"info@doany.io","name":"Doa","password":"%s"}' "$ADMIN_PASSWORD")
              code=$(curl -s -o /tmp/res -w '%{http_code}' -H 'content-type: application/json' \
                -d "$body" http://affine:3010/api/setup/create-admin-user)
              if [ "$code" = 200 ]; then echo "管理者を作った"; exit 0; fi
              if grep -q 'First user already created' /tmp/res; then echo "もう作ってある"; exit 0; fi
              echo "失敗: $code"; cat /tmp/res; exit 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
