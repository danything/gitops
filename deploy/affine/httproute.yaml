# 公開経路。証明書は Gateway(deploy/gateway/)のワイルドカードなので指定しない。
# 画面・API・WebSocket(同期)・OAuth のコールバックは全部 3010 の 1 つの口。
# 最初の管理者は setup-admin.yaml がこの経路より先に作った(README「最初の管理者」)。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: affine
  namespace: affine
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https
  hostnames: ["an.doany.io"]
  rules:
    - backendRefs:
        - name: affine
          port: 3010
