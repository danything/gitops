# affine の namespace の秘密。
#   affine: postgres-password・redis-password(英数字 32 文字。postgres-password は最初の起動後は変えない)/
#     private-key(署名の鍵。EC P-256 の PEM。変えるとログインのトークンが全部切れる)/
#     oidc-client-secret(Entra の共用のアプリ登録 Main。auth・matrix などと同じ値)/
#     admin-password(最初の管理者 info@doany.io のパスワード。Entra が使えないときの非常口。README「最初の管理者」)
#   volsync-<pvc>: VolSync の restic の Secret(backup/secrets.sops.yaml と同じ R2 の資格情報とパスワード)
# 値は SOPS で暗号化してある(../../.sops.yaml。管理者の鍵とクラスタの鍵)。直すときは `tools/t sops edit <このファイル>` して push する。
# クラスタの中では sops-secrets-operator が Secret にし、Reloader の注釈のある workload が入れ替わる。
