# Secret rybbit は Infisical (il.doany.io) のフォルダ /rybbit/rybbit にあり、
# Infisical 純正 operator (bootstrap/infisical-operator) が Secret にする(mattermost と同じ形)。
#
# | キー | 何に使うか |
# | --- | --- |
# | clickhouse-password | ClickHouse の default ユーザー。backend も同じ値で入る |
# | postgres-password | PostgreSQL の rybbit ユーザー(最初の起動後は変えない。initdb のときだけ効く) |
# | redis-password | Redis の requirepass |
# | better-auth-secret | ログインのセッション署名。変えると全員ログアウト |
#
# 4 つとも英数字だけのランダム(32 文字くらい)。**同期する前に**入れる。無いと Pod が
# CreateContainerConfigError で待つ(入れれば operator が Secret を作って自然に上がる)。
# 値は Infisical の UI で書き換えるだけ(push-bridge が数秒で同期。auto-reload 注釈のある
# Deployment は自動で入れ替わる)。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: rybbit
  namespace: rybbit
  # 2 つとも必須。前者は operator が作る Secret を prune させないため、後者は
  # CRD がまだ無いクラスタで apps/ の同期が丸ごと落ちるのを防ぐため。
  # bootstrap/README.md「InfisicalSecret には sync-options を 2 つ付けること」。
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /rybbit/rybbit
        recursive: false
  managedKubeSecretReferences:
    - secretName: rybbit
      secretNamespace: rybbit
      # Orphan: CR を消しても Secret は残す(移行や再作成で稼働中の Pod を巻き込まない)
      creationPolicy: Orphan
