# Rybbit のユーザー・サイト・設定の DB。forgejo/postgres.yaml と同じ形(17 系、pg_dump を k8up に取らせる)。
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rybbit
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: rybbit
  annotations:
    # DB はファイルとして取らない。下の k8up.io/backupcommand の pg_dump で足りる。
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: rybbit
spec:
  replicas: 1
  # ReadWriteOnce なので古い Pod が消えてから新しい Pod が付ける。RollingUpdate だと詰まる。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        k8up.io/backupcommand: /bin/sh -c 'pg_dump -U rybbit -d analytics --clean --if-exists'
        k8up.io/file-extension: .sql
    spec:
      containers:
        - name: postgres
          image: postgres:17.11
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: analytics
            - name: POSTGRES_USER
              value: rybbit
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rybbit
                  key: postgres-password
            # initdb は空でないディレクトリを嫌うので、マウント先の下の段に置く
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [pg_isready, -U, rybbit, -d, analytics]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
