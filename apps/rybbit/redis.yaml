# Rybbit のセッション追跡・ボット判定のカウンタ。上流の compose どおり noeviction + AOF。
# セッションの鍵は 30 分で消えるのでメモリは増え続けない。データは PVC を持たない(emptyDir)。
# 再起動で消えるのは進行中のセッションの継ぎ目だけで、集計(ClickHouse)には残っている。
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rybbit
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rybbit
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.6.4-alpine
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rybbit
                  key: redis-password
          command:
            - /bin/sh
            - -c
            - exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
          readinessProbe:
            exec:
              command: [/bin/sh, -c, 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
