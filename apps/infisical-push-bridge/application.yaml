# Infisical の Webhook を即時リコンサイルに変えるブリッジ(自作・公開)。
# https://github.com/danything/infisical-push-bridge
# 無料版は operator のポーリング同期しか無いので、保存 → 数秒反映はこれが担う。
# 落ちていても operator の resyncInterval に落ちるだけで壊れない。
#
# セットアップ: Infisical のフォルダ /infisical-push-bridge/infisical-push-bridge に
# `webhook-secret` を置き、プロジェクトの Project Settings → Webhooks で
# URL http://infisical-push-bridge.infisical-push-bridge.svc.cluster.local、
# Secret Path は必ず `/`(既定の `/` はルートにしかマッチしない)、
# 同じ secret key の Webhook を作る(README 参照)。
#
# k3s の HelmChart CRD から移した(2026-09-07)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical-push-bridge
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: infisical-push-bridge
  source:
    repoURL: ghcr.io/danything/charts
    chart: infisical-push-bridge
    targetRevision: 0.1.1
    helm:
      releaseName: infisical-push-bridge
      valuesObject:
        infisicalSecret:
          enabled: true
          hostAPI: http://infisical.infisical.svc:8080/api
          identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
          serviceAccountName: infisical-auth
          serviceAccountNamespace: infisical
          projectSlug: doa
          secretsPath: /infisical-push-bridge/infisical-push-bridge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # CRD より先に同期しにいくと既定の 5 回で諦める(migration-day の 7)。
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
