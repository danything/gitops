# Secret matrix は Infisical (il.doany.io) のフォルダ /matrix/matrix にあり、
# Infisical 純正 operator (bootstrap/infisical-operator) が Secret にする。
#
#   oidc-client-secret     Entra の共用のアプリ登録のクライアントシークレット(auth などと同じ値)
#   hookshot-as-token      Tuwunel と hookshot の合言葉(アプリサービスの登録。長いランダム文字列)
#   hookshot-hs-token      同上
#   hookshot-passkey-b64   hookshot が秘密を暗号化する RSA 鍵(PEM を base64 で 1 行に)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: matrix
  namespace: matrix
  # 2 つとも必須。bootstrap/README.md「InfisicalSecret には sync-options を 2 つ付けること」。
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /matrix/matrix
        recursive: false
  managedKubeSecretReferences:
    - secretName: matrix
      secretNamespace: matrix
      # Orphan: CR を消しても Secret は残す（移行や再作成で稼働中の Pod を巻き込まない）
      creationPolicy: Orphan
