# matrix-hookshot(通知の受け口。https://github.com/matrix-org/matrix-hookshot)。
#
# 使うのは汎用の webhook だけ。外から POST された JSON をルームに投稿する。
#   - `{"text": …}`(Slack 互換の形)はそのまま Markdown として投稿される
#   - それ以外(Slack の attachments、GitHub、Forgejo)は、変換のスクリプト(transformationFunction)で
#     文章に直す。スクリプトは下の connections(静的な接続)に書く ── Argo CD で持てる形
#   - webhook の URL は https://m.doany.io/webhook/<stateKey>
#
# Redis は使わない(キャッシュと暗号化のためのもので、どちらも要らない)。そのため、
# **通知のルームは暗号化しないこと**(hookshot が暗号化したルームに書けない)。
#
# Tuwunel への登録(アプリサービス)は tuwunel.yaml の [global.appservice.hookshot] と対。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hookshot
  namespace: matrix
data:
  config.yml: |
    bridge:
      domain: doany.io
      url: http://tuwunel.matrix.svc:8008
      port: 9993
      bindAddress: 0.0.0.0
    passFile: /data/passkey.pem
    logging:
      level: info
      colorize: false
      json: false
    listeners:
      - port: 9000
        bindAddress: 0.0.0.0
        resources:
          - webhooks
    generic:
      enabled: true
      outbound: false
      urlPrefix: https://m.doany.io/webhook/
      # webhook ごとに送り手のユーザー(@_webhooks_<名前>:doany.io)を作る。名前で誰の通知か分かる
      userIdPrefix: _webhooks_
      # 変換のスクリプトを使う(下の connections)。書けるのは git に入れた人だけなので危なくない
      allowJsTransformationFunctions: true
      # 送り元に「ルームに書けたか」を返す(書けなかったら送り元にエラーが見える)
      waitForComplete: true
      enableHttpGet: false
      # 受け取った JSON をイベントに丸ごと載せない(GitHub の本文は大きい)
      includeHookBody: false
    # GitHub 連携(GitHub App「doa-hookshot」。作り方は apps/matrix/README.md「GitHub 連携」)。
    # 秘密(webhook の secret、OAuth の client secret、App の秘密鍵)は render が差し込む
    github:
      auth:
        id: 5211519
        privateKeyFile: /data/github-key.pem
      webhook:
        secret: ${GITHUB_WEBHOOK_SECRET}
      oauth:
        client_id: Iv23libp5S8aJaOkWq5j
        client_secret: ${GITHUB_CLIENT_SECRET}
        redirect_uri: https://m.doany.io/github/oauth
      defaultOptions:
        hotlinkIssues:
          prefix: "#"
      userIdPrefix: _github_
    permissions:
      - actor: doany.io
        services:
          - service: "*"
            level: admin
    # 通知のルームごとの webhook。URL は https://m.doany.io/webhook/<stateKey>。
    # stateKey は推測されない乱数で、Infisical /matrix/matrix の hook-<部屋>(公開のリポジトリなので git に置かない)。
    # 下の render が HOOK_ で始まる変数(stateKey)を差し替える。送り手は @_webhooks_<name>:doany.io
    #
    # スクリプトは 3 種類。slack(Slack 互換の {text, attachments})、slack-loud(同じで m.text。
    # m.notice は Element の既定でスマホに通知されないので、通知したい部屋だけこちら)、github。
    # slack と slack-loud は本体が同じ(違いは msgtype だけ)。直すときは両方を揃えて直す
    connections:
      # notify-server: k8up の通知、ホストのバックアップ(backup/k3s-backup)
      - connectionType: uk.half-shot.matrix-hookshot.generic.hook
        stateKey: ${HOOK_SERVER}
        roomId: "!ieWtDZbr64u72aU4QqKfmZlmHSVvh8HEgR2zF9zhtxw"
        state:
          name: server
          transformationFunction: &slack |
            // Slack 互換({text, attachments})を Markdown に。<url|名前> をリンクに、:絵文字: を絵文字にする
            const EMOJI = { tada: "🎉", rotating_light: "🚨", bar_chart: "📊", white_check_mark: "✅", heavy_check_mark: "✔️", x: "❌", warning: "⚠️", fire: "🔥", rocket: "🚀", tv: "📺", movie_camera: "🎥", floppy_disk: "💾", wastebasket: "🗑️", hourglass: "⌛", bell: "🔔", information_source: "ℹ️", red_circle: "🔴", green_circle: "🟢", large_blue_circle: "🔵", sparkles: "✨", wave: "👋", bust_in_silhouette: "👤", moneybag: "💰", credit_card: "💳", email: "📧", lock: "🔒", key: "🔑", inbox_tray: "📥", outbox_tray: "📤", memo: "📝", package: "📦", construction: "🚧", stop_sign: "🛑", zap: "⚡", recycle: "♻️", calendar: "📅", clock3: "🕒", "+1": "👍" };
            const md = (s) => String(s ?? "")
              .replace(/<(https?:[^|>]+)\|([^>]+)>/g, "[$2]($1)")
              .replace(/<(https?:[^>]+)>/g, "$1")
              .replace(/:([a-z0-9_+-]+):/g, (m, k) => EMOJI[k] ?? m);
            const parts = [];
            if (data.text) parts.push(md(data.text));
            for (const a of data.attachments ?? []) {
              if (a.pretext) parts.push(md(a.pretext));
              if (a.title) parts.push(a.title_link ? `**[${a.title}](${a.title_link})**` : `**${md(a.title)}**`);
              if (a.text) parts.push(md(a.text));
              const fields = (a.fields ?? []).map((f) => `- **${md(f.title)}**: ${md(f.value)}`);
              if (fields.length) parts.push(fields.join("\n"));
              if (!data.text && !a.title && !a.text && a.fallback) parts.push(md(a.fallback));
            }
            result = parts.length
              ? { version: "v2", plain: parts.join("\n\n"), msgtype: "m.notice" }
              : { version: "v2", empty: true };
      # notify-argocd: Argo CD の通知(bootstrap/argocd/helmchart.yaml)
      - connectionType: uk.half-shot.matrix-hookshot.generic.hook
        stateKey: ${HOOK_ARGOCD}
        roomId: "!BeZ3yus1s1E22DPYFauQjZ1AMGT2VkusuLzLk2r1cJk"
        state:
          name: argocd
          transformationFunction: *slack
      # notify-ashi: ashi
      - connectionType: uk.half-shot.matrix-hookshot.generic.hook
        stateKey: ${HOOK_ASHI}
        roomId: "!Ffdb9KuBulsduDwuX3ig_Mm_L58QUBd78rcfGOTWoNs"
        state:
          name: ashi
          transformationFunction: *slack
      # notify-todoroku: todoroku
      - connectionType: uk.half-shot.matrix-hookshot.generic.hook
        stateKey: ${HOOK_TODOROKU}
        roomId: "!6cY5BJsmPL_0_-t2q2E-veifDIO73fz2ABcZErJXkhQ"
        state:
          name: todoroku
          transformationFunction: *slack
      # notify-worklog: worklog(スマホに通知する)
      - connectionType: uk.half-shot.matrix-hookshot.generic.hook
        stateKey: ${HOOK_WORKLOG}
        roomId: "!aAFRLm9zquKQuIO3X7L-PkvvWcPg7_dqu5WIgYQNhe0"
        state:
          name: worklog
          transformationFunction: &loud |
            // slack と同じ。ただし m.text(スマホに通知が来る。m.notice は既定で通知されない)
            const EMOJI = { tada: "🎉", rotating_light: "🚨", bar_chart: "📊", white_check_mark: "✅", heavy_check_mark: "✔️", x: "❌", warning: "⚠️", fire: "🔥", rocket: "🚀", tv: "📺", movie_camera: "🎥", floppy_disk: "💾", wastebasket: "🗑️", hourglass: "⌛", bell: "🔔", information_source: "ℹ️", red_circle: "🔴", green_circle: "🟢", large_blue_circle: "🔵", sparkles: "✨", wave: "👋", bust_in_silhouette: "👤", moneybag: "💰", credit_card: "💳", email: "📧", lock: "🔒", key: "🔑", inbox_tray: "📥", outbox_tray: "📤", memo: "📝", package: "📦", construction: "🚧", stop_sign: "🛑", zap: "⚡", recycle: "♻️", calendar: "📅", clock3: "🕒", "+1": "👍" };
            const md = (s) => String(s ?? "")
              .replace(/<(https?:[^|>]+)\|([^>]+)>/g, "[$2]($1)")
              .replace(/<(https?:[^>]+)>/g, "$1")
              .replace(/:([a-z0-9_+-]+):/g, (m, k) => EMOJI[k] ?? m);
            const parts = [];
            if (data.text) parts.push(md(data.text));
            for (const a of data.attachments ?? []) {
              if (a.pretext) parts.push(md(a.pretext));
              if (a.title) parts.push(a.title_link ? `**[${a.title}](${a.title_link})**` : `**${md(a.title)}**`);
              if (a.text) parts.push(md(a.text));
              const fields = (a.fields ?? []).map((f) => `- **${md(f.title)}**: ${md(f.value)}`);
              if (fields.length) parts.push(fields.join("\n"));
              if (!data.text && !a.title && !a.text && a.fallback) parts.push(md(a.fallback));
            }
            result = parts.length
              ? { version: "v2", plain: parts.join("\n\n"), msgtype: "m.text" }
              : { version: "v2", empty: true };
      # notify-denpa: denpa(録画の節目。スマホに通知する)
      - connectionType: uk.half-shot.matrix-hookshot.generic.hook
        stateKey: ${HOOK_DENPA}
        roomId: "!CQd-N3QSuFJdX04nG7hg90kLuVi86uXrxOQXgva1oMs"
        state:
          name: denpa
          transformationFunction: *loud
      # notify-forgejo: Forgejo の組織 doa の webhook(種類は Slack)
      - connectionType: uk.half-shot.matrix-hookshot.generic.hook
        stateKey: ${HOOK_FORGEJO}
        roomId: "!46KHKR8zfKiW1lpfzy5QvvoV4y41Hwy9UNmFpStxYHA"
        state:
          name: Forgejo
          transformationFunction: *slack
      # notify-github: GitHub の組織 danything の webhook。コメントとリポジトリの作成・削除だけ(スマホに通知する)
      - connectionType: uk.half-shot.matrix-hookshot.generic.hook
        stateKey: ${HOOK_GITHUB}
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          name: GitHub
          transformationFunction: &github |
            // **組織の webhook の events を増やすときは、このスクリプトも見直す**(最後の分岐は action だけで
            // 「リポジトリの作成」と見ているので、discussion などの created が紛れ込む)。
            // GitHub の組織の webhook。hookshot の GitHub 連携(下の github.repository)が流さないものだけを拾う:
            // issue と PR へのコメント、リポジトリの作成と削除(作られたら下の接続に足す合図)。ヘッダーの種類は来ないので中身で見分ける
            const repo = data.repository ? `[${data.repository.full_name}](${data.repository.html_url})` : "";
            const who = data.sender?.login ?? "";
            const link = (t, u) => `[${String(t).replace(/[\[\]]/g, "")}](${u})`;
            const quote = (s) => "> " + String(s ?? "").slice(0, 500).replace(/\n/g, "\n> ");
            let out = null;
            if (data.zen) {
              out = `🏓 webhook がつながった(${data.hook?.type ?? ""} ${data.hook_id ?? ""})`;
            } else if (data.comment && data.issue && data.action === "created") {
              const kind = data.issue.pull_request ? "PR" : "issue";
              out = `💬 ${repo} ${who} が ${kind} ${link(`#${data.issue.number} ${data.issue.title}`, data.comment.html_url)} にコメント\n\n${quote(data.comment.body)}`;
            } else if (data.comment && data.pull_request && data.action === "created") {
              out = `💬 ${repo} ${who} が PR ${link(`#${data.pull_request.number} ${data.pull_request.title}`, data.comment.html_url)} の差分にコメント\n\n${quote(data.comment.body)}`;
            } else if (data.repository && !data.comment && ["created", "deleted", "archived"].includes(data.action) && !data.issue && !data.pull_request) {
              const verb = { created: "作成", deleted: "削除", archived: "アーカイブ" }[data.action];
              out = `📦 ${who} がリポジトリ ${repo} を${verb}。**apps/matrix/hookshot.yaml の GitHub の接続を${data.action === "created" ? "足す" : "外す"}こと**`;
            }
            result = out
              ? { version: "v2", plain: out, msgtype: "m.text", hints: { showUrlPreviews: false } }
              : { version: "v2", empty: true };
      # notify-github: hookshot の GitHub 連携(GitHub App doa-hookshot)。組織の有効なリポジトリを全部つなぐ。
      # **リポジトリを作ったら足す**(上の汎用の webhook が「作成」を知らせる)。流すのは issue・PR・push・リリース・Actions
      # (コメントは流れないので上の汎用の webhook が拾う)。種類は enableHooks(apps/matrix/README.md「GitHub 連携」)
      - connectionType: uk.half-shot.matrix-hookshot.github.repository
        stateKey: danything/aizuchi
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          org: danything
          repo: aizuchi
          enableHooks: [issue, pull_request, push, release, workflow.run]
      - connectionType: uk.half-shot.matrix-hookshot.github.repository
        stateKey: danything/ashi
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          org: danything
          repo: ashi
          enableHooks: [issue, pull_request, push, release, workflow.run]
      - connectionType: uk.half-shot.matrix-hookshot.github.repository
        stateKey: danything/blog
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          org: danything
          repo: blog
          enableHooks: [issue, pull_request, push, release, workflow.run]
      - connectionType: uk.half-shot.matrix-hookshot.github.repository
        stateKey: danything/denpa
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          org: danything
          repo: denpa
          enableHooks: [issue, pull_request, push, release, workflow.run]
      - connectionType: uk.half-shot.matrix-hookshot.github.repository
        stateKey: danything/denpa-tv
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          org: danything
          repo: denpa-tv
          enableHooks: [issue, pull_request, push, release, workflow.run]
      - connectionType: uk.half-shot.matrix-hookshot.github.repository
        stateKey: danything/genkan
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          org: danything
          repo: genkan
          enableHooks: [issue, pull_request, push, release, workflow.run]
      - connectionType: uk.half-shot.matrix-hookshot.github.repository
        stateKey: danything/.github
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          org: danything
          repo: .github
          enableHooks: [issue, pull_request, push, release, workflow.run]
      - connectionType: uk.half-shot.matrix-hookshot.github.repository
        stateKey: danything/gitops
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          org: danything
          repo: gitops
          enableHooks: [issue, pull_request, push, release, workflow.run]
      - connectionType: uk.half-shot.matrix-hookshot.github.repository
        stateKey: danything/helm-mosp
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          org: danything
          repo: helm-mosp
          enableHooks: [issue, pull_request, push, release, workflow.run]
      - connectionType: uk.half-shot.matrix-hookshot.github.repository
        stateKey: danything/infisical-push-bridge
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          org: danything
          repo: infisical-push-bridge
          enableHooks: [issue, pull_request, push, release, workflow.run]
      - connectionType: uk.half-shot.matrix-hookshot.github.repository
        stateKey: danything/lgtm
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          org: danything
          repo: lgtm
          enableHooks: [issue, pull_request, push, release, workflow.run]
      - connectionType: uk.half-shot.matrix-hookshot.github.repository
        stateKey: danything/wslc-compose
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          org: danything
          repo: wslc-compose
          enableHooks: [issue, pull_request, push, release, workflow.run]
      - connectionType: uk.half-shot.matrix-hookshot.github.repository
        stateKey: danything/xool
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          org: danything
          repo: xool
          enableHooks: [issue, pull_request, push, release, workflow.run]
      - connectionType: uk.half-shot.matrix-hookshot.github.repository
        stateKey: danything/yosegaki
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          org: danything
          repo: yosegaki
          enableHooks: [issue, pull_request, push, release, workflow.run]
      - connectionType: uk.half-shot.matrix-hookshot.github.repository
        stateKey: danything/yuzuriha
        roomId: "!XmjvSqzoJzIjFSIIS4fSALiksG6Afxivn1h7MQgbwwU"
        state:
          org: danything
          repo: yuzuriha
          enableHooks: [issue, pull_request, push, release, workflow.run]
  registration.yml.tmpl: |
    id: hookshot
    as_token: ${AS_TOKEN}
    hs_token: ${HS_TOKEN}
    namespaces:
      rooms: []
      users:
        - regex: "@_webhooks_.*:doany.io"
          exclusive: true
        - regex: "@_github_.*:doany.io"
          exclusive: true
      aliases: []
    sender_localpart: hookshot
    url: http://hookshot.matrix.svc:9993
    rate_limited: false
    receive_ephemeral: true
---
apiVersion: v1
kind: Service
metadata:
  name: hookshot
  namespace: matrix
spec:
  selector:
    app: hookshot
  ports:
    # 外(Gateway の /webhook)から
    - name: webhooks
      port: 9000
      targetPort: 9000
    # Tuwunel から(アプリサービスの API)。外には出さない
    - name: appservice
      port: 9993
      targetPort: 9993
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hookshot
  namespace: matrix
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hookshot
  template:
    metadata:
      labels:
        app: hookshot
    spec:
      initContainers:
        # 秘密を差し込んだ設定一式を /data に置く(hookshot は /data/config.yml と /data/registration.yml を読む)
        - name: render
          image: busybox:1.38
          command:
            - sh
            - -euc
            - |
              cp /config/config.yml /data/config.yml
              # webhook の stateKey(HOOK_*)と GitHub の秘密(GITHUB_*)を差し込む。値は英数字なので sed でそのまま置ける
              env | grep -E '^(HOOK|GITHUB)_' | while IFS='=' read -r k v; do sed -i "s|\${$k}|$v|g" /data/config.yml; done
              if grep -q -E '\$\{(HOOK|GITHUB)_[A-Z_]*\}' /data/config.yml; then echo "差し込めていない値がある" >&2; exit 1; fi
              echo "$GITHUB_KEY_B64" | base64 -d > /data/github-key.pem
              sed -e "s|\${AS_TOKEN}|$AS_TOKEN|" -e "s|\${HS_TOKEN}|$HS_TOKEN|" /config/registration.yml.tmpl > /data/registration.yml
              echo "$PASSKEY_B64" | base64 -d > /data/passkey.pem
              chmod 600 /data/passkey.pem /data/github-key.pem /data/registration.yml
          env:
            - name: AS_TOKEN
              valueFrom: {secretKeyRef: {name: matrix, key: hookshot-as-token}}
            - name: HS_TOKEN
              valueFrom: {secretKeyRef: {name: matrix, key: hookshot-hs-token}}
            - name: PASSKEY_B64
              valueFrom: {secretKeyRef: {name: matrix, key: hookshot-passkey-b64}}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: matrix, key: github-webhook-secret}}
            - name: GITHUB_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: matrix, key: github-client-secret}}
            - name: GITHUB_KEY_B64
              valueFrom: {secretKeyRef: {name: matrix, key: github-private-key-b64}}
            - name: HOOK_SERVER
              valueFrom: {secretKeyRef: {name: matrix, key: hook-server}}
            - name: HOOK_ARGOCD
              valueFrom: {secretKeyRef: {name: matrix, key: hook-argocd}}
            - name: HOOK_ASHI
              valueFrom: {secretKeyRef: {name: matrix, key: hook-ashi}}
            - name: HOOK_TODOROKU
              valueFrom: {secretKeyRef: {name: matrix, key: hook-todoroku}}
            - name: HOOK_WORKLOG
              valueFrom: {secretKeyRef: {name: matrix, key: hook-worklog}}
            - name: HOOK_DENPA
              valueFrom: {secretKeyRef: {name: matrix, key: hook-denpa}}
            - name: HOOK_FORGEJO
              valueFrom: {secretKeyRef: {name: matrix, key: hook-forgejo}}
            - name: HOOK_GITHUB
              valueFrom: {secretKeyRef: {name: matrix, key: hook-github}}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      containers:
        - name: hookshot
          image: ghcr.io/matrix-org/matrix-hookshot:7.5.0
          ports:
            - containerPort: 9000
            - containerPort: 9993
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: config
