# chart は ServiceAccount を組み込みの view に紐付ける。view は Secret を含まない代わりに
# CRD もノードも含まないので、足りないぶんをここで足す。どれも get/list/watch だけ。
#
# helm.cattle.io と k3s.cattle.io は入れていない。Talos で消えるものなので、
# 移行のときに片付ける対象を増やさない。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-extra-read
rules:
  - apiGroups: ["apiextensions.k8s.io", "apiregistration.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - storage.k8s.io
      - scheduling.k8s.io
      - admissionregistration.k8s.io
      - rbac.authorization.k8s.io
      - metrics.k8s.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # クラスタに実際に居る CRD の群。InfisicalSecret は値ではなく参照しか持たないので
  # 読めても秘密は出ない。
  - apiGroups:
      - gateway.networking.k8s.io
      - argoproj.io
      - cert-manager.io
      - acme.cert-manager.io
      - cilium.io
      - k8up.io
      - secrets.infisical.com
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-extra-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-extra-read
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
