# Secret headlamp-oidc を Infisical (/headlamp/headlamp-oidc) から作る。
# chart は externalSecret を envFrom で丸ごと読むので、キーは Headlamp の
# 環境変数名そのままにする: OIDC_CLIENT_ID / OIDC_CLIENT_SECRET / OIDC_ISSUER_URL。
#
# 秘密なのは OIDC_CLIENT_SECRET だけ。残り 2 つは bootstrap/auth/ にも平文で
# 書いてあるが、chart が Secret 1 本から envFrom で読む作りなので同居させる。
# アプリ登録は oauth2-proxy と同じ (b0fa498f-...)。
#
# OIDC_CLIENT_SECRET は値を写さず Infisical の参照で置く:
#   ${prod.auth.auth-secrets.oidc-client-secret}
# 同じ値が 2 か所にあるとローテーションで片方が腐る。参照の解決はクライアント側なので、
# operator の machine identity が /auth/auth-secrets も読める必要がある(読めている)。
# 解決に失敗すると ${...} がそのまま入り、Entra が invalid_client を返す。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: headlamp-oidc
  namespace: headlamp
  # 2 つとも必須。前者は operator が作る Secret を prune させないため、後者は
  # CRD がまだ無いクラスタで apps/ の同期が丸ごと落ちるのを防ぐため。
  # bootstrap/README.md「InfisicalSecret には sync-options を 2 つ付けること」。
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /headlamp/headlamp-oidc
        recursive: false
  managedKubeSecretReferences:
    - secretName: headlamp-oidc
      secretNamespace: headlamp
      creationPolicy: Orphan
