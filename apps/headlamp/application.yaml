# Kubernetes の Web UI。h.doany.io。
#
# Resource Map が Gateway / HTTPRoute / GRPCRoute を最初から知っていて、
# parentRefs と backendRefs の線も定義済みなので、公開経路が 1 枚で出る。
#
# 認証は Entra の OIDC。Headlamp は利用者の id_token を API サーバへ転送するだけで、
# 権限を持たない。誰が何をできるかは apiserver 側で決まる
# (bootstrap/talos.sops.yaml と bootstrap/apiserver-rbac.yaml)。アプリロール admin を
# 持つ人は cluster-admin、それ以外は読み取り専用。
#
# コールバックは Headlamp が要求のホストから組み立てる(Envoy が x-forwarded-proto を
# 付ける)ので指定しない。Entra 側の redirect URI は登録済み
# (https://h.doany.io/oidc-callback)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.45.0
    helm:
      valuesObject:
        serviceAccount:
          create: true
          name: headlamp
        clusterRoleBinding:
          # Headlamp 自身は API サーバを叩かない。利用者のトークンを転送するだけ。
          create: false
        # Infisical が Secret を差し替えたら入れ替わるように(push-bridge → operator)。
        deploymentAnnotations:
          secrets.infisical.com/auto-reload: "true"
        config:
          inCluster: true
          inClusterContextName: main
          oidc:
            # 値は headlamp-secrets.yaml が作る Secret から envFrom で入る。
            # chart 側で作らせないこと。
            secret:
              create: false
            externalSecret:
              enabled: true
              name: headlamp-oidc
        # chart の既定は resources: {} で上限が無い。
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        httpRoute:
          enabled: true
          parentRefs:
            - name: doany
              namespace: kube-system
              sectionName: https
          hostnames:
            - h.doany.io
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # CRD より先に同期しにいくと既定の 5 回で諦める。15s から倍々・上限 5 分・10 回(約 33 分)で自力で戻る。
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
