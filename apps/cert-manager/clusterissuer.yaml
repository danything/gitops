# ワイルドカードを取るので DNS-01。トークンは cert-manager の namespace の Secret(bootstrap/cert-manager-cloudflare-secret.sops.yaml。machine config に載る)。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@doany.io
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: CF_DNS_API_TOKEN
