# cloudflare-ddns の chart を ArgoCD の Application で入れる。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-ddns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare-ddns
  source:
    # OCI のレジストリはスキーム無しで書く(ArgoCD 3.x)。公開なので資格情報は要らない。
    repoURL: ghcr.io/timothymiller
    chart: cloudflare-ddns
    targetRevision: 0.1.0
    helm:
      valuesObject:
        # API token は Infisical operator が作る Secret から(cloudflare-ddns-secrets.yaml)。
        # キーは CLOUDFLARE_API_TOKEN。
        cloudflare:
          existingSecret: cloudflare-ddns-secrets
        # 本物の A/AAAA を持つのは apex だけ。サブドメインは Cloudflare 側で apex への
        # CNAME なので勝手に付いてくる。
        domains: doany.io
        proxied: "true"
        # AAAA は bond0 の static な ::2。SLAAC のアドレスがあるとそちらを選ぶので、
        # bond0 は autoconf=0 で SLAAC を付けない(talos/controlplane.yaml、docs/router.md)。
        # 外向きの probe が拾う一時アドレスではない。この provider は
        # インタフェースを読んで temporary / deprecated を飛ばす。
        ip6Provider: local.iface.stable:bond0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # CRD より先に同期しにいくと既定の 5 回で諦める。15s から倍々・上限 5 分・10 回(約 33 分)で自力で戻る。
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
