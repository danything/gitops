apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cloudflare-ddns
  namespace: kube-system
spec:
  chart: oci://ghcr.io/timothymiller/cloudflare-ddns
  version: 0.1.0
  targetNamespace: cloudflare-ddns
  values:
    # API token comes from the ExternalSecret-managed Secret
    # (cloudflare-ddns-secrets.yaml, value in Infisical), key CLOUDFLARE_API_TOKEN.
    cloudflare:
      existingSecret: cloudflare-ddns-secrets

    # Only the apex holds real A/AAAA records; every subdomain is a CNAME
    # to it in Cloudflare and follows on its own.
    domains: doany.io
    proxied: "true"

    # AAAA should be bond0's static ::2 (also the k3s node IP), not whatever
    # source address an outbound probe happens to pick. This provider reads
    # the interface and skips temporary/deprecated addresses.
    ip6Provider: local.iface.stable:bond0
