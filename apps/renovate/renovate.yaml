# Forgejo(fj.doany.io)の doa。中身は doa/renovate の .forgejo/workflows/renovate.yml の env と同じ。
# Pod から fj.doany.io へは IPv6 でしか届かない(IPv4 はヘアピンで落ちる。apps/forgejo/runner.yaml の冒頭)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-forgejo
  namespace: renovate
spec:
  schedule: "12-59/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 2700
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate
              image: ghcr.io/renovatebot/renovate:44.164.10
              args: [bash, /scripts/run.sh]
              env:
                - name: RENOVATE_PLATFORM
                  value: forgejo
                - name: RENOVATE_ENDPOINT
                  value: https://fj.doany.io/api/v1
                # Forgejo のユーザー renovate のトークン(チーム bots = 全リポジトリに書き込み)
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef: {name: renovate-secrets, key: forgejo-token, optional: true}
                - name: RENOVATE_GIT_AUTHOR
                  value: Renovate Bot <renovate@fj.doany.io>
                - name: RENOVATE_AUTODISCOVER
                  value: "true"
                - name: RENOVATE_AUTODISCOVER_FILTER
                  value: doa/*
                # github.com のリリースノートやタグを読むとき、無いと匿名の回数制限(60 回/時)に当たる。
                # 権限なしの GitHub のトークンでよい。無ければ空で動く
                - name: GITHUB_COM_TOKEN
                  valueFrom:
                    secretKeyRef: {name: renovate-secrets, key: github-com-token, optional: true}
                - name: LOG_LEVEL
                  value: info
              resources:
                requests:
                  cpu: 250m
                  memory: 1Gi
                limits:
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: work
                  mountPath: /tmp/renovate
          volumes:
            - name: scripts
              configMap:
                name: renovate-scripts
            - name: work
              emptyDir:
                sizeLimit: 10Gi
