# 公開している Web はすべてここを通る。証明書はワイルドカード(DNS-01)。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: doany-wildcard
  namespace: kube-system
spec:
  secretName: doany-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - doany.io
    - "*.doany.io"
---
# 2 段のワイルドカードは上の証明書で覆えない
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: doany-sub-wildcard
  namespace: kube-system
spec:
  secretName: doany-sub-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.s.doany.io"
---
# 宅内向け(AdGuard の rewrite だけで引ける名前。DNS-01 なので公開の A は要らない)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: doany-lan-wildcard
  namespace: kube-system
spec:
  secretName: doany-lan-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.l.doany.io"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: doany
  namespace: kube-system
  annotations:
    # ExternalDNS の CNAME の宛先。無いと LAN の 10.0.0.2 を宛先にする
    external-dns.kubernetes.io/target: doany.io
spec:
  gatewayClassName: cilium
  listeners:
    # HTTPS へのリダイレクトは redirect-https.yaml
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # `*.doany.io` は 1 段だけなので apex は別リスナーが要る(証明書は同じ)。
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.doany.io"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: doany-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    # SSO 付きで LAN のホストへ中継
    - name: https-sub
      protocol: HTTPS
      port: 443
      hostname: "*.s.doany.io"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: doany-sub-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-lan
      protocol: HTTPS
      port: 443
      hostname: "*.l.doany.io"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: doany-lan-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-apex
      protocol: HTTPS
      port: 443
      hostname: doany.io
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: doany-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
