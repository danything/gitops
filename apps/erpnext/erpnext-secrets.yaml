# Secret erpnext は Infisical (il.doany.io) のフォルダ /erpnext/erpnext にあり、
# Infisical 純正 operator (bootstrap/infisical-operator) が Secret にする。
# 値は Infisical の UI で書き換えるだけ（push-bridge が数秒で同期。auto-reload 注釈のある
# Deployment は自動で入れ替わる）。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: erpnext
  namespace: erpnext
  # **必須。** 理由は bootstrap/README.md「`Prune=false` を必ず付けること」
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /erpnext/erpnext
        recursive: false
  managedKubeSecretReferences:
    - secretName: erpnext
      secretNamespace: erpnext
      # Orphan: CR を消しても Secret は残す（移行や再作成で稼働中の Pod を巻き込まない）
      creationPolicy: Orphan
