# サイト作成のあとに Entra のソーシャルログイン・利用者のロール・SMTP を入れる。
# 中身は configmap-setup-oidc.yaml。
#
# ArgoCD の PostSync フックにしてある。Job の spec は immutable なので、以前は
# 名前に -vN を付けて手で上げていたが、hook-delete-policy: BeforeHookCreation なら
# ArgoCD が作る前に古いものを消すので固定名でよい。
#
# 同期のたびに走る。スクリプトは何度流しても同じ状態になるように書いてある
# (Social Login Key も Email Account も upsert)。
apiVersion: batch/v1
kind: Job
metadata:
  name: erpnext-setup-oidc
  namespace: erpnext
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # 0 だと一時的な失敗(mariadb がまだ、など)でそのまま Application が Failed になる。
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: sites-dir
          persistentVolumeClaim:
            claimName: erpnext-sites
        - name: script
          configMap:
            name: erpnext-setup-oidc
      containers:
        - name: setup-oidc
          image: frappe/erpnext:version-15
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: erpnext
                  key: oidc-client-secret
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erpnext
                  key: smtp-password
          volumeMounts:
            - name: sites-dir
              mountPath: /home/frappe/frappe-bench/sites
            - name: script
              mountPath: /scripts
          command: [bash, /scripts/run.sh]
