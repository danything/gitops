apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: erpnext
  namespace: kube-system
spec:
  chart: erpnext
  repo: https://helm.erpnext.com
  version: 8.0.15
  targetNamespace: erpnext
  createNamespace: true
  values:
    image:
      tag: version-15

    # Externally-managed PVC (see pvc.yaml) so site data survives even if
    # this release ever gets uninstalled/reinstalled by the helm-controller.
    persistence:
      worker:
        existingClaim: erpnext-sites

    # rootPassword explicitly emptied (not omitted -- an omitted key falls
    # back to the chart's own default "changeit", which re-enables the
    # chart's auto-created Secret and collides with our externally-managed
    # one). Empty disables that Secret template, so the ExternalSecret-managed
    # Secret of the same name/key (erpnext-secrets.yaml, values in Infisical)
    # provides it instead.
    mariadb-sts:
      enabled: true
      rootPassword: ""
      persistence:
        storageClass: local-path-retain

    # chart has no mariadb-sts branch for DB_ROOT_USER, falls back to this
    dbRootUser: root

    # Dragonfly sizes one io_uring ring per proactor thread and defaults to
    # one thread per CPU -- 44 here, ~98KB of ring per thread, so ~4.3MB of
    # locked memory per instance. io_uring accounts that against the uid's
    # RLIMIT_MEMLOCK, which is 8MiB for containers under the k3s unit and is
    # shared across processes, so whichever of cache/queue starts second ran
    # out of it and SIGSEGV'd in a crash loop (taking the workers, scheduler
    # and socketio down with it). Four threads is plenty for ERPNext's cache
    # and job queue and keeps both instances well inside the limit.
    #
    # maxmemory is capped separately: left unset, Dragonfly reads the node's
    # free memory and sizes itself at ~31GiB per instance, which is a
    # standing OOM risk for everything else on this node. Real usage is
    # single-digit MiB (cache ~4MiB, queue ~2MiB), so 1GiB is generous. The
    # container limit sits above maxmemory to leave room for Dragonfly's own
    # overhead; no CPU limit, since throttling the proactor threads hurts
    # latency more than an idle-at-30m instance can justify.
    #
    # cache_mode (LRU-style eviction as maxmemory is approached) is on for
    # the cache only -- dropping a cache entry is free, whereas the queue's
    # default noeviction keeps enqueued background jobs from silently
    # disappearing if it ever does fill up.
    dragonfly-cache:
      extraArgs:
        - "--proactor_threads=4"
        - "--maxmemory=1gb"
        - "--cache_mode=true"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 1536Mi

    dragonfly-queue:
      extraArgs:
        - "--proactor_threads=4"
        - "--maxmemory=1gb"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 1536Mi

    jobs:
      createSite:
        enabled: true
        siteName: en.doany.io
        adminExistingSecret: erpnext
        adminExistingSecretKey: admin-password

    # The post-install OIDC/SMTP setup job used to live here as
    # jobs.custom, but Job specs are immutable and this chart's custom-job
    # mechanism doesn't expose an annotations field, so every edit required
    # manually deleting the Job before it could be re-applied. It's now a
    # plain manifest (job-setup-oidc.yaml) with an ArgoCD Replace=true
    # sync-option, which handles that automatically.
