# **論理バックアップだけ。** PVC のファイルはホストの backup/k3s-backup が写している。
# ここで取るのは helmchart.yaml の worker.gunicorn.podAnnotations が出す
# mariadb-dump の中身だけ(operator を BACKUP_SKIP_WITHOUT_ANNOTATION で
# 「注釈が無い PVC は取らない」側に倒してある。apps/k8up/)。
#
# **タグを必ず付ける。** Prune は retention.tags を書かないと restic forget を
# リポジトリ全体に効かせる。ホストのスクリプトは --tag k3s-host で自分のぶんだけを
# 消しているので、こちらも自分のぶんだけに絞る。
#
# 時刻はホストのスクリプト(19:00 UTC = 04:00 JST)と mattermost の Schedule を避ける。
# restic はリポジトリをロックするので、重なると片方が待たされる。
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  # **CRD がまだ無いクラスタでも apps 全体を止めない。** ArgoCD は同期の前に
  # マニフェスト一式を dry-run で検証するので、k8up の CRD が入る前だと
  # 「k8up.io/v1 が引けない」で **apps/ 配下が丸ごと適用されなくなる**
  # (2026-09-07 の復元リハーサルで発覚。子 Application 5 本が作られなかった)。
  # このリソースだけ dry-run を飛ばせば、CRD を入れる Application が先に通る。
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: erpnext
  namespace: erpnext
spec:
  backup:
    schedule: "30 15 * * *"
    tags:
      - k8up
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 1
  prune:
    schedule: "30 16 * * 0"
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
      tags:
        - k8up
