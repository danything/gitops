# **論理バックアップだけ。** PVC のファイルはホストの backup/k3s-backup が写している。
# ここで取るのは helmchart.yaml の worker.gunicorn.podAnnotations が出す
# mariadb-dump の中身だけ(operator を BACKUP_SKIP_WITHOUT_ANNOTATION で
# 「注釈が無い PVC は取らない」側に倒してある。apps/k8up/)。
#
# **タグを必ず付ける。** Prune は retention.tags を書かないと restic forget を
# リポジトリ全体に効かせる。ホストのスクリプトは --tag k3s-host で自分のぶんだけを
# 消しているので、こちらも自分のぶんだけに絞る。
#
# 時刻はホストのスクリプト(19:00 UTC = 04:00 JST)と mattermost の Schedule を避ける。
# restic はリポジトリをロックするので、重なると片方が待たされる。
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: erpnext
  namespace: erpnext
spec:
  backup:
    schedule: "30 15 * * *"
    tags:
      - k8up
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 1
  prune:
    schedule: "30 16 * * 0"
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
      tags:
        - k8up
