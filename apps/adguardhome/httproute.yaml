# 公開経路。証明書は Gateway(apps/gateway/)のリスナーに付いているので指定しない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguardhome
  namespace: adguardhome
  annotations:
    # Cloudflare を通さない(同じ名前で DoT の 853 を受けている。Cloudflare は 853 を通さない)。apps/external-dns/README.md
    external-dns.kubernetes.io/cloudflare-proxied: "false"
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https
  hostnames: ["ah.doany.io"]
  rules:
    # DoH(/dns-query)は AdGuard の HTTPS でしか出ないので、サイドカーへ回す。
    # Gateway API は長いパスを優先するので、下の / より先に当たる。
    - matches:
        - path:
            type: PathPrefix
            value: /dns-query
      backendRefs:
        - group: ""
          kind: Service
          name: adguardhome-web
          port: 8081
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # 管理画面は oauth2-proxy(apps/auth/adguard-proxy.yaml)の後ろ。auth 側に ReferenceGrant がある。
        # `/dns-query` は上のルールで先に拾われる。ここを通すと DoH に認証がかかって
        # 名前解決が止まる。
        - name: auth-adguard
          namespace: auth
          port: 4180
