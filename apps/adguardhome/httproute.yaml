# 公開経路。証明書は Gateway(bootstrap/gateway/)のリスナーに付いているので指定しない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguardhome
  namespace: adguardhome
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https
  hostnames: ["ah.doany.io"]
  rules:
    # DoH(/dns-query)は AdGuard の HTTPS でしか出ないので、サイドカーへ回す。
    # Gateway API は長いパスを優先するので、下の / より先に当たる。
    - matches:
        - path:
            type: PathPrefix
            value: /dns-query
      backendRefs:
        - group: ""
          kind: Service
          name: adguardhome-web
          port: 8081
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # **管理画面は SSO の後ろ。** AdGuard 自身には SSO が無いので oauth2-proxy を
        # 前段に置く(bootstrap/auth/adguard-proxy.yaml)。名前空間をまたぐので
        # auth 側に ReferenceGrant がある。
        # **`/dns-query` は上のルールで先に拾われる。** ここを通すと DoH に認証がかかって
        # 名前解決が止まる(2026-09-07 朝の障害)。
        - name: auth-adguard
          namespace: auth
          port: 4180
