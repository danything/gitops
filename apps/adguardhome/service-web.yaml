apiVersion: v1
kind: Service
metadata:
  name: adguardhome-web
  namespace: adguardhome
spec:
  selector:
    app: adguardhome
  ports:
    # HTTPRoute はこちらの平文の 80 に繋ぐ。AdGuard 自身は 443 も待ち受けているが、
    # backend を HTTPS にすると BackendTLSPolicy が要るうえ、自己署名なので検証の
    # 省略を素直に書けない。クラスタ内の通信なので平文でよい。
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
    # DoH は AdGuard の HTTPS でしか出ないので、サイドカー経由で渡す(deployment.yaml)。
    - name: doh
      protocol: TCP
      port: 8081
      targetPort: 8081
