apiVersion: v1
kind: Service
metadata:
  name: adguardhome-web
  namespace: adguardhome
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: adguardhome-insecure-transport@kubernetescrd
spec:
  selector:
    app: adguardhome
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
    # Gateway API 経由はこちらを使う。Traefik は backend も HTTPS で繋いでいて
    # (上の serversscheme/serverstransport 注釈)、Gateway API で同じことをするには
    # BackendTLSPolicy が要るうえ検証の省略が素直に書けない。クラスタ内の通信なので平文でよい。
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: insecure-transport
  namespace: adguardhome
spec:
  insecureSkipVerify: true
