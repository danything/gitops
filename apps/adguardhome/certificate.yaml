# DoT(853)で使う証明書。以前は Traefik の acme.json を acme-watcher が監視して PVC に書き出していたが、
# cert-manager が直接 Secret に発行する形にした(deployment.yaml がその Secret をマウントする)。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: adguard-dot
  namespace: adguardhome
spec:
  secretName: adguard-dot-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    # **移行のあいだは両方。** 命名規則(../../README.md「ホスト名の付け方」)では
    # AdGuard Home は 2 語なので `ah`。`d` は規則より前に取ったもの。
    # DoT と DoH をこの名前で設定している端末を移し終えたら `d.doany.io` を消す。
    - ah.doany.io
    - d.doany.io
