# DoT(853)で使う証明書。deployment.yaml がこの Secret をマウントする。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: adguard-dot
  namespace: adguardhome
spec:
  secretName: adguard-dot-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    # 命名規則(../../README.md「ホスト名の付け方」)どおり、AdGuard Home の 2 語で `ah`。
    - ah.doany.io
