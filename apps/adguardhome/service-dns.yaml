apiVersion: v1
kind: Service
metadata:
  name: adguardhome-dns
  namespace: adguardhome
spec:
  # ClusterIP でよい理由は docs/decisions.md「ルーティングの選定」の hostPort の表
  type: ClusterIP
  # 無いと IPv4 だけの Service になる。
  ipFamilyPolicy: RequireDualStack
  ipFamilies:
    - IPv4
    - IPv6
  externalIPs:
    - 10.10.0.4
  selector:
    app: adguardhome
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 53
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53
    - name: dot
      protocol: TCP
      port: 853
      targetPort: 853
