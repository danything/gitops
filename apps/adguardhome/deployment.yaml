apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome
  namespace: adguardhome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguardhome
  template:
    metadata:
      labels:
        app: adguardhome
    spec:
      containers:
        - name: adguardhome
          image: adguard/adguardhome:latest
          env:
            - name: TZ
              value: Asia/Tokyo
          volumeMounts:
            - name: adguardhome-conf
              mountPath: /opt/adguardhome/conf
            - name: adguardhome-work
              mountPath: /opt/adguardhome/work
            - name: adguardhome-ssl
              mountPath: /opt/adguardhome/ssl
      volumes:
        - name: adguardhome-conf
          persistentVolumeClaim:
            claimName: adguardhome-conf
        - name: adguardhome-work
          persistentVolumeClaim:
            claimName: adguardhome-work
        - name: adguardhome-ssl
          persistentVolumeClaim:
            claimName: adguardhome-ssl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-watcher
  namespace: adguardhome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acme-watcher
  template:
    metadata:
      labels:
        app: acme-watcher
    spec:
      containers:
        - name: acme-watcher
          image: alpine:3.18
          env:
            - name: ACME_JSON
              value: "/host/traefik/acme.json"
            - name: SCRIPT_PATH
              value: "/host/adguard-ssl/process_acme_script.sh"
            - name: DOMAIN
              value: "d.doany.io"
            - name: OUT_DIR
              value: "/host/adguard-ssl"
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              apk add --no-cache inotify-tools jq coreutils bash >/dev/null 2>&1 || true
              # 初回実行
              if [ -x "${SCRIPT_PATH}" ]; then
                /bin/sh "${SCRIPT_PATH}" || true
              else
                echo "script not executable: ${SCRIPT_PATH}" >&2
                exit 2
              fi
              # 監視ループ
              while inotifywait -e close_write -e moved_to -e create "${ACME_JSON}"; do
                echo "$(date -Iseconds) acme.json changed, running script"
                /bin/sh "${SCRIPT_PATH}" || true
              done
          volumeMounts:
            - name: traefik-acme
              mountPath: /host/traefik
              readOnly: true
            - name: adguard-ssl
              mountPath: /host/adguard-ssl
      volumes:
        - name: traefik-acme
          hostPath:
            # traefik/acme.json now lives in a PVC (kube-system/traefik-acme,
            # local-path-retain). PVCs are namespace-scoped and local-path
            # doesn't support ReadWriteMany, so this cross-namespace reader
            # points directly at the PV's resolved on-disk directory instead.
            # Safe because the PV is Retain and its path is stable.
            path: /var/lib/rancher/k3s/storage/pvc-644cbb1d-786b-4d52-8632-6edd9536cb50_kube-system_traefik-acme
            type: Directory
        - name: adguard-ssl
          persistentVolumeClaim:
            claimName: adguardhome-ssl
