apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome
  namespace: adguardhome
  annotations:
    # AdGuard 自身の認証は切ってある(`users: []`、2026-09-07)。守っているのは前段の
    # oauth2-proxy(bootstrap/auth/adguard-proxy.yaml)で、通るのは Entra のアプリロール
    # `admin` を持つ人だけ。AdGuard には SSO も利用者管理も無く、上流の認証プロキシ対応も
    # 2020 年から open のままなので、認証を 1 か所(Entra)に寄せた。
    # Web の口はクラスタ内からは無認証になる。外からは Gateway 経由だけで、その手前に SSO がある。
    #
    # AdGuard の設定の正本は initContainer の `CONFIG`(下)。UI で変えた設定は Pod が作り直されると戻る (2026-10-07 から)。
    #
    # クエリログの保持は 90d だと querylog.json だけで 2 GB に育ち、毎日のバックアップに乗るので
    # 7d に縮めた (2026-09-06。`CONFIG` の querylog.interval)。
spec:
  replicas: 1
  # hostPort を持つので同じポートを 2 つの Pod が同時に掴めない。RollingUpdate だと
  # 新しい Pod が Pending のまま止まるため Recreate にする。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adguardhome
  template:
    metadata:
      labels:
        app: adguardhome
    spec:
      # 設定の正本は下の `CONFIG`。起動のたびに PVC の AdGuardHome.yaml に書き戻してから AdGuard を起動する
      # (AdGuard は設定ファイルを書き換えるので、読み取り専用の ConfigMap を直接マウントしない)。
      # **Pod の定義の中に置くのは、設定を変えれば Pod が作り直されるようにするため**(ConfigMap だと変えても
      # Pod は古い設定のまま動き続け、2026-10-18 まではハッシュの注釈と CI で見張っていた)。
      initContainers:
        - name: config
          image: busybox:1.38
          command: ["sh", "-c", 'printf "%s" "$CONFIG" > /opt/adguardhome/conf/AdGuardHome.yaml']
          volumeMounts:
            - name: adguardhome-conf
              mountPath: /opt/adguardhome/conf
          env:
            # AdGuard の設定(AdGuardHome.yaml)そのもの。UI で変えた設定は、次に Pod が作り直されたときに戻る。
            # - 版が上がると AdGuard は起動時に設定を移行する(schema_version)。Renovate の版上げの PR の中で
            #   renovate-post-upgrade.sh が新しい版に移行させ、ここを書き換えてコミットする
            # - **`$(` を書かないこと。** env の値の `$(名前)` は kubelet が別の env に展開する
            # - gitops は公開リポジトリ。クライアントの固定設定(端末名・MAC)などを足すときは公開してよいか考える
            - name: CONFIG
              value: |
                http:
                  pprof:
                    port: 6060
                    enabled: false
                  doh:
                    routes:
                      - GET /dns-query
                      - POST /dns-query
                      - GET /dns-query/{ClientID}
                      - POST /dns-query/{ClientID}
                    insecure_enabled: false
                  address: 0.0.0.0:80
                  session_ttl: 30d
                users: []
                auth_attempts: 5
                block_auth_min: 15
                http_proxy: ""
                language: ""
                theme: auto
                dns:
                  bind_hosts:
                    - '::'
                  port: 53
                  anonymize_client_ip: false
                  ratelimit: 20
                  ratelimit_subnet_len_ipv4: 24
                  ratelimit_subnet_len_ipv6: 56
                  ratelimit_whitelist: []
                  refuse_any: true
                  upstream_dns:
                    - https://cloudflare-dns.com/dns-query
                  upstream_dns_file: ""
                  bootstrap_dns:
                    - 1.1.1.1
                    - 1.0.0.1
                    - 2606:4700:4700::1111
                    - 2606:4700:4700::1001
                  fallback_dns: []
                  upstream_mode: load_balance
                  fastest_timeout: 1s
                  allowed_clients: []
                  disallowed_clients: []
                  blocked_hosts:
                    - version.bind
                    - id.server
                    - hostname.bind
                  trusted_proxies:
                    - 127.0.0.0/8
                    - ::1/128
                    - 10.42.0.0/16
                    - fd42::/64
                  cache_enabled: true
                  cache_size: 4194304
                  cache_ttl_min: 0
                  cache_ttl_max: 0
                  cache_optimistic: false
                  cache_optimistic_answer_ttl: 30s
                  cache_optimistic_max_age: 12h
                  bogus_nxdomain: []
                  aaaa_disabled: false
                  enable_dnssec: true
                  edns_client_subnet:
                    custom_ip: ""
                    enabled: false
                    use_custom: false
                  max_goroutines: 300
                  handle_ddr: true
                  ipset: []
                  ipset_file: ""
                  bootstrap_prefer_ipv6: false
                  upstream_timeout: 10s
                  private_networks: []
                  use_private_ptr_resolvers: true
                  local_ptr_upstreams: []
                  use_dns64: false
                  dns64_prefixes: []
                  serve_http3: false
                  use_http3_upstreams: false
                  serve_plain_dns: true
                  hostsfile_enabled: true
                  pending_requests:
                    enabled: true
                tls:
                  enabled: true
                  server_name: d.doany.io
                  force_https: false
                  port_https: 443
                  port_dns_over_tls: 853
                  port_dns_over_quic: 853
                  port_dnscrypt: 0
                  dnscrypt_config_file: ""
                  certificate_chain: ""
                  private_key: ""
                  certificate_path: /opt/adguardhome/ssl/server.crt
                  private_key_path: /opt/adguardhome/ssl/server.key
                  strict_sni_check: false
                querylog:
                  dir_path: ""
                  ignored: []
                  interval: 7d
                  size_memory: 1000
                  enabled: true
                  ignored_enabled: false
                  file_enabled: true
                statistics:
                  dir_path: ""
                  ignored: []
                  interval: 1d
                  enabled: true
                  ignored_enabled: false
                filters:
                  - enabled: true
                    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_48.txt
                    name: HaGeZi's Pro Blocklist
                    id: 1783264397
                whitelist_filters: []
                user_rules:
                  - ""
                dhcp:
                  enabled: false
                  interface_name: ""
                  local_domain_name: lan
                  dhcpv4:
                    gateway_ip: ""
                    subnet_mask: ""
                    range_start: ""
                    range_end: ""
                    lease_duration: 86400
                    icmp_timeout_msec: 1000
                    options: []
                  dhcpv6:
                    range_start: ""
                    lease_duration: 86400
                    ra_slaac_only: false
                    ra_allow_slaac: false
                filtering:
                  blocking_ipv4: ""
                  blocking_ipv6: ""
                  blocked_services:
                    schedule:
                      time_zone: Asia/Tokyo
                    ids: []
                  protection_disabled_until: null
                  safe_search:
                    enabled: false
                    bing: true
                    duckduckgo: true
                    ecosia: true
                    google: true
                    pixabay: true
                    yandex: true
                    youtube: true
                  blocking_mode: default
                  parental_block_host: family-block.dns.adguard.com
                  safebrowsing_block_host: standard-block.dns.adguard.com
                  rewrites:
                    - domain: '*.l.doany.io'
                      answer: 10.10.0.4
                      enabled: true
                  safe_fs_patterns:
                    - /opt/adguardhome/work/userfilters/*
                  max_http_size: 256MB
                  safebrowsing_cache_size: 1048576
                  safesearch_cache_size: 1048576
                  parental_cache_size: 1048576
                  cache_time: 30
                  filters_update_interval: 24
                  blocked_response_ttl: 10
                  filtering_enabled: true
                  rewrites_enabled: true
                  parental_enabled: false
                  safebrowsing_enabled: false
                  protection_enabled: true
                clients:
                  runtime_sources:
                    whois: true
                    arp: true
                    rdns: true
                    dhcp: true
                    hosts: true
                  persistent: []
                log:
                  enabled: true
                  file: ""
                  max_backups: 0
                  max_size: 100
                  max_age: 3
                  compress: false
                  local_time: false
                  verbose: false
                os:
                  group: ""
                  user: ""
                  rlimit_nofile: 0
                schema_version: 34
      containers:
        - name: adguardhome
          # 版を固定する (2026-10-07 まで latest)。上げると起動時に設定を移行する (schema_version) ので、
          # Renovate の PR の中で renovate-post-upgrade.sh が config.yaml も移行しておく。その PR は自動マージする
          image: adguard/adguardhome:v0.107.79
          # LoadBalancer は使わず、ノードの全アドレスで受けるために hostPort を持つ(docs/decisions.md「LoadBalancer をどう置き換えるか」)。
          # hostPort は送信元 IP を保つので、AdGuard のクライアント別統計も従来どおり。
          ports:
            - name: dns-udp
              containerPort: 53
              hostPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              hostPort: 53
              protocol: TCP
            - name: dot
              containerPort: 853
              hostPort: 853
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Tokyo
          volumeMounts:
            - name: adguardhome-conf
              mountPath: /opt/adguardhome/conf
            - name: adguardhome-work
              mountPath: /opt/adguardhome/work
            - name: adguardhome-ssl
              mountPath: /opt/adguardhome/ssl
        # DoH(/dns-query)だけを平文で受けて AdGuard の HTTPS へ渡す。理由は doh-proxy-config.yaml。
        - name: doh-proxy
          image: nginx:1.31-alpine
          ports:
            - name: doh
              containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: doh-proxy-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: adguardhome-conf
          persistentVolumeClaim:
            claimName: adguardhome-conf
        - name: adguardhome-work
          persistentVolumeClaim:
            claimName: adguardhome-work
        - name: doh-proxy-config
          configMap:
            name: doh-proxy
        # DoT(853)用の証明書。cert-manager が ah.doany.io で発行した Secret を、
        # AdGuard の設定が見ているファイル名(server.crt / server.key)に読み替えて渡す。
        # 以前は Traefik の acme.json を監視する acme-watcher が PVC に書き出していた。
        - name: adguardhome-ssl
          secret:
            secretName: adguard-dot-tls
            items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
