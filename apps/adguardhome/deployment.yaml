apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome
  namespace: adguardhome
  annotations:
    # AdGuard 自身の認証は切ってある(`users: []`、2026-09-07)。守っているのは前段の
    # oauth2-proxy(bootstrap/auth/adguard-proxy.yaml)で、通るのは Entra のアプリロール
    # `admin` を持つ人だけ。AdGuard には SSO も利用者管理も無く、上流の認証プロキシ対応も
    # 2020 年から open のままなので、認証を 1 か所(Entra)に寄せた。
    # Web の口はクラスタ内からは無認証になる。外からは Gateway 経由だけで、その手前に SSO がある。
    #
    # AdGuard の設定の正本は config.yaml (ConfigMap)。起動時に initContainer が PVC の
    # AdGuardHome.yaml に書き戻すので、UI で変えた設定は Pod が作り直されると戻る (2026-10-07 から)。
    # 変えるときは config.yaml を直し、下の `doany.io/config-sha256` も変える。
    #
    # クエリログの保持は 90d だと querylog.json だけで 2 GB に育ち、毎日のバックアップに乗るので
    # 7d に縮めた (2026-09-06。config.yaml の querylog.interval)。
spec:
  replicas: 1
  # hostPort を持つので同じポートを 2 つの Pod が同時に掴めない。RollingUpdate だと
  # 新しい Pod が Pending のまま止まるため Recreate にする。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adguardhome
  template:
    metadata:
      labels:
        app: adguardhome
      annotations:
        # config.yaml の sha256 (`sha256sum apps/adguardhome/config.yaml`)。ConfigMap が変わっても
        # Pod は作り直されないので、ここを変えて作り直させる。ずれていると CI (adguard-config) が落ちる
        doany.io/config-sha256: 5e3bc965c8f5cfd2c2dcd2bba1e58e9ababe80dc49c508b5ed0626ce8b068fbe
    spec:
      # git の設定 (config.yaml) を PVC に書き戻してから AdGuard を起動する。AdGuard は設定ファイルを
      # 書き換えるので、ConfigMap を直接マウントせずにコピーする
      initContainers:
        - name: config
          image: busybox:1.38
          command: ["cp", "/config/AdGuardHome.yaml", "/opt/adguardhome/conf/AdGuardHome.yaml"]
          volumeMounts:
            - name: adguardhome-config
              mountPath: /config
            - name: adguardhome-conf
              mountPath: /opt/adguardhome/conf
      containers:
        - name: adguardhome
          # 版を固定する (2026-10-07 まで latest)。上げると起動時に設定を移行する (schema_version) ので、
          # Renovate の PR は自動マージしない (renovate.json)。上げたら移行後の設定を config.yaml に入れ直す
          image: adguard/adguardhome:v0.107.79
          # ServiceLB(k3s 組み込み)をやめたので、ノードの全アドレスで受けるために hostPort を持つ。
          # Talos には ServiceLB 相当が無いので、この形がそのまま移行先でも使える。
          # hostPort は送信元 IP を保つので、AdGuard のクライアント別統計も従来どおり。
          ports:
            - name: dns-udp
              containerPort: 53
              hostPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              hostPort: 53
              protocol: TCP
            - name: dot
              containerPort: 853
              hostPort: 853
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Tokyo
          volumeMounts:
            - name: adguardhome-conf
              mountPath: /opt/adguardhome/conf
            - name: adguardhome-work
              mountPath: /opt/adguardhome/work
            - name: adguardhome-ssl
              mountPath: /opt/adguardhome/ssl
        # DoH(/dns-query)だけを平文で受けて AdGuard の HTTPS へ渡す。理由は doh-proxy-config.yaml。
        - name: doh-proxy
          image: nginx:1.31-alpine
          ports:
            - name: doh
              containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: doh-proxy-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: adguardhome-conf
          persistentVolumeClaim:
            claimName: adguardhome-conf
        - name: adguardhome-work
          persistentVolumeClaim:
            claimName: adguardhome-work
        - name: doh-proxy-config
          configMap:
            name: doh-proxy
        - name: adguardhome-config
          configMap:
            name: adguardhome-config
        # DoT(853)用の証明書。cert-manager が ah.doany.io で発行した Secret を、
        # AdGuard の設定が見ているファイル名(server.crt / server.key)に読み替えて渡す。
        # 以前は Traefik の acme.json を監視する acme-watcher が PVC に書き出していた。
        - name: adguardhome-ssl
          secret:
            secretName: adguard-dot-tls
            items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
