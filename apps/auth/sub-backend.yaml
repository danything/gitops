# *.s.doany.io の中継先(LAN の 10.10.0.2)を名前で指すための Service と手書きの EndpointSlice
apiVersion: v1
kind: Service
metadata:
  name: sub-backend
  namespace: kube-system
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: sub-backend-manual
  namespace: kube-system
  labels:
    kubernetes.io/service-name: sub-backend
addressType: IPv4
# API サーバが足す既定値(`protocol`・`conditions`)も書く。書かないと ArgoCD がずっと OutOfSync と見る
ports:
  - name: http
    port: 80
    protocol: TCP
endpoints:
  - addresses: ["10.10.0.2"]
    conditions: {}
