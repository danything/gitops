apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: quay.io/oauth2-proxy/oauth2-proxy:latest
          args:
            - --http-address=0.0.0.0:4180
            # X-Forwarded-* はクラスタ内(Gateway の Envoy)からだけ信じる
            - --trusted-proxy-ip=10.42.0.0/16
          ports:
            - containerPort: 4180
          env:
            # 汎用の oidc は groups スコープを要求して Entra に弾かれる(AADSTS650053)
            - name: OAUTH2_PROXY_PROVIDER
              value: entra-id
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://login.microsoftonline.com/22ac977d-b140-4dc8-8150-90d645d3475b/v2.0
            - name: OAUTH2_PROXY_SCOPE
              value: openid email profile
            - name: OAUTH2_PROXY_CLIENT_ID
              value: b0fa498f-7e6a-4fe1-a1c6-16fbbb6f397e
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: oidc-client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: cookie-secret
            # Entra は redirect URI の完全一致を求めるので固定の 1 つ
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: https://a.doany.io/oauth2/callback
            - name: OAUTH2_PROXY_COOKIE_DOMAINS
              value: .doany.io
            - name: OAUTH2_PROXY_WHITELIST_DOMAINS
              value: .doany.io
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            # Entra のアプリロール admin を持つ人だけ通す(docs/entra.md)
            - name: OAUTH2_PROXY_OIDC_GROUPS_CLAIM
              value: roles
            - name: OAUTH2_PROXY_ALLOWED_GROUPS
              value: admin
            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: "true"
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_UPSTREAMS
              value: static://202
            # セッションは Cookie に置く(redis 不要)。minimal でトークンを落として Cookie に収める。
            # pass-authorization-header / set-authorization-header / pass-access-token / cookie-refresh とは併用できない。
            - name: OAUTH2_PROXY_SESSION_STORE_TYPE
              value: cookie
            - name: OAUTH2_PROXY_SESSION_COOKIE_MINIMAL
              value: "true"
