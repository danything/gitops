# NetBird combined サーバ(netbirdio/netbird-server)の設定。
# v0.65.0 以降の「combined」構成で、management / signal / relay / STUN と内蔵 IdP(Dex)が
# 1 コンテナに入っている(公式 Helm chart は旧来の 4 コンテナ構成のままなので使わない)。
#
# 素の値は https://github.com/netbirdio/netbird/blob/main/combined/config.yaml.example と、
# 公式インストーラ getting-started.sh の render_combined_yaml() に合わせてある。
#
# 秘密の 3 つは `@...@` のプレースホルダで、initContainer が Secret から差し込む
# (config.yaml 自体は環境変数を展開しない)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbird-server-config
  namespace: netbird
data:
  config.yaml.tpl: |
    server:
      # TLS は Cilium Gateway が終端するので、ここは平文 80 で待つ。
      listenAddress: ":80"
      # ピアが実際に繋ぎに来るアドレス。relay の rels:// URL もここから作られる。
      exposedAddress: "https://nb.doany.io:443"
      # STUN は外のもの(Cloudflare)を使い、内蔵の STUN は止める(`stuns` を書くと止まる)。
      # 内蔵だと WAN 側のアドレスに問い合わせることになり、クラスタの中のピア(routing peer)からは
      # ルーターで折り返さず届かない。届かないと IPv4 の P2P の候補を出せず relay に落ちる(2026-10-18)
      stuns:
        - uri: "stun:stun.cloudflare.com:3478"
      metricsPort: 9090
      healthcheckAddress: ":9000"
      logLevel: "info"
      logFile: "console"

      authSecret: "@AUTH_SECRET@"
      dataDir: "/var/lib/netbird"

      auth:
        # 内蔵 IdP(Dex)。Entra はダッシュボードの UI で外部 IdP として足してある。
        issuer: "https://nb.doany.io/oauth2"
        # ローカルのメール+パスワードを閉じる。入口は Entra だけ。
        # 内蔵 IdP(Dex)自体は動いたままで、外部 IdP のコネクタを提供する役に徹する。
        #
        # 締め出したときの戻し方: ここを false にして ArgoCD に流し、
        # `kubectl -n netbird rollout restart deploy/netbird-server`。
        # ピアの通信は認証と無関係に動き続けるので、影響はダッシュボードと API だけ。
        # PAT は JWT のグループ判定も含めて素通りするので、API からの復旧手段も残る。
        localAuthDisabled: true
        signKeyRefreshEnabled: true
        sessionCookieEncryptionKey: "@SESSION_COOKIE_ENCRYPTION_KEY@"
        dashboardRedirectURIs:
          - "https://nb.doany.io/nb-auth"
          - "https://nb.doany.io/nb-silent-auth"
        cliRedirectURIs:
          - "http://localhost:53000/"

      reverseProxy:
        # Envoy(Cilium Gateway)の Pod から来る。X-Forwarded-For を信じる範囲。
        # Pod CIDR(talos/patches/cluster.yaml の podSubnets)。bootstrap/auth の oauth2-proxy と同じ値。
        trustedHTTPProxies:
          - "10.42.0.0/16"
        # NetBird 自身のピア網(既定 100.64.0.0/10)
        trustedPeers:
          - "100.64.0.0/10"

      store:
        # 1 ノード・数ピアなので sqlite で足りる。ファイルは dataDir の下(PVC)。
        engine: "sqlite"
        encryptionKey: "@ENCRYPTION_KEY@"
