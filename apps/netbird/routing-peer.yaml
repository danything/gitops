# NetBird の routing peer(サブネットルータ)。自宅 LAN 10.0.0.0/24 への入口で、
# iLO(10.0.0.3)や AdGuard(10.0.0.2:53)にここ経由で届く。
# Headscale ではなく NetBird にした理由はこれ(docs/decisions.md)。上流の kubernetes-operator の NetworkRouter は
# Service を公開するためのもので、物理 LAN のサブネットルータではないので、素の Deployment で組む。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbird-routing-peer-data
  namespace: netbird
  annotations:
    # ピアの identity(秘密鍵)と設定だけ。消えると再登録が要るので取る。
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
---
# 鍵は Infisical の /netbird/netbird-routing-peer に `setup-key` で置く。
# ダッシュボードの Generate Setup Key で出るもの。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: netbird-routing-peer
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /netbird/netbird-routing-peer
        recursive: false
  managedKubeSecretReferences:
    - secretName: netbird-routing-peer
      secretNamespace: netbird
      creationPolicy: Orphan
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-routing-peer
  namespace: netbird
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  # hostPort で WireGuard のポートを掴むので、新旧 Pod が並ぶと衝突する
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netbird-routing-peer
  template:
    metadata:
      labels:
        app: netbird-routing-peer
    spec:
      # hostNetwork にしない。Pod のネットワークからでも LAN には届く(Cilium が masquerade する)。
      # ホストからは公開 DNS の A(WAN 側)に届かない(talos/patches/cluster.yaml の StaticHostConfig)ので、
      # hostNetwork だと nb.doany.io:443 に繋げず `Management: Disconnected` で止まる。
      containers:
        - name: netbird
          image: netbirdio/netbird:0.81.2
          env:
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-routing-peer
                  key: setup-key
            - name: NB_MANAGEMENT_URL
              value: https://nb.doany.io
            - name: NB_LOG_LEVEL
              value: info
            # WireGuard の口。下の hostPort と揃える。
            # ルーターは DMZ で全部をノードに向けているので、番号を変えてもルーターは触らない(docs/router.md)。
            # **効くのは最初の起動だけ。** NetBird は PVC の /var/lib/netbird/default.json に `"WgPort"` を保存し、以降はそちらを使う。
            # 番号を変えるときは default.json も直してから作り直す(env だけ直すと hostPort とずれる)。
            - name: NB_WIREGUARD_PORT
              value: "51820"
          ports:
            # WireGuard の口は hostPort で出す。
            # 無くても relay 経由で通信は成立するが、直接 P2P にならない。
            - name: wireguard
              containerPort: 51820
              hostPort: 51820
              protocol: UDP
          securityContext:
            capabilities:
              add:
                # WireGuard インタフェースとルート・NAT の操作
                - NET_ADMIN
                # 上流が docker で付けるよう案内しているもの(eBPF と raw socket を使う)
                - SYS_ADMIN
                - SYS_RESOURCE
          volumeMounts:
            - name: data
              mountPath: /var/lib/netbird
            # カーネルの wireguard が使えないときのユーザ空間フォールバック用。
            # Talos でもカーネル組み込みは確認済み(talos/README.md)なので通常は使わない
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netbird-routing-peer-data
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
