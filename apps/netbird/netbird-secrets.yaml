# Secret netbird-secrets は Infisical (il.doany.io) のフォルダ /netbird/netbird-secrets にあり、
# Infisical 純正 operator (apps/infisical-operator) が Secret にする。
#
# 中身は 3 つとも `openssl rand -base64 32` で作った乱数で、人が読む値ではない:
#   auth-secret                    ローカル relay の共有秘密 (server.authSecret)
#   datastore-encryption-key       ストアの暗号鍵 (server.store.encryptionKey)。失うとユーザーの
#                                  メール・氏名が復号できなくなる
#   session-cookie-encryption-key  内蔵 IdP(Dex)のセッション cookie 用 (server.auth.sessionCookieEncryptionKey)
#
# config.yaml は環境変数を展開しない(combined/cmd/config.go は yaml.Unmarshal するだけ)ので、
# initContainer がテンプレートに差し込む。deployment.yaml を参照。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: netbird-secrets
  namespace: netbird
  # 2 つとも必須。前者は operator が作る Secret を prune させないため、後者は
  # CRD がまだ無いクラスタで apps/ の同期が丸ごと落ちるのを防ぐため。
  # bootstrap/README.md「InfisicalSecret には sync-options を 2 つ付けること」。
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /netbird/netbird-secrets
        recursive: false
  managedKubeSecretReferences:
    - secretName: netbird-secrets
      secretNamespace: netbird
      creationPolicy: Orphan
