# Cilium Gateway(bootstrap/gateway/)に付ける HTTPRoute。証明書は Gateway 側の
# リスナーに cert-manager が発行したものが付いているので、ここでは指定しない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tamasagashi
  namespace: tamasagashi
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https
  hostnames: ["ts.doany.io"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Traefik 期にあった sticky cookie(ローリング更新中の CSS/JS 404 対策)の代替はここに書けない。
      # sessionPersistence は Gateway API の experimental フィールドで、入っている CRD は standard チャネル、
      # かつ Cilium 1.20.1 が未実装(1.21 から)。詳細は docs/decisions.md の
      # 「Traefik の sticky cookie に代替が無い」。
      backendRefs:
        - name: tamasagashi
          port: 3000
