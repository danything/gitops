# Traefik の IngressRouteTCP(HostSNI + TLS 終端 → 3128 へ素の TCP)の置き換え。
# Gateway 側の tls-px リスナーで TLS を終端し、ここで backend に流す。
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: 3proxy
  namespace: 3proxy
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: tls-px
  rules:
    - backendRefs:
        - name: 3proxy
          port: 3128
