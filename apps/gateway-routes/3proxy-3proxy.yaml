# Gateway は SNI(px.doany.io)で振り分けるだけ。TLS の終端は 3proxy Pod のサイドカーが行う。
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: 3proxy
  namespace: 3proxy
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: tls-px
  hostnames: ["px.doany.io"]
  rules:
    - backendRefs:
        - name: 3proxy
          port: 3129
