# Cilium Gateway(bootstrap/gateway/)に付ける HTTPRoute。証明書は Gateway 側の
# リスナーに cert-manager が発行したものが付いているので、ここでは指定しない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  # **一時的**: このルートは bootstrap/ に移す途中(danything/gitops の後続 PR)。
  # `apps/` から消えた瞬間に ArgoCD が prune して公開経路が落ちるのを防ぐため、
  # 先にこれを効かせて「git から消えても消さない」状態を作る。
  # bootstrap/ 側に移し、live の tracking-id 注釈を剥がしたら、この注釈も外す。
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https
  hostnames: ["ac.doany.io"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
