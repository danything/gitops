# Cilium Gateway(bootstrap/gateway/)に付ける HTTPRoute。証明書は Gateway 側の
# リスナーに cert-manager が発行したものが付いているので、ここでは指定しない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-https
  namespace: kube-system
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
