# Cilium Gateway(bootstrap/gateway/)に付ける HTTPRoute。証明書は Gateway 側の
# リスナーに cert-manager が発行したものが付いているので、ここでは指定しない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguardhome
  namespace: adguardhome
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https
  hostnames: ["d.doany.io"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # **80 ではなく 443。** DoH(/dns-query)は AdGuard の HTTPS でしか出ない。
        # backend 側の TLS 検証は backendtlspolicy.yaml。
        - name: adguardhome-web
          port: 443
