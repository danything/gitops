# Cilium Gateway(bootstrap/gateway/)に付ける HTTPRoute。証明書は Gateway 側の
# リスナーに cert-manager が発行したものが付いているので、ここでは指定しない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguardhome
  namespace: adguardhome
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https
  hostnames: ["d.doany.io"]
  rules:
    # DoH(/dns-query)は AdGuard の HTTPS でしか出ないので、サイドカーへ回す。
    # Gateway API は長いパスを優先するので、下の / より先に当たる。
    - matches:
        - path:
            type: PathPrefix
            value: /dns-query
      backendRefs:
        - group: ""
          kind: Service
          name: adguardhome-web
          port: 8081
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # backend は平文の 80 を使う(理由は service-web.yaml)。
        - name: adguardhome-web
          port: 80
