# Cilium Gateway(bootstrap/gateway/)に付ける HTTPRoute。証明書は Gateway 側の
# リスナーに cert-manager が発行したものが付いているので、ここでは指定しない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wg-easy
  namespace: wireguard
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https
  hostnames: ["wg.doany.io"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # **SSO の後ろ。** wg-easy 自身の認証は切れない(要望 wg-easy#1923 が open のまま)ので
        # 二重ログインになるが、**ログインフォームをインターネットに晒さない**ことに意味がある。
        # 名前空間をまたぐので auth 側に ReferenceGrant がある。
        - name: auth-wg
          namespace: auth
          port: 4180
