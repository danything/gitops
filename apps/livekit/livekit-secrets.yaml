# Secret livekit は Infisical (il.doany.io) のフォルダ /livekit/livekit にあり、
# Infisical 純正 operator (bootstrap/infisical-operator) が Secret にする。
#
#   livekit-secret   LiveKit の API キー `matrix` の秘密(64 文字のランダム)。LiveKit と lk-jwt-service で共有
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: livekit
  namespace: livekit
  # 2 つとも必須。bootstrap/README.md「InfisicalSecret には sync-options を 2 つ付けること」。
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /livekit/livekit
        recursive: false
  managedKubeSecretReferences:
    - secretName: livekit
      secretNamespace: livekit
      # Orphan: CR を消しても Secret は残す（移行や再作成で稼働中の Pod を巻き込まない）
      creationPolicy: Orphan
