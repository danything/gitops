# Zulip の脇役 3 つ(RabbitMQ / memcached / Redis)。公式 chart は Bitnami のイメージ
# (bitnamilegacy、もう更新されない)を同梱するので使わず、公式イメージをここで素に立てる。
# 書き方は docker-zulip の compose.yaml に揃えた。
#
# どれも PVC を持たない。RabbitMQ はキュー(再起動で未処理のジョブが消えるだけ。送ったメッセージは DB にある)、
# memcached と Redis はキャッシュとレート制限のカウンタ。
---
# RabbitMQ。4.2 系は docker-zulip の compose が使っている版
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: zulip
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: zulip
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2.9-alpine
          ports:
            - containerPort: 5672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: zulip
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: zulip
                  key: rabbitmq-password
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_port_connectivity]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          emptyDir: {}
---
# memcached。Zulip は SASL で認証する。ユーザー名は application.yaml の SETTING_MEMCACHED_USERNAME と揃える
apiVersion: v1
kind: Service
metadata:
  name: memcached
  namespace: zulip
spec:
  selector:
    app: memcached
  ports:
    - name: memcached
      port: 11211
      targetPort: 11211
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached
  namespace: zulip
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memcached
  template:
    metadata:
      labels:
        app: memcached
    spec:
      containers:
        - name: memcached
          image: memcached:1.6.45-alpine
          ports:
            - containerPort: 11211
          env:
            - name: MEMCACHED_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zulip
                  key: memcached-password
            - name: SASL_CONF_PATH
              value: /tmp/memcached.conf
            - name: MEMCACHED_SASL_PWDB
              value: /tmp/memcached-sasl-db
          # docker-zulip の compose.yaml と同じ(SASL の設定を起動時に書く)
          command:
            - sh
            - -euc
            - |
              echo 'mech_list: plain' > "$SASL_CONF_PATH"
              echo "zulip@localhost:$MEMCACHED_PASSWORD" > "$MEMCACHED_SASL_PWDB"
              exec memcached -S -m 256
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 320Mi
---
# Redis。書き方は rybbit/redis.yaml と同じ
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: zulip
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: zulip
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10.2-alpine
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zulip
                  key: redis-password
          command:
            - /bin/sh
            - -c
            - exec redis-server --requirepass "$REDIS_PASSWORD"
          readinessProbe:
            exec:
              command: [/bin/sh, -c, 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
