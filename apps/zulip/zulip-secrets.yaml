# Secret zulip は Infisical (il.doany.io) のフォルダ /zulip/zulip にあり、
# Infisical 純正 operator (bootstrap/infisical-operator) が Secret にする。
# 値は Infisical の UI で書き換えるだけ（push-bridge が数秒で同期。auto-reload 注釈のある
# Deployment は自動で入れ替わる）。
#
# 入れておくキー(README.md「使い始め」):
#   postgres-password / rabbitmq-password / memcached-password / redis-password
#                        サービス間の合言葉。中身は何でもよい(長いランダム文字列)
#   secret-key           Django の SECRET_KEY。**変えるとセッションが全部切れる**
#   smtp-password        info@doany.io の SMTP AUTH。/mattermost/mattermost と同じ値
#   oidc-client-secret   Entra のアプリ登録のクライアントシークレット。/mattermost/mattermost と同じ値
#                        (auth / argocd / erpnext / mattermost と同じアプリ登録)
#   zulip-org-id / zulip-org-key
#                        プッシュ通知の中継サービスへの登録(`manage.py register_server`)で決まる。
#                        登録の前は無くてよい(application.yaml で optional にしてある)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: zulip
  namespace: zulip
  # 2 つとも必須。前者は operator が作る Secret を prune させないため、後者は
  # CRD がまだ無いクラスタで apps/ の同期が丸ごと落ちるのを防ぐため。
  # bootstrap/README.md「InfisicalSecret には sync-options を 2 つ付けること」。
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /zulip/zulip
        recursive: false
  managedKubeSecretReferences:
    - secretName: zulip
      secretNamespace: zulip
      # Orphan: CR を消しても Secret は残す（移行や再作成で稼働中の Pod を巻き込まない）
      creationPolicy: Orphan
