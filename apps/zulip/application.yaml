# Zulip(z.doany.io)。Mattermost からの移行先(2026-10-05 に決めた)。
#
# 公式の Helm chart(docker-zulip の helm/zulip)で本体だけを入れる。chart が同梱する
# PostgreSQL / RabbitMQ / memcached / Redis(Bitnami のイメージ。bitnamilegacy はもう更新されない)は
# 全部無効にして、このディレクトリの postgres.yaml と services.yaml に向ける。
#
# 設定は環境変数で渡す(docker-zulip の規約)。
#   SETTING_*  → /etc/zulip/settings.py
#   CONFIG_*   → /etc/zulip/zulip.conf(節と名前は __ で区切る)
#   SECRETS_*  → /etc/zulip/zulip-secrets.conf
# 起動のたびに描き直されるので、**コンテナの中でファイルを直しても次の起動で消える。** ここを直す。
#
# finalizer は付けない(erpnext と同じ)。付けると Application を消したときに中身ごと消える。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zulip
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: zulip
  source:
    repoURL: ghcr.io/zulip/helm-charts
    chart: zulip
    targetRevision: 2.3.0
    helm:
      releaseName: zulip
      valuesObject:
        image:
          tag: "12.3-0"

        # Infisical の値を変えたら入れ替わるように(auto-reload は StatefulSet 自身の注釈に要る)
        statefulSetAnnotations:
          secrets.infisical.com/auto-reload: "true"

        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 3Gi

        zulip:
          persistence:
            enabled: true
            storageClass: local-path
            size: 20Gi
            # /data。添付ファイル・アバター・カスタム絵文字。DB は postgres の pg_dump で別に取る
            annotations:
              k8up.io/backup: "true"
          environment:
            SETTING_EXTERNAL_HOST: z.doany.io
            SETTING_ZULIP_ADMINISTRATOR: info@doany.io
            # Django の SECRET_KEY(chart が必須にしている)。**変えるとセッションが全部切れる**
            SECRETS_secret_key:
              valueFrom:
                secretKeyRef:
                  name: zulip
                  key: secret-key

            # 平文の 80 番で受ける。TLS は Gateway(bootstrap/gateway/)が終える。
            # X-Forwarded-For を信じる範囲は Envoy(Cilium Gateway)が居る Pod の範囲
            # (bootstrap/auth/ の --trusted-proxy-ip と同じ)
            CERTIFICATES: ""
            LOADBALANCER_IPS: "10.42.0.0/16,fd42::/64"

            # **日本語の全文検索は PGroonga**(postgres.yaml。拡張は Postgres の初期化で作る)。初回の migrate から有効にしておく ──
            # 後から立てると `manage.py migrate pgroonga` を手で流すことになる。
            # 英語の辞書は PGroonga のイメージに無いので、辞書無しで DB を作らせる(初回だけ効く)
            SETTING_USING_PGROONGA: "True"
            CONFIG_postgresql__missing_dictionaries: "true"

            # キューの処理をスレッドで回す(メモリを食う複数プロセス式にしない)。
            # 決めないと、ホストのメモリ(コンテナの制限ではなく)を見て重い方を選ぶ
            CONFIG_application_server__queue_workers_multiprocess: "False"

            # バックアップは k8up(postgres の pg_dump と /data の PVC)。Zulip 自身の日次ダンプは要らない
            AUTO_BACKUP_ENABLED: "False"

            # **ログインは Entra ID だけ**(Mattermost と同じ。パスワードのログインは無い)。
            # auth / argocd / erpnext / mattermost と同じアプリ登録で、リダイレクト URI に
            # https://z.doany.io/complete/oidc/ を足す(docs/entra.md)。
            # 汎用の OIDC で繋ぐ。Zulip の AzureAD 用のバックエンドはテナント共通の口
            # (login.microsoftonline.com/common)を叩くので、単一テナントのアプリ登録では通らない
            ZULIP_AUTH_BACKENDS: GenericOpenIdConnectBackend
            SECRETS_social_auth_oidc_secret:
              valueFrom:
                secretKeyRef:
                  name: zulip
                  key: oidc-client-secret
            ZULIP_CUSTOM_SETTINGS: |
              SOCIAL_AUTH_OIDC_ENABLED_IDPS = {
                  "entra": {
                      "oidc_url": "https://login.microsoftonline.com/22ac977d-b140-4dc8-8150-90d645d3475b/v2.0",
                      "display_name": "Microsoft",
                      "display_icon": None,
                      "client_id": "b0fa498f-7e6a-4fe1-a1c6-16fbbb6f397e",
                      "secret": get_secret("social_auth_oidc_secret"),
                      # 取り込んだ Mattermost のユーザー(同じメールアドレス)にだけ入れる。新しい人は招待してから
                      "auto_signup": False,
                  },
              }
              # Entra の名前を正とする(ユーザーが Zulip 側で名前を変えられない)
              SOCIAL_AUTH_OIDC_FULL_NAME_VALIDATED = True

            # 送信は Exchange Online の SMTP AUTH(info@doany.io。erpnext / mattermost と同じメールボックス)。
            # **差出人を info@doany.io に揃える** ── Exchange は認証したメールボックス以外の差出人を拒む。
            # Zulip の既定は noreply の差出人に毎回違うトークンを付けるので、それも止める
            SETTING_EMAIL_HOST: smtp.office365.com
            SETTING_EMAIL_HOST_USER: info@doany.io
            SETTING_EMAIL_PORT: "587"
            SETTING_EMAIL_USE_TLS: "True"
            SETTING_NOREPLY_EMAIL_ADDRESS: info@doany.io
            SETTING_ADD_TOKENS_TO_NOREPLY_ADDRESS: "False"
            SECRETS_email_password:
              valueFrom:
                secretKeyRef:
                  name: zulip
                  key: smtp-password

            # スマホのプッシュ通知は Zulip の中継サービス(Mobile Push Notification Service)経由。
            # サーバーの登録(README.md「使い始め」の `register_server`)で決まる 2 つの値は
            # Infisical に入れる。**登録するまでは無いので optional**(無くても起動はする)
            SETTING_ZULIP_SERVICE_PUSH_NOTIFICATIONS: "True"
            SECRETS_zulip_org_id:
              valueFrom:
                secretKeyRef:
                  name: zulip
                  key: zulip-org-id
                  optional: true
            SECRETS_zulip_org_key:
              valueFrom:
                secretKeyRef:
                  name: zulip
                  key: zulip-org-key
                  optional: true

        # 同梱の 4 つは使わない(上の説明)
        postgresql:
          enabled: false
        rabbitmq:
          enabled: false
        memcached:
          enabled: false
        redis:
          enabled: false
        externalPostgresql:
          host: postgres
          port: 5432
          database: zulip
          user: zulip
          password:
            valueFrom:
              secretKeyRef:
                name: zulip
                key: postgres-password
        externalRabbitmq:
          host: rabbitmq
          port: 5672
          user: zulip
          password:
            valueFrom:
              secretKeyRef:
                name: zulip
                key: rabbitmq-password
        externalMemcached:
          host: memcached
          port: 11211
          # services.yaml の SASL のユーザー名と揃える
          user: zulip@localhost
          password:
            valueFrom:
              secretKeyRef:
                name: zulip
                key: memcached-password
        externalRedis:
          host: redis
          port: 6379
          password:
            valueFrom:
              secretKeyRef:
                name: zulip
                key: redis-password
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
