# 公開経路。証明書は Gateway(bootstrap/gateway/)のワイルドカードなので指定しない。
# Zulip は平文の 80 番で受ける(application.yaml の CERTIFICATES)。サービス名は chart が付ける
# (リリース名が zulip なので zulip)。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zulip
  namespace: zulip
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https
  hostnames: ["z.doany.io"]
  rules:
    - backendRefs:
        - name: zulip
          port: 80
