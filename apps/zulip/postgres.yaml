# Zulip の DB。**PGroonga 入りの Postgres**(日本語の全文検索のため。2026-10-05 に決めた)。
# 形は rybbit/postgres.yaml と同じ(17 系、pg_dump を k8up に取らせる)。
#
# zulip/zulip-postgresql(公式)は英語の辞書ファイル入りの素の Postgres で、PGroonga が無い。
# PGroonga の公式イメージには逆に Zulip の英語の辞書が無いので、application.yaml で
# `postgresql.missing_dictionaries` を立てて辞書無しで DB を作らせている(PGroonga で探すなら使わない)。
#
# **PGroonga の拡張は Zulip のマイグレーションは作らない**(2026-10-06 に踏んだ)。Zulip の通常の
# インストーラは DB の外から `CREATE EXTENSION` しておく前提で、無いまま migrate すると
# `access method "pgroonga" does not exist` で落ちる。下の ConfigMap を initdb の置き場に入れて、
# DB を作るときに一緒に作る(initdb は空の PGDATA のときだけ走る。最初の 1 回は手で作った)。
# pg_dump は拡張を含むので、戻すときは作り直さなくてよい。
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: zulip
data:
  pgroonga.sql: |
    CREATE EXTENSION IF NOT EXISTS pgroonga;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: zulip
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: zulip
  annotations:
    # DB はファイルとして取らない。下の k8up.io/backupcommand の pg_dump で足りる。
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: zulip
spec:
  replicas: 1
  # ReadWriteOnce なので古い Pod が消えてから新しい Pod が付ける。RollingUpdate だと詰まる。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        # 戻すときは先に `CREATE EXTENSION pgroonga` が通る状態で流す(ダンプが PGroonga の索引を含む)。
        # ロールの作り方は apps/k8up/README.md「SQL のダンプは先にロールを作る」
        k8up.io/backupcommand: /bin/sh -c 'pg_dump -U zulip -d zulip --clean --if-exists'
        k8up.io/file-extension: .sql
    spec:
      containers:
        - name: postgres
          image: groonga/pgroonga:4.0.9-alpine-17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: zulip
            - name: POSTGRES_USER
              value: zulip
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zulip
                  key: postgres-password
            # initdb は空でないディレクトリを嫌うので、マウント先の下の段に置く
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [pg_isready, -U, zulip, -d, zulip]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: initdb
          configMap:
            name: postgres-initdb
