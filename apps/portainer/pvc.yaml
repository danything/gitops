apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portainer-data
  namespace: portainer
  annotations:
    # **boltdb だがファイルとして取る。** イメージにシェルが無く
    # (`exec: "sh": executable file not found`)、SQLite でもないので
    # backupcommand が使えない。動いたままのコピーなので整合は保証されない。
    # 中身は OIDC の設定とエンドポイント 1 本だけで、画面から数分で作り直せる
    # (apps/k8up/README.md「ファイルの PVC をどう移すか」)。
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 2Gi
