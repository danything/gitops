apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wg-easy-data
  namespace: wireguard
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-easy
  namespace: wireguard
spec:
  replicas: 1
  # hostNetworkでUDP 51820を占有するため、ローリング更新だと新旧Podが
  # ポート衝突する。RWOのPVCを共有できない事情も同じ。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wg-easy
  template:
    metadata:
      labels:
        app: wg-easy
    spec:
      # クライアント向けの経路とNATをホスト側で成立させる必要があるため
      # hostNetworkで動かす。
      #
      # ホスト側の前提: Ubuntu の apparmor 5.x が同梱する
      # /etc/apparmor.d/wg-quick (profile wg-quick /usr/bin/wg-quick) は
      # privileged/unconfined な Pod 内でもパス一致で exec 時に付与され、
      # Alpine の readlink(-> /bin/busybox) の実行を拒否して wg-quick up が
      # 失敗する(wg0 が上がらず VPN 不通、Pod は Running のまま)。
      # ホストで無効化しておくこと:
      #   sudo mkdir -p /etc/apparmor.d/disable
      #   sudo ln -sf /etc/apparmor.d/wg-quick /etc/apparmor.d/disable/wg-quick
      #   sudo apparmor_parser -R /etc/apparmor.d/wg-quick
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: wg-easy
          # v15.4.0(2026-08-14)で OIDC(OAUTH_*)と cli 修正(#2683)が安定版に入った。
          # :15 のような浮動タグはノードに残った古いキャッシュ(15.3.0)が
          # IfNotPresent で使われ、新しいDBスキーマを読めず /api/client が
          # 500になった。パッチまで固定し、更新は Renovate に任せる。
          image: ghcr.io/wg-easy/wg-easy:15.4.0
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    sleep 8
                    # NATが効かない原因が2つ重なるため、両方を明示的に潰す。
                    #
                    # 1) wg-easyはDockerブリッジ前提で "-o eth0" のMASQUERADEを入れるが、
                    #    hostNetworkでは実際の上流が bond0 なので一致しない。
                    # 2) このイメージの既定 iptables は legacy バックエンドだが、
                    #    ホストの nat フックは nf_tables 側(k3s/flannel/CNI)が握っている。
                    #    legacy の nat テーブルは評価されないため MASQUERADE が無効になる。
                    #    一方 legacy の filter は生きており転送だけは成立するので、
                    #    「トンネルは繋がるがIPv4だけ外に出られない」という紛らわしい形になる。
                    #
                    # よって nft バックエンドのバイナリを明示し、既定経路のIFを実際に引く。
                    IPT=$(command -v iptables-nft || echo iptables)
                    IPT6=$(command -v ip6tables-nft || echo ip6tables)

                    # 出口インターフェースは決め打ちしない。デフォルト経路(bond0)だけを
                    # 対象にすると、別NICに繋がる社内LAN(eno4 = 10.10.0.0/24)宛が
                    # NATされず戻ってこない。wg0以外への出口をすべて対象にする。

                    # 3) k3s(kube-router netpol + flannel)は nft の FORWARD チェーンを
                    #    末尾の無条件DROPで閉じている。10.8.0.0/24 はどのACCEPTにも
                    #    該当しないためそこで落ちる。wg-easyが入れる "-i wg0 -j ACCEPT" は
                    #    legacy側なのでこのチェーンには効かない。先頭に明示的に挿入する。
                    #    (既存のikev2も同様に 192.168.43.0/24 を明示ACCEPTして成立している)
                    "$IPT" -C FORWARD -i wg0 -j ACCEPT 2>/dev/null || \
                      "$IPT" -I FORWARD 1 -i wg0 -j ACCEPT
                    "$IPT" -C FORWARD -o wg0 -j ACCEPT 2>/dev/null || \
                      "$IPT" -I FORWARD 1 -o wg0 -j ACCEPT
                    "$IPT6" -C FORWARD -i wg0 -j ACCEPT 2>/dev/null || \
                      "$IPT6" -I FORWARD 1 -i wg0 -j ACCEPT
                    "$IPT6" -C FORWARD -o wg0 -j ACCEPT 2>/dev/null || \
                      "$IPT6" -I FORWARD 1 -o wg0 -j ACCEPT

                    "$IPT" -t nat -C POSTROUTING -s 10.8.0.0/24 ! -o wg0 -j MASQUERADE 2>/dev/null || \
                      "$IPT" -t nat -A POSTROUTING -s 10.8.0.0/24 ! -o wg0 -j MASQUERADE
                    "$IPT6" -t nat -C POSTROUTING -s fdcc:ad94:bacf:61a3::/64 ! -o wg0 -j MASQUERADE 2>/dev/null || \
                      "$IPT6" -t nat -A POSTROUTING -s fdcc:ad94:bacf:61a3::/64 ! -o wg0 -j MASQUERADE

                    # トンネルMTU 1420に合わせてMSSを固定する(v4=1420-40, v6=1420-60)。
                    # PMTU探索が黒穴になる経路でも大きいTCPが刺さらないようにする。
                    "$IPT" -t mangle -C FORWARD -o wg0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1380 2>/dev/null || \
                      "$IPT" -t mangle -A FORWARD -o wg0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1380
                    "$IPT6" -t mangle -C FORWARD -o wg0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1360 2>/dev/null || \
                      "$IPT6" -t mangle -A FORWARD -o wg0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1360
          env:
            # hostNetworkでは既定の0.0.0.0だとWeb UIがグローバルIPに直接露出する。
            # ノードのLAN IPに限定し、公開はTraefik経由に統一する。
            #
            # ただしLAN IPに絞っても、ルータがWANのtcp/51821を10.0.0.2へ
            # 転送しているぶんは外から直接叩けてしまう (実測で到達を確認)。
            # バインド先はTraefikがServiceのエンドポイントとして叩く必要が
            # あるので変えられないため、ホスト側で私設アドレス以外からの
            # tcp/51821 をdropしている:
            #   /etc/nftables.d/wg-easy-guard.nft + wg-easy-guard.service
            # 独立したnftテーブルなのでk3s/kube-routerのrulesetには触れない。
            # ルータ側の転送ルールを消せば、このガードは不要になる。
            - name: HOST
              value: "10.0.0.2"
            - name: PORT
              value: "51821"
            # INSECURE はリッスンをHTTPS化する設定ではなく、
            #   - OIDCのredirect_uriのスキーム (X-Forwarded-Proto は見ていない)
            #   - セッションcookieのSecure属性
            # の2つを決めるだけ。Traefikで終端していてもブラウザとの間はHTTPSなので
            # false が正しい。true にすると redirect_uri が http:// になり、
            # Entra が AADSTS50011 (redirect URI mismatch) で拒否する。
            - name: INSECURE
              value: "false"
            # 初回起動時の無人セットアップ。公式の INIT_* 方式で管理者を作成する。
            # (v15.3.0 では cli が壊れていて(upstream #2682)これしか手が無かった。
            # v15.4.0 で修正済みだが、宣言的に書けるこちらを維持する)
            # セットアップ完了後は無視される。
            # パスワードのみSecret参照(このリポジトリはpublicのため)。
            - name: INIT_ENABLED
              value: "true"
            - name: INIT_USERNAME
              value: "wgeasyadmin"
            - name: INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wg-easy-init
                  key: INIT_PASSWORD
            - name: INIT_HOST
              value: "v.doany.io"
            - name: INIT_PORT
              value: "51820"
            - name: INIT_DNS
              value: "10.42.0.1"
            - name: INIT_IPV4_CIDR
              value: "10.8.0.0/24"
            - name: INIT_IPV6_CIDR
              value: "fdcc:ad94:bacf:61a3::/64"
            # フルトンネル
            - name: INIT_ALLOWED_IPS
              value: "0.0.0.0/0,::/0"
            # Entra ID(Microsoft Entra)によるOIDCログイン。
            # 誰がクライアント鍵を発行したかを残すため、共有アカウントではなく
            # ユーザーごとのアカウントでログインさせる。
            # wg-easy自体にはグループ判定機能が無いので、adminsグループ限定は
            # Entra側の「割り当てが必要=はい」+ グループ割り当てで担保している。
            # Entra は userinfo に email_verified を返さないため wg-easy の
            # OIDC は必ず401になる。v15.4.0 でも assertHasOauthProps は
            # email_verified 必須のまま(upstream #2741 でオプション化を要望中)。
            # 上流が修正されるまで無効にしておく。
            # 有効化するときは値を "oidc" に戻すだけでよい。
            - name: OAUTH_PROVIDERS
              value: ""
            - name: OAUTH_OIDC_NAME
              value: "Entra ID"
            - name: OAUTH_OIDC_SERVER
              value: "https://login.microsoftonline.com/22ac977d-b140-4dc8-8150-90d645d3475b/v2.0"
            - name: OAUTH_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: wg-easy-oidc
                  key: OAUTH_OIDC_CLIENT_ID
            - name: OAUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wg-easy-oidc
                  key: OAUTH_OIDC_CLIENT_SECRET
            # Entra側で既にadminsグループに絞られているため自動登録して良い
            - name: OAUTH_AUTO_REGISTER
              value: "true"
          ports:
            - name: wireguard
              containerPort: 51820
              protocol: UDP
            - name: http
              containerPort: 51821
              protocol: TCP
          securityContext:
            # wireguardモジュールのロードとiptables操作に必要
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /etc/wireguard
            - name: modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: wg-easy-data
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: wg-easy
  namespace: wireguard
spec:
  selector:
    app: wg-easy
  ports:
    - name: http
      port: 51821
      targetPort: 51821
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wg-easy
  namespace: wireguard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: mydnschallenge
    # forward-auth(oauth2-proxy)は利用者の判断で外している。
    # 認証は wg-easy 自身のパスワードログインのみ。
    #
    # 参考: wg-easy のネイティブOIDCは Entra とは組み合わせられない。
    # userinfo 応答に email_verified が含まれることを必須としているが
    # (src/server/utils/oauth.ts の assertHasOauthProps)、Entraの userinfo は
    # sub/name/family_name/given_name/picture/email しか返さず、しかも公式に
    # 「追加・カスタマイズ不可」と明記されているため必ず401になる。
spec:
  ingressClassName: traefik
  rules:
    - host: wg.doany.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wg-easy
                port:
                  number: 51821
  tls:
    - hosts:
        - wg.doany.io
