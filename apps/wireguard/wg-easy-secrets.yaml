# wg-easy の秘密は Infisical (il.doany.io) にあり、Infisical 純正 operator が Secret にする。
# 値を変えるときは Infisical の UI で書き換えるだけ (push-bridge が数秒で同期)。
#
# ここまで唯一「クラスタにしか無い」手で apply した Secret だったので、復元リハーサル
# (bootstrap/docs/restore-drill.md の 5) で復元後に失われ、wg-easy が起動できなくなった。
#
# Infisical 側に要るフォルダとキー:
#   /wireguard/wg-easy-init … INIT_PASSWORD   (管理画面の初期パスワード)
#
# OIDC (wg-easy-oidc) は作らない。Entra が userinfo に email_verified を返さず wg-easy 側が
# 必須にしているため、そもそもログインできない (wg-easy.yaml のコメント参照)。
# 上流が直ったら、Infisical に /wireguard/wg-easy-oidc を作って同じ形の CR を足す。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: wg-easy-init
  namespace: wireguard
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: k3s-cluster
        envSlug: prod
        secretsPath: /wireguard/wg-easy-init
        recursive: false
  managedKubeSecretReferences:
    - secretName: wg-easy-init
      secretNamespace: wireguard
      # Orphan: CR を消しても Secret は残す（移行や再作成で稼働中の Pod を巻き込まない）
      creationPolicy: Orphan
