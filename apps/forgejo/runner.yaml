# Forgejo Actions の Runner。ジョブは同じ Pod の docker(dind)の中のコンテナで動く。
# 形は forgejo/runner の examples/kubernetes/dind-docker.yaml に寄せてある。
#
# 登録は共有の秘密(16 進 40 文字)1 つで済ませる。管理画面での操作は要らない:
#   - Forgejo 側: forgejo.yaml の init が `forgejo-cli actions register --secret` で登録する(何度走っても同じ Runner)
#   - Runner 側: 下の start.sh が同じ秘密から uuid / token を出す。uuid は秘密の先頭 16 文字のバイト列を
#     そのまま UUID にしたもの、token は秘密そのもの(Forgejo の models/actions/forgejo.go の RegisterRunner、
#     runner の create-runner-file.go の uuidFromSecret と同じ。create-runner-file は v13 で非推奨)
# 秘密は Infisical の /forgejo/forgejo-runner に runner-secret で入れる(forgejo-secrets.yaml)。
# 入るまで runner コンテナは「待っている」とログに出して止まっている(落ちない)。
#
# 設定ファイルは起動のたびに作る。Pod は状態を持たない(.runner ファイルも PVC も要らない)。
#
# ラベル: GitHub のワークフローの `runs-on: ubuntu-latest` をそのまま拾う。
# catthehacker/ubuntu:act-* は GitHub のランナーに近い道具入りのイメージ(docker CLI・git・node など)。
#
# ネットワークは**ジョブごとに別**(container.network: "")。Runner がジョブごとに dind の中に bridge の
# ネットワーク(WORKFLOW-…)を作り、ジョブ(と services)のコンテナをそこに置き、終わったら消す。
# 前は host(全ジョブが Pod のネットワークを分け合う)だった。それだと、どれかのジョブが dind でコンテナを
# 起こすたびに、全ジョブから見えるところに veth(IPv6 のリンクローカル付き)が出入りし、Chromium が
# ERR_NETWORK_CHANGED で読み込みを切って e2e が落ちた(doa/todoroku#366)。同じ番号のポート(4173 など)も取り合っていた。
#
# ジョブの中から docker を使う(イメージを作る・docker run)ときは、forgejo の docs の「docker-access」の DIND の形:
#   - ジョブには `--add-host=dind.docker.internal:host-gateway` を足す。host-gateway は dind の docker0 の
#     住所(172.17.0.1。dind 自身 = Pod のネットワーク名前空間の住所)で、dockerd は 0.0.0.0:2376 で待っている。
#     ジョブのネットワークからでも、宛先が dind 自身なので届く(別のネットワークのコンテナへの転送とは違い、遮られない)
#   - ジョブの DOCKER_HOST は tcp://dind.docker.internal:2376。TLS はそのまま(証明書は valid_volumes で渡す)。
#     dind のサーバー証明書の SAN にこの名前を足す(DOCKER_TLS_SAN)
# 渡しているのは今までと同じ「dind を丸ごと操れる鍵」なので、できることは host のときと変わらない
# (capacity が 2 以上なので、ジョブは docker の CLI で同時に走っているほかのジョブのコンテナも見える。前から同じ)。
# Runner 自身は今までどおり localhost:2376(Pod の中)で dind に話す。
# キャッシュ(ACTIONS_CACHE_URL)は Runner が自分の Pod の IP で出す。ジョブのネットワークから見ても dind の
# 自分の IP なので届く。
#
# **ジョブのネットワークにも IPv6 を付ける(enable_ipv6)。** 無いと fj.doany.io に届かない。
# fj.doany.io は AAAA(ノード)と A(家の外向きの IPv4)を返し、Pod からは IPv4 の方はヘアピンで届かない
# (curl -4 は時間切れ)。host の頃は Pod の IPv6 で届いていた。checkout・API・upload-artifact・OIDC は
# ジョブの中から fj.doany.io に行くので、IPv4 だけのネットワークでは全部止まる。
# enable_ipv6 にすると dind がネットワークごとに ULA の /64 を割り当て、外へは NAT66(Pod の IPv6)で出るので、
# 外向きは host の頃と同じ形になる(2026-10-07 に本番の dind で確かめた)。
# docker login / push は dind(Pod のネットワーク)が自分で名前を引くので、これまでどおり。
# Cilium は vxlan なので Pod の MTU は 1500 より小さい。dind の既定 1500 のままだと大きいパケットが落ちる。
# --mtu は既定の bridge(docker0)にしか効かないので、ジョブのネットワークの分は --default-network-opt で揃える。
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner
  namespace: forgejo
data:
  start.sh: |
    #!/bin/sh
    set -eu
    while [ -z "${RUNNER_SECRET:-}" ]; do
      echo "Infisical の /forgejo/forgejo-runner に runner-secret が入るのを待っている"
      sleep 60
    done
    # 末尾の改行は Forgejo 側($(cat))と同じく落とす。形が違うと Forgejo 側の登録も失敗する。
    # 落ちて再起動を繰り返さないよう、ここで止まっておく。値は出さない
    RUNNER_SECRET=$(printf %s "$RUNNER_SECRET")
    if [ "${#RUNNER_SECRET}" -ne 40 ] || ! printf %s "$RUNNER_SECRET" | grep -Eq '^[0-9a-fA-F]{40}$'; then
      echo "runner-secret は 16 進 40 文字にする(openssl rand -hex 20)。直すまで止まっている"
      while :; do sleep 3600; done
    fi
    RUNNER_UUID=$(printf %s "$RUNNER_SECRET" | head -c 16 | od -An -tx1 | tr -d ' \n' |
      sed -E 's/^(.{8})(.{4})(.{4})(.{4})(.{12})$/\1-\2-\3-\4-\5/')
    while ! nc -z localhost 2376 </dev/null; do
      echo "docker を待っている"
      sleep 5
    done
    cat > /tmp/config.yml <<EOF
    log:
      level: info
    runner:
      # 同時に受けるジョブの数。ワークフローが 2 本(test と claude-review)ある PR を
      # 3 リポジトリぶん積むと 2 では順番待ちが長い。ノードは 44 コア / 46 GiB で
      # 使用率は CPU 8% / メモリ 16%、CPU は余っているので詰まるのは下の dind のメモリ。
      # 8 本のうち重いのは e2e(ブラウザ)くらいで、それが同時に何本も来ることは稀
      capacity: 8
      timeout: 3h
      labels:
        - ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-24.04
        - ubuntu-24.04:docker://ghcr.io/catthehacker/ubuntu:act-24.04
        - docker:docker://node:22-bookworm
      envs:
        DOCKER_HOST: tcp://dind.docker.internal:2376
        DOCKER_TLS_VERIFY: "1"
        DOCKER_CERT_PATH: /certs/client
    cache:
      enabled: true
      dir: /cache
    container:
      # 空 = ジョブごとにネットワークを作る(上の説明)
      network: ""
      # fj.doany.io へは IPv6 でしか届かない(上の説明)
      enable_ipv6: true
      options: --add-host=dind.docker.internal:host-gateway -v /certs/client:/certs/client
      valid_volumes:
        - /certs/client
    server:
      connections:
        forgejo:
          url: https://fj.doany.io/
          uuid: ${RUNNER_UUID}
          token: ${RUNNER_SECRET}
    EOF
    exec forgejo-runner --config /tmp/config.yml daemon
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      automountServiceAccountToken: false
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:13.2.0
          command: [/bin/sh, /scripts/start.sh]
          env:
            # ルートは読み取り専用。uses: のアクションの取り置き($HOME/.cache/act)を /tmp に置く
            - name: HOME
              value: /tmp
            - name: RUNNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner
                  key: runner-secret
                  optional: true
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            # 8 本ぶんのログを同時に流すので少し余裕を持たせる
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: docker-certs
              mountPath: /certs
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /cache
        - name: docker
          image: docker.io/library/docker:29.9.0-dind
          # --mtu は docker0 だけ。Runner がジョブごとに作るネットワークは --default-network-opt で揃える
          args:
            - --mtu=1400
            - --default-network-opt=bridge=com.docker.network.driver.mtu=1400
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
            # ジョブは dind.docker.internal(host-gateway)で来るので、サーバー証明書の SAN に入れる。
            # 証明書は起動のたびに作り直される(entrypoint)ので、Pod が替われば入る
            - name: DOCKER_TLS_SAN
              value: DNS:dind.docker.internal
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # **ジョブのコンテナは全部この中で動く**ので、ここが CI 全体の上限になる。
            # ノードは 46 GiB で、CI 以外の実使用は 8 GiB ほど。28Gi なら 10 GiB 残る。
            # ここを超えるとノードごと OOM に巻き込むので、capacity を上げるときは必ず一緒に見る
            limits:
              memory: 28Gi
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: docker-data
              mountPath: /var/lib/docker
      volumes:
        - name: scripts
          configMap:
            name: forgejo-runner
        - name: docker-certs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        # イメージの置き場。Pod が入れ替わると消える(次の pull でまた入る)
        - name: docker-data
          emptyDir:
            sizeLimit: 60Gi
