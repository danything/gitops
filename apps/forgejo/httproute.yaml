# 公開経路。証明書は Gateway(bootstrap/gateway/)のワイルドカードなので指定しない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https
  hostnames: ["fj.doany.io"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: forgejo-http
          port: 3000
      # 大きいリポジトリの clone / push やコンテナイメージの push は 15 秒では終わらない
      timeouts:
        request: 0s
