# Infisical (il.doany.io) の /forgejo/ 以下から Secret を 4 つ作る。値は Infisical の UI で入れる。
#
# | Secret | Infisical のフォルダ | キー |
# | --- | --- | --- |
# | forgejo-db | /forgejo/forgejo-db | postgres-password(英数字だけのランダム。記号は app.ini でコメント扱いになりうる。最初の起動後は変えない) |
# | forgejo-admin | /forgejo/forgejo-admin | username / password(最初の管理者) |
# | forgejo-oauth | /forgejo/forgejo-oauth | key(Entra のクライアント ID)/ secret(下記の参照) |
# | forgejo-runner | /forgejo/forgejo-runner | uuid / token(Forgejo を上げたあと管理画面で作る。runner.yaml) |
#
# forgejo-oauth の secret は値を写さず Infisical の参照で置く(headlamp と同じ):
#   ${prod.auth.auth-secrets.oidc-client-secret}
#
# forgejo-db・forgejo-admin・forgejo-oauth は**同期する前に**入れる。無いと Forgejo の init が上がらない。
# forgejo-runner は後からでよい(Runner はキーが入るまで待っている)。
#
# Secret 名が forgejo でないのは、chart が同じ名前の Secret(app.ini の元)を作るため。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: forgejo-db
  namespace: forgejo
  # 2 つとも必須。前者は operator が作る Secret を prune させないため、後者は
  # CRD がまだ無いクラスタで apps/ の同期が丸ごと落ちるのを防ぐため。
  # bootstrap/README.md「InfisicalSecret には sync-options を 2 つ付けること」。
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /forgejo/forgejo-db
        recursive: false
  managedKubeSecretReferences:
    - secretName: forgejo-db
      secretNamespace: forgejo
      creationPolicy: Orphan
---
