# TLS を終端して素の TCP を 3proxy に渡すだけの nginx。
# Cilium の Gateway は TLS 終端リスナーに TCPRoute を付けられないので(docs/decisions.md 参照)、
# 終端を Pod 側に寄せて Gateway は passthrough にしている。
apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-terminator
  namespace: 3proxy
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }
    stream {
      # 本番のポート。3proxy 自身の平文が 3128(プロキシの慣用ポート)なので、その TLS 版。
      server {
        listen 3129 ssl;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_pass 127.0.0.1:3128;
      }
      # 旧ポート。**移行のあいだだけ。** ルータの転送とクライアントの設定を 3129 に
      # 変えたら、この server ブロックと deployment.yaml の proxy-tls-old を消す。
      # コンテナのポートを分けているのは、Kubernetes が同じ containerPort の
      # ports エントリを 1 つにまとめてしまい、hostPort を 2 つ張れないため。
      server {
        listen 8444 ssl;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_pass 127.0.0.1:3128;
      }
    }
