# Traefik が websecure(443) で TLS を終端し、平文の TCP を 3proxy に渡す。
# クライアントからは https:// 形式のプロキシに見えるので、
# Basic 認証が平文で流れない。SNI で他の Ingress と同居できる。
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: 3proxy
  namespace: 3proxy
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`px.doany.io`)
      services:
        - name: 3proxy
          port: 3128
  tls:
    certResolver: mydnschallenge
    domains:
      - main: px.doany.io
