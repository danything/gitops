apiVersion: apps/v1
kind: Deployment
metadata:
  name: 3proxy
  namespace: 3proxy
spec:
  replicas: 1
  # hostPort を持つので新旧の Pod が同じポートを奪い合わないように Recreate にする。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: 3proxy
  template:
    metadata:
      labels:
        app: 3proxy
    spec:
      containers:
        # TLS を終端して 127.0.0.1:3128 に渡すだけのサイドカー。証明書は cert-manager が発行する。
        # 更新は Secret の中身が変わるだけなので、nginx を定期的に読み直させる。
        - name: tls-terminator
          image: nginx:1.29-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              nginx -c /etc/nginx/nginx.conf -g 'daemon off;' &
              pid=$!
              while :; do sleep 6h; nginx -c /etc/nginx/nginx.conf -s reload 2>/dev/null || true; done &
              wait $pid
          ports:
            - name: proxy-tls
              containerPort: 3129
              # Gateway は使わない。443 では TLS 終端(HTTPS リスナー)と passthrough が共存できず
              # ProtocolConflict になるため(docs/decisions.md)、このサイドカーがホストの 8443 で直接受ける。
              hostPort: 8443
          volumeMounts:
            - name: tls-terminator-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
        - name: 3proxy
          image: ghcr.io/3proxy/3proxy:1.0.0
          env:
            - name: TZ
              value: Asia/Tokyo
          ports:
            - name: proxy
              containerPort: 3128
          volumeMounts:
            - name: config
              mountPath: /etc/3proxy/3proxy.cfg
              subPath: 3proxy.cfg
              readOnly: true
            - name: secret
              mountPath: /etc/3proxy/secret
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tls-terminator-config
          configMap:
            name: tls-terminator
        - name: tls
          secret:
            secretName: 3proxy-tls
        - name: config
          configMap:
            name: 3proxy
        - name: secret
          secret:
            secretName: 3proxy
