# Secret external-dns は Infisical (il.doany.io) のフォルダ /external-dns/external-dns にあり、
# Infisical 純正 operator (bootstrap/infisical-operator) が Secret にする。
#
#   cloudflare-api-token  Cloudflare の Account API token「external-dns (doany.io DNS write)」。
#                         権限は doany.io のゾーンだけの Zone Read + DNS Write(2026-10-06 に作った)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: external-dns
  namespace: external-dns
  # 2 つとも必須。bootstrap/README.md「InfisicalSecret には sync-options を 2 つ付けること」。
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /external-dns/external-dns
        recursive: false
  managedKubeSecretReferences:
    - secretName: external-dns
      secretNamespace: external-dns
      # Orphan: CR を消しても Secret は残す（移行や再作成で稼働中の Pod を巻き込まない）
      creationPolicy: Orphan
