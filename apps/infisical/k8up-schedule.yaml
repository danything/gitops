# **クラスタで一番失えないデータ。** Infisical の Postgres には全アプリの秘密が入っている
# (DB そのものは bootstrap/infisical/secrets.yaml の ENCRYPTION_KEY で暗号化されているので、
# ダンプだけ手に入っても読めない。復元にはその鍵も要る)。
#
# **Infisical 本体は bootstrap にある**(Argo CD の同期対象外)が、この Schedule は
# apps に置いて Argo CD に見てもらう。バックアップはアプリ層の関心事で、
# Infisical より下の層である必要が無いため。
# backupcommand の注釈は bootstrap/infisical/helmchart.yaml の
# postgresql.primary.podAnnotations にある(あちらは SOPS で暗号化されているので
# 編集は `sops set`)。
#
# タグと時刻の考え方は apps/mattermost/k8up-schedule.yaml と同じ。
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  # **必須。** 理由は apps/k8up/README.md「CRD がまだ無いクラスタで apps を止めないこと」
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: infisical
  namespace: infisical
spec:
  backup:
    schedule: "0 16 * * *"
    tags:
      - k8up
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 1
  prune:
    schedule: "0 17 * * 0"
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
      tags:
        - k8up
