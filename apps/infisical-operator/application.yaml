# Infisical 純正 Kubernetes operator。InfisicalSecret CR を見て Infisical から値を取り、
# 普通の Secret を作る。`secrets.infisical.com/auto-reload: "true"` 注釈のある Deployment は
# Secret 更新時に自動でローリング再起動される。
# https://infisical.com/docs/integrations/platforms/kubernetes/overview
#
# **k3s の HelmChart CRD から移した(2026-09-07)。** HelmChart は k3s 固有で Talos には無い。
# ArgoCD 自身は operator に依存しないので、bootstrap ではなくここで面倒を見られる。
#
# **リリース名は変えられない。** chart は名前を 15 文字で切って
# `infisical-secre-controller-manager` を作るので、変えると別物として作り直しになる。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: infisical-operator
  source:
    repoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    chart: secrets-operator
    targetRevision: v0.11.8
    helm:
      releaseName: infisical-secrets-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD が 7 本入っていて、client-side apply だと last-applied 注釈が
      # メタデータの上限に当たる。
      - ServerSideApply=true
