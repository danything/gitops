# Secret glitchtip は Infisical (il.doany.io) のフォルダ /glitchtip/glitchtip にあり、
# Infisical 純正 operator (bootstrap/infisical-operator) が Secret にする(rybbit と同じ形)。
#
# | キー | 何に使うか | 値 |
# | --- | --- | --- |
# | secret-key | Django の SECRET_KEY(セッション・トークンの署名)。変えると全員ログアウト | 英数字のランダム(50 文字くらい) |
# | postgres-password | PostgreSQL の glitchtip ユーザー(最初の起動後は変えない。initdb のときだけ効く) | 英数字のランダム(32 文字くらい) |
# | oidc-client-secret | Entra の共用アプリ Main のクライアントシークレット | 値は写さず参照: `${prod.auth.auth-secrets.oidc-client-secret}`(forgejo・headlamp と同じ) |
# | email-password | info@doany.io の SMTP パスワード | 値は写さず参照。`/mattermost/mattermost` の `smtp-password` に入っている参照(`/shared/smtp` を指すもの)をそのまま写す |
#
# 4 つとも**同期する前に**入れる。無いと Pod が CreateContainerConfigError で待つ
# (入れれば operator が Secret を作って自然に上がる)。
# 値は Infisical の UI で書き換えるだけ(push-bridge が数秒で同期。auto-reload 注釈のある
# Deployment は自動で入れ替わり、oidc-client-secret は setup.py が DB に入れ直す)。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: glitchtip
  namespace: glitchtip
  # 2 つとも必須。前者は operator が作る Secret を prune させないため、後者は
  # CRD がまだ無いクラスタで apps/ の同期が丸ごと落ちるのを防ぐため。
  # bootstrap/README.md「InfisicalSecret には sync-options を 2 つ付けること」。
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /glitchtip/glitchtip
        recursive: false
  managedKubeSecretReferences:
    - secretName: glitchtip
      secretNamespace: glitchtip
      # Orphan: CR を消しても Secret は残す(移行や再作成で稼働中の Pod を巻き込まない)
      creationPolicy: Orphan
