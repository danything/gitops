# **Secret `k8up-global` を Infisical から作る。**
#
# k3s 期はホストの `/etc/k3s-backup/env` から [recovery/restore.sh](../../recovery/restore.sh) が
# 作っていた。**Talos にはあのファイルもシェルも無い**ので、他のアプリと同じ経路に寄せる
# (ROADMAP の積み残し「`k8up-global` Secret は git だけからは再建できない」)。
#
# ## 災害復旧のときだけ順番が逆になる
#
# **この Secret の中身は R2 の資格情報そのもの**で、Infisical を戻すための
# `infisical-postgresql.sql` もその R2 にある。**まっさらから戻すときは
# Infisical より先にこれが要る** ── そのときは [recovery/](../../recovery/) の
# `env.age` を手で復号して `kubectl create secret` する。**平常時だけ Infisical が正本**、
# という二段構えで、`recovery/` はその一度きりのために残してある。
#
# ## 入れる値
#
# Infisical の `/k8up/k8up-global` に**この 6 つのキー**を作ってから当てること。
# **operator は Infisical にあるものだけを Secret に書く**ので、足りないまま当てると
# **バックアップが全部落ちる。**
#
#   endpoint            R2 の S3 エンドポイント(`s3:` を外したホスト部分。**Cloudflare の
#                       アカウント ID を含むので git には置けない**)
#   bucket              バケット名
#   accessKeyId         R2 のアクセスキー ID
#   secretAccessKey     R2 のシークレット
#   repoPassword        restic のリポジトリのパスフレーズ
#   mattermostWebhook   notify.yaml が投げる先
#
# 値は `/etc/k3s-backup/env`(`RESTIC_REPOSITORY` を `s3:<endpoint>/<bucket>` に分ける)と
# 同じもの。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: k8up-global
  namespace: k8up
  # **必須。** 理由は bootstrap/README.md「`Prune=false` を必ず付けること」
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /k8up/k8up-global
        recursive: false
  managedKubeSecretReferences:
    - secretName: k8up-global
      secretNamespace: k8up
      # Orphan: CR を消しても Secret は残す(バックアップの資格情報を巻き込まない)
      creationPolicy: Orphan
