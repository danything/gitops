# Secret k8up-global を Infisical (/k8up/k8up-global) から作る。
# k3s 期は recovery/restore.sh がホストの env ファイルから作っていた。
#
# キーは endpoint / bucket / accessKeyId / secretAccessKey / repoPassword /
# mattermostWebhook の 6 つ。値は `age -d recovery/env.age` にある。
# endpoint は RESTIC_REPOSITORY の `s3:` だけを外した形で、https:// は残す。
#
# 足りないまま当てるとバックアップが全部落ちる。値を変えたら
# `kubectl -n k8up rollout restart deploy/k8up`(auto-reload は使えない)。
# 災害復旧のときは Infisical より先にこれが要るので env.age から手で作る。
# 経緯は README.md「秘密の渡し方」。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: k8up-global
  namespace: k8up
  # 2 つとも必須。前者は operator が作る Secret を prune させないため、後者は
  # CRD がまだ無いクラスタで apps/ の同期が丸ごと落ちるのを防ぐため。
  # bootstrap/README.md「InfisicalSecret には sync-options を 2 つ付けること」。
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /k8up/k8up-global
        recursive: false
  managedKubeSecretReferences:
    - secretName: k8up-global
      secretNamespace: k8up
      # Orphan: CR を消しても Secret は残す(バックアップの資格情報を巻き込まない)
      creationPolicy: Orphan
