# **Secret `k8up-global` を Infisical から作る。**
#
# k3s 期はホストの `/etc/k3s-backup/env` から [recovery/restore.sh](../../recovery/restore.sh) が
# 作っていた。**Talos にはあのファイルもシェルも無い**ので、他のアプリと同じ経路に寄せる
# (ROADMAP の積み残し「`k8up-global` Secret は git だけからは再建できない」)。
#
# ## 災害復旧のときだけ順番が逆になる
#
# **この Secret の中身は R2 の資格情報そのもの**で、Infisical を戻すための
# `infisical-postgresql.sql` もその R2 にある。**まっさらから戻すときは
# Infisical より先にこれが要る** ── そのときは [recovery/](../../recovery/) の
# `env.age` を手で復号して `kubectl create secret` する。**平常時だけ Infisical が正本**、
# という二段構えで、`recovery/` はその一度きりのために残してある。
#
# ## 入れる値
#
# Infisical の `/k8up/k8up-global` に**この 6 つのキー**を作ってから当てること。
# **operator は Infisical にあるものだけを Secret に書く**ので、足りないまま当てると
# **バックアップが全部落ちる。**
#
#   endpoint            R2 の S3 エンドポイント(`s3:` を外したホスト部分。**Cloudflare の
#                       アカウント ID を含むので git には置けない**)
#   bucket              バケット名
#   accessKeyId         R2 のアクセスキー ID
#   secretAccessKey     R2 のシークレット
#   repoPassword        restic のリポジトリのパスフレーズ
#   mattermostWebhook   notify.yaml が投げる先
#
# 値は `recovery/env.age`(`age -d recovery/env.age`)と同じもの。**`endpoint` は
# `RESTIC_REPOSITORY` の `s3:` だけを外した形** ── `https://` は残す。
# ここを間違えると R2 に繋がらない(2026-09-08 に実際に踏んだ。canary の Secret に
# 出してから本物と突き合わせて気づいた)。
#
# ## **値を変えたら k8up を再起動する**
#
#     kubectl -n k8up rollout restart deploy/k8up
#
# 他のアプリのように `secrets.infisical.com/auto-reload: "true"` で自動再起動…とは
# **いかない。** あの注釈は Deployment 自身の `metadata.annotations` に要るが、
# **k8up の chart は `podAnnotations`(Pod テンプレート側)しか公開していない**
# (4.10.0 で確認)。この 1 つのために app の定義を kustomize の多段ソースに
# 作り替えるのは割に合わないので、手順で埋める。
#
# **再起動が要るのは 5 つだけ。** operator は R2 の資格情報を `secretKeyRef` で
# 読むので Pod 起動時に固まる。`mattermostWebhook` は [notify.yaml](notify.yaml) の
# CronJob が**実行のたびに読む**ので、次の 18:00 UTC から勝手に新しい値になる。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: k8up-global
  namespace: k8up
  # **2 つとも必須。**
  #   Prune=false                     … bootstrap/README.md「`Prune=false` を必ず付けること」
  #   SkipDryRunOnMissingResource=true … **まっさらなクラスタでは CRD がまだ無い。**
  #     ArgoCD は同期の前に dry-run するので、`secrets.infisical.com/v1alpha1` が
  #     引けないと **`apps/` の同期が丸ごと落ちる** ── CRD を入れる当の Application
  #     (apps/infisical-operator/)が同じ同期の中にいるので抜けられない。
  #     k8up の Schedule と同じ形の穴で、2026-09-08 のドリルで踏んだ
  #     (docs/talos.md「ブートドリル 5 回目」)
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /k8up/k8up-global
        recursive: false
  managedKubeSecretReferences:
    - secretName: k8up-global
      secretNamespace: k8up
      # Orphan: CR を消しても Secret は残す(バックアップの資格情報を巻き込まない)
      creationPolicy: Orphan
