# 最新のバックアップが本当に戻せるかを月に 1 回確かめる。
#
# notify.yaml は「新しいスナップショットができたか」「中身が 0 バイトでないか」までしか
# 見ない。**取れていることと戻せることは別** ── 壊れた SQLite や途中で切れたダンプでも
# スナップショットは新しく、0 バイトでもない。それを捕まえるには実際に取り出して開くしかない。
# 四半期ごとの手動のリハーサル(ROADMAP)の代わり。建て直しそのものの手順は recovery/README.md。
#
# 見るもの((host, path) ごとの最新。`retired` は落とす。過去 8 日に出てこない経路は notify の担当):
#   - SQLite(.db): `PRAGMA integrity_check` が ok、表が 1 つ以上
#   - pg_dump(.sql): 使い捨ての postgres に流して ERROR が 0 行、表の数を出す
#   - tar: 全部展開できる。netbird は store.db / idp.db / events.db を SQLite と同じく見る。
#     matrix は backups/meta/<番号> が指すファイルが全部入っていること
#   - ファイルの PVC(/data/<pvc>)と etcd: `restic ls` が通って合計が 0 バイトでないこと。
#     中身は取り出さない(denpa-encoded は 2 GiB 超)
#
# **リポジトリには書かない。** restic は全部 `--no-lock`(読むだけでもロックのファイルを書くため)。
# その代わり prune・check と時間をずらすこと(下の schedule)。
#
# 秘密は notify と同じ `k8up-global` に相乗り。結果も notify と同じ webhook に 1 通。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8up-restore-check
  namespace: k8up
spec:
  # 毎月 1 日 06:00 UTC。バックアップ(13:00〜18:30 UTC)と日曜の prune・check(〜23:45 UTC)の外。
  # 全部で 2 分ほど(27 件。2026-10-17 実測)。
  schedule: "0 6 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          # postgres のイメージの postgres ユーザー(999)。initdb は passwd に居ないユーザーでは動かない。
          # PSA restricted でも通る形にしておく
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            # 道具を集める。restic は k8up のイメージから(notify・etcd-snapshot と同じ版)、
            # bun は notify と同じイメージから。どちらも 1 ファイルで、postgres のイメージの上で動く。
            # **CA の束も持ってくる。** postgres のイメージには入っていない。無いと restic は
            # x509 のエラーを黙って retry し続け、何も言わずに止まって見える(2026-10-17 に踏んだ)。
            # メモリの上限は bun(約 90 MB)の書き込みがページキャッシュに乗るぶん。64Mi では OOMKilled だった
            - name: restic
              image: ghcr.io/k8up-io/k8up:v2.16.0
              command: [sh, -ec, "cp /usr/local/bin/restic /etc/ssl/certs/ca-certificates.crt /tools/"]
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: tools, mountPath: /tools}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 256Mi}
            - name: bun
              image: oven/bun:1.4.3-slim
              command: [cp, /usr/local/bin/bun, /tools/bun]
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: tools, mountPath: /tools}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 256Mi}
          containers:
            - name: check
              # 戻し先の postgres。forgejo・rybbit と同じ 17(infisical は 16 だが、16 のダンプは 17 に流せる)
              image: postgres:17.11
              command: [/tools/bun, /script/restore-check.js]
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              env:
                # HOME 任せにしない。root 以外で HOME が / のイメージだと `mkdir /.cache/restic: permission denied`
                # (etcd-snapshot.yaml と同じ)。emptyDir なので毎回まっさらから索引を読む
                - name: RESTIC_CACHE_DIR
                  value: /work/.cache
                - name: SSL_CERT_FILE
                  value: /tools/ca-certificates.crt
                - name: ENDPOINT
                  valueFrom: {secretKeyRef: {name: k8up-global, key: endpoint}}
                - name: BUCKET
                  valueFrom: {secretKeyRef: {name: k8up-global, key: bucket}}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: k8up-global, key: accessKeyId}}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: k8up-global, key: secretAccessKey}}
                - name: RESTIC_PASSWORD
                  valueFrom: {secretKeyRef: {name: k8up-global, key: repoPassword}}
                - name: WEBHOOK
                  valueFrom: {secretKeyRef: {name: k8up-global, key: mattermostWebhook}}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 1Gi}
              volumeMounts:
                - {name: script, mountPath: /script}
                - {name: tools, mountPath: /tools}
                - {name: work, mountPath: /work}
          volumes:
            - name: script
              configMap:
                name: k8up-restore-check
            - name: tools
              emptyDir: {sizeLimit: 256Mi}
            # 取り出したファイルと postgres のデータ。1 つ見るたびに消す
            - name: work
              emptyDir: {sizeLimit: 4Gi}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8up-restore-check
  namespace: k8up
data:
  restore-check.js: |
    // 最新のスナップショットを取り出して開いてみる。結果を 1 通にまとめて投げる。
    import { Database } from "bun:sqlite";
    import { mkdirSync, rmSync, readdirSync, statSync, existsSync, readFileSync } from "fs";
    // ここで投稿まで届かずに落ちたとき(OOMKilled・期限切れなど)は、日次の notify が
    // CronJob の lastSuccessfulTime を見て拾う(notify.yaml)

    const LEARN_H = 24 * 8;
    const W = "/work";
    const SOCK = `${W}/sock`;
    process.env.RESTIC_REPOSITORY = `s3:${process.env.ENDPOINT}/${process.env.BUCKET}`;

    // 失敗したら標準エラーの末尾ごと投げる(呼んだ側がそのまま理由に使う)。
    // 1 つ 10 分で打ち切る。restic は R2 のエラーを黙って retry するので、待つと投稿まで届かない
    const run = (cmd) => {
      const p = Bun.spawnSync(cmd, { stdout: "pipe", stderr: "pipe", env: process.env, timeout: 600e3 });
      // restic は失敗するとリポジトリの場所(アカウント ID 入り)を出す。通知に載せない
      const err = p.stderr.toString().replaceAll(process.env.ENDPOINT, "<endpoint>");
      if (p.exitCode !== 0) throw new Error(`${cmd[0]} ${cmd[1]}: ${p.exitCode ?? "10 分で打ち切り"} ${err.trim().split("\n").slice(-2).join(" / ").slice(0, 200)}`);
      return { out: p.stdout.toString(), err };
    };
    const restic = (...a) => run(["/tools/restic", "--no-lock", ...a]);

    // **SQLite を開いて確かめる。** 表が 0 は「空の DB を取っている」なので失敗にする
    const sqlite = (file) => {
      const db = new Database(file, { readonly: true });
      try {
        const ic = db.query("PRAGMA integrity_check").all().map((r) => Object.values(r)[0]);
        if (ic.join() !== "ok") throw new Error(`integrity_check: ${ic.slice(0, 3).join("; ")}`);
        const n = db.query("SELECT count(*) AS n FROM sqlite_master WHERE type='table'").get().n;
        if (!n) throw new Error("表が 0");
        return n;
      } finally {
        db.close();
      }
    };

    // **使い捨ての postgres。** 最初の .sql が来たときに 1 回だけ立てる
    let pgUp = false;
    const psql = (db, ...a) => run(["psql", "-X", "-q", "-h", SOCK, "-U", "postgres", "-d", db, ...a]);
    const startPg = () => {
      if (pgUp) return;
      mkdirSync(SOCK, { recursive: true });
      run(["initdb", "-D", `${W}/pg`, "-U", "postgres", "--auth=trust", "-E", "UTF8", "--locale=C.UTF-8", "--no-sync"]);
      run(["pg_ctl", "-D", `${W}/pg`, "-w", "-l", `${W}/pg.log`, "-o", `-c listen_addresses= -k ${SOCK} -c fsync=off`, "start"]);
      pgUp = true;
    };
    const pgdump = (file, name) => {
      startPg();
      // **ロールを先に作る。** ダンプは --no-owner ではないので `OWNER TO <ロール>` が入っていて、
      // ロールが無いとそこだけ全部 ERROR になる(apps/k8up/README.md「戻し方」)。
      // ダンプは grep で読む(丸ごとメモリに載せない。同じ Pod に postgres が居る)
      const hits = run(["sh", "-c", `grep -ohE '(OWNER TO|^GRANT .* TO) "?[A-Za-z0-9_-]+"?;' "$1" || true`, "sh", file]).out;
      const roles = new Set(hits.split("\n").filter(Boolean).map((l) => l.split(" ").at(-1).replace(/[";]/g, "")));
      roles.delete("postgres");
      roles.delete("PUBLIC");
      for (const r of roles) psql("postgres", "-c", `DO $$BEGIN CREATE ROLE "${r}"; EXCEPTION WHEN duplicate_object THEN NULL; END$$`);
      const db = name.replace(/\W/g, "_");
      psql("postgres", "-c", `CREATE DATABASE "${db}"`);
      try {
        // ERROR があっても最後まで流して数える(ON_ERROR_STOP は付けない)
        const { err } = psql(db, "-f", file);
        const errors = err.split("\n").filter((l) => l.includes("ERROR:"));
        if (errors.length) throw new Error(`ERROR ${errors.length} 行: ${errors[0].slice(0, 150)}`);
        const t = psql(db, "-At", "-c",
          "SELECT count(*) FROM information_schema.tables WHERE table_type='BASE TABLE' AND table_schema NOT IN ('pg_catalog','information_schema')",
        ).out.trim();
        if (t === "0") throw new Error("表が 0");
        return `${t} 表`;
      } finally {
        psql("postgres", "-c", `DROP DATABASE IF EXISTS "${db}"`);
      }
    };

    const files = (dir) =>
      readdirSync(dir, { recursive: true }).filter((f) => statSync(`${dir}/${f}`).isFile());

    const tar = (file, host) => {
      const dir = `${W}/x`;
      mkdirSync(dir, { recursive: true });
      run(["tar", "-xf", file, "-C", dir]);
      const got = files(dir);
      if (!got.length) throw new Error("tar が空");
      if (host === "netbird") {
        // store.db(ピアと設定)・idp.db(内蔵 IdP)・events.db(apps/netbird/deployment.yaml)
        return ["store.db", "idp.db", "events.db"]
          .map((n) => {
            if (!existsSync(`${dir}/${n}`)) throw new Error(`${n} が無い`);
            return `${n} ${sqlite(`${dir}/${n}`)} 表`;
          })
          .join(", ");
      }
      if (host === "matrix") {
        // Tuwunel に作らせた RocksDB のバックアップ(apps/matrix/tuwunel.yaml)。
        // 一番新しい backups/meta/<番号> に並んでいるファイルが全部 tar に入っていれば戻せる
        const meta = `${dir}/backups/meta`;
        const ids = existsSync(meta) ? readdirSync(meta).filter((n) => /^\d+$/.test(n)).sort((a, b) => a - b) : [];
        if (!ids.length) throw new Error("backups/meta が無い");
        const want = readFileSync(`${meta}/${ids.at(-1)}`, "utf8")
          .split("\n")
          .map((l) => l.split(" ")[0])
          .filter((p) => /^(private|shared|shared_checksum)\//.test(p));
        if (!want.length) throw new Error(`meta/${ids.at(-1)} にファイルが無い`);
        const lost = want.filter((p) => !existsSync(`${dir}/backups/${p}`));
        if (lost.length) throw new Error(`meta/${ids.at(-1)} の ${lost.length} 本が無い(${lost[0]} など)`);
        return `meta/${ids.at(-1)} の ${want.length} 本あり、全 ${got.length} ファイル`;
      }
      return `${got.length} ファイル`;
    };

    // 取り出さずに木だけ読む。`restic ls` は 1 行目がスナップショット、以降がノード
    const lsSize = (id) => {
      let n = 0, bytes = 0;
      for (const l of restic("ls", "--json", id).out.split("\n")) {
        if (!l) continue;
        const o = JSON.parse(l);
        if (o.type === "file") (n++, (bytes += o.size ?? 0));
      }
      if (!bytes) throw new Error(`中身が 0 バイト(${n} ファイル)`);
      return `${n} ファイル ${bytes < 2 ** 20 ? `${(bytes / 1024).toFixed(1)} KiB` : `${(bytes / 2 ** 20).toFixed(1)} MiB`}`;
    };

    const check = (s, path) => {
      if (s.hostname === "etcd" || path.startsWith("/data/")) return lsSize(s.short_id);
      const file = `${W}/${path.split("/").pop()}`;
      try {
        // restic dump を Pod の中で流すのは問題ない(末尾が欠けたのは kubectl exec -i を挟んだとき)
        run(["sh", "-c", '/tools/restic --no-lock dump "$1" "$2" > "$3"', "sh", s.short_id, path, file]);
        const size = statSync(file).size;
        if (!size) throw new Error("0 バイト");
        if (path.endsWith(".db")) return `SQLite ${sqlite(file)} 表`;
        if (path.endsWith(".sql")) return pgdump(file, path.slice(1));
        if (path.endsWith(".tar")) return tar(file, s.hostname);
        return `${size} バイト`;
      } finally {
        rmSync(file, { force: true });
        rmSync(`${W}/x`, { recursive: true, force: true });
      }
    };

    const lines = [];
    let bad = 0;
    try {
      const now = Date.now();
      const latest = new Map();
      for (const s of JSON.parse(restic("snapshots", "--json").out)) {
        if ((s.tags ?? []).includes("retired")) continue;
        if ((now - Date.parse(s.time)) / 3600e3 > LEARN_H) continue;
        for (const path of s.paths ?? []) {
          const key = `${s.hostname}${path}`;
          if (!latest.has(key) || Date.parse(s.time) > Date.parse(latest.get(key).s.time)) latest.set(key, { s, path });
        }
      }
      for (const [key, { s, path }] of [...latest].sort(([a], [b]) => a.localeCompare(b))) {
        const day = s.time.slice(0, 10);
        try {
          lines.push(`- ✅ ${key} (${day}): ${check(s, path)}`);
        } catch (e) {
          bad++;
          lines.push(`- ❌ ${key} (${day}): ${e.message}`);
        }
        console.log(lines.at(-1));
      }
      if (!latest.size) (bad++, lines.push("- ❌ 過去 8 日のスナップショットが 1 本も無い"));
    } catch (e) {
      bad++;
      lines.push(`- ❌ 途中で止まった: ${e.message}`);
    }
    if (pgUp) Bun.spawnSync(["pg_ctl", "-D", `${W}/pg`, "-m", "fast", "stop"]);

    const text = `[k8up] 復元チェック ${bad ? `FAILED ❌ (${bad} 件)` : `OK ✅ (${lines.length} 件すべて戻せる)`}\n${lines.join("\n")}`;
    console.log(text);
    const r = await fetch(process.env.WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!r.ok) {
      console.error(`投稿に失敗: ${r.status} ${await r.text()}`);
      process.exit(1);
    }
    // FAILED でも exit 0(notify.yaml と同じ理由。Job が落ちると CronJob が Degraded になり
    // ArgoCD の同期が retry に入る)。非ゼロは投稿そのものに失敗したときだけ
