# shadai(車台)。DB は Pod の backupcommand、添付は PVC shadai-files をファイルとして。
# 17:30 / 日曜 22:30 が空いていた枠。最初 18:00 に置いたら notify.yaml(18:00 UTC)と同じ分に
# 走り、通知側が「25 時間以内のスナップショットが無い」と鳴った(バックアップ自体は 18:00:26 に成功)。
# 上の決まりどおり、バックアップは 15:00〜17:45 UTC、prune は日曜 20:00〜22:45 UTC の枠に置く
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: shadai
  namespace: shadai
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  backup:
    schedule: "30 17 * * *"
    tags: [k8up]
    podSecurityContext: {runAsUser: 0, runAsGroup: 0}
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 1
  prune:
    schedule: "30 22 * * 0"
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
      tags: [k8up]
---
# リポジトリの健全性チェック。これだけ 1 本。
# ホストの `backup/k3s-backup` が `restic check --read-data-subset=5%` を回していたぶんで、
# Talos に移るとあれが無くなるので k8up 側に置いておく。
# k8up の `check` は素の `restic check`(データの読み直しはせず、構造とインデックスを見る)。
#
# 日曜の prune(20:00〜22:30 UTC)がすべて終わったあとに置く。重なっても壊れない。
# k8up の check と prune はどちらも `Exclusive()` で、locker が
# 「排他ジョブが走っている間は始めない」を見ている(`operator/locker/locker.go` の
# `isExclusiveJobRunning`)。始められなかった側は失敗せず、30 秒ごとに待って再試行する
# (`controller.go` の `RequeueAfter: 30 * time.Second`)。restic のロック競合にはならない。
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: check
  namespace: k8up
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  check:
    schedule: "0 23 * * 0"
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 1
