# k8up の Schedule を 1 か所にまとめてある。中身は名前と namespace と時刻しか
# 違わないので、アプリごとにファイルを分けると同じ注意書きが 9 回並ぶ。
# 何をバックアップするか(どの Pod・どの PVC の注釈が効くか)は apps/k8up/README.md の表。
# 注釈だけでは動かない。その namespace に Schedule が無いとジョブ自体が作られないので、
# PVC や Pod に注釈を足したらここに namespace があるかを必ず確かめる。
#
# 決まりごと
#
# - `SkipDryRunOnMissingResource` は必須。k8up の CRD がまだ無いクラスタだと、
#   これが無いと `apps/` の同期が丸ごと落ちる(README「CRD がまだ無いクラスタで〜」)
# - `tags: [k8up]` を付ける。prune は `--host=<namespace>` で自分の namespace の
#   スナップショットしか消さない(`restic/cli/prune.go`)ので、ホストのスクリプトの
#   ぶん(`host=main` / `tag=k3s-host`)には元から届かない。タグは二重の歯止め
# - prune は namespace ごとに要る。上と同じ理由で、1 本にまとめても他の
#   namespace には効かない
# - 時刻はホストのスクリプト(19:00 UTC = 04:00 JST)を避ける。restic は
#   リポジトリをロックするので、重なると片方が待たされる。
#   バックアップは 15:00〜17:45 UTC、prune は日曜の 20:00〜22:45 UTC に置いてある。
#   後ろは詰まっている。18:00 UTC に notify.yaml、18:30 UTC に
#   denpa-library-forget.yaml の CronJob が走り、19:00 UTC がホストのスクリプト。
#   これ以上うしろに足すならそれらもずらすこと
# - 保持は全部 `keepDaily 7 / keepWeekly 4 / keepMonthly 6`
# - `check` だけは 1 本でよい。`restic check` はリポジトリ全体を見るもので、
#   prune と違って namespace には縛られない(`restic/cli/check.go` は `--host` を渡さない)
# - バックエンドは書かない。書くと R2 のエンドポイント(Cloudflare の
#   アカウント ID を含む)が git に載る。operator のグローバル設定に寄せてある
# - `podSecurityContext: {runAsUser: 0}` を全部に付ける。k8up の既定は
#   nonroot(65532)で、`0600 root:root` のファイルが読めない。そのとき restic は
#   `errors: 7` を出しながら中身が 0 バイトのスナップショットを作り、k8up はそれを
#   `Succeeded` にする。気づけない。2026-09-08 に実測で見つけた
#   (adguardhome-conf / adguardhome-work / portainer-data の 3 本が空だった。
#   portainer はその後 Headlamp に置き換えて消した)。
#   詳しくは README「空のスナップショット」。
#   Talos の PSA `baseline` でも通る(root を禁じるのは `restricted` だけ)。
#   将来 `restricted` に寄せるならここが引っかかる。そのときは
#   AdGuardHome 側がファイルを `0640` で作るようにするしかない
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: mattermost
  namespace: mattermost
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  backup:
    schedule: "0 15 * * *"
    tags: [k8up]
    podSecurityContext: {runAsUser: 0, runAsGroup: 0}
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 1
  prune:
    schedule: "0 20 * * 0"
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
      tags: [k8up]
---
