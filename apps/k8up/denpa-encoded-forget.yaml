# エンコード済みの録画(PVC denpa-encoded、Pod の中では /media/encoded)だけ世代を持たない。
# 中身が入れ替わるので、古い世代が消えたファイルを抱え続ける。
# 翌日までに誤削除に気づかないと戻せない。余裕が欲しくなったら --keep-last 2(約 2 GiB)。
#
# k8up の保持は Schedule(= namespace)単位でしか書けない。restic の forget は既定で (host, paths) ごとに
# 保持を効かせる(k8up は --group-by を渡さない)ので、PVC ごとに別の保持を当てるには path を絞った forget を回す。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: denpa-encoded-forget
  namespace: k8up
spec:
  # 排他のロックを取るので schedules.yaml の時刻と重ねない(あちらの冒頭)
  schedule: "30 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: forget
              # notify と同じ。k8up のイメージに restic が入っている。
              image: ghcr.io/k8up-io/k8up:v2.16.0
              command:
                - sh
                - -ec
                - |
                  export RESTIC_REPOSITORY="s3:${ENDPOINT}/${BUCKET}"
                  restic forget \
                    --host denpa --path /data/denpa-encoded \
                    --keep-last 1 --prune
              env:
                - name: ENDPOINT
                  valueFrom: {secretKeyRef: {name: k8up-global, key: endpoint}}
                - name: BUCKET
                  valueFrom: {secretKeyRef: {name: k8up-global, key: bucket}}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: k8up-global, key: accessKeyId}}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: k8up-global, key: secretAccessKey}}
                - name: RESTIC_PASSWORD
                  valueFrom: {secretKeyRef: {name: k8up-global, key: repoPassword}}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 1Gi}
