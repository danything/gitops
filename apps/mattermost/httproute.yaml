# 公開経路。証明書は Gateway(bootstrap/gateway/)のリスナーに付いているので指定しない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mattermost
  namespace: mattermost
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https
  hostnames: ["mm.doany.io"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mattermost
          port: 8065
