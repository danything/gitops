# **論理バックアップだけ。** PVC のファイルはホストの backup/k3s-backup が写している
# (PVC には k8up.io/backup: "false" を付けてある)。ここで取るのは postgres.yaml の
# k8up.io/backupcommand が出す pg_dump の中身だけ。
#
# **タグを必ず付ける。** k8up の Prune は retention.tags を書かないと
# **リポジトリ全体**を対象に restic forget する。ホストのスクリプトは
# `--tag k3s-host` で自分のスナップショットだけを消しているので、こちらも
# 自分のぶんだけに絞らないと相手のスナップショットを消してしまう。
#
# バックエンドは書かない。書くと R2 のエンドポイント(アカウント ID を含む)が
# git に載る。operator のグローバル設定に寄せてある(apps/k8up/README.md)。
#
# 時刻はホストのスクリプト(19:00 UTC = 04:00 JST)を避ける。restic はリポジトリを
# ロックするので、重なると片方が待たされる。
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  # **CRD がまだ無いクラスタでも apps 全体を止めない。** ArgoCD は同期の前に
  # マニフェスト一式を dry-run で検証するので、k8up の CRD が入る前だと
  # 「k8up.io/v1 が引けない」で **apps/ 配下が丸ごと適用されなくなる**
  # (2026-09-07 の復元リハーサルで発覚。子 Application 5 本が作られなかった)。
  # このリソースだけ dry-run を飛ばせば、CRD を入れる Application が先に通る。
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: mattermost
  namespace: mattermost
spec:
  backup:
    schedule: "0 15 * * *"
    tags:
      - k8up
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 1
  prune:
    schedule: "0 16 * * 0"
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
      tags:
        - k8up
