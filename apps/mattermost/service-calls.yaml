# Calls carries its media over WebRTC on its own port, not over HTTP, so it
# can't ride the Traefik ingress -- it needs 8443 exposed on the node itself,
# the same way adguardhome publishes DNS. externalIPs adds the office LAN
# side; ServiceLB covers the 10.0.0.2 side that the router forwards to.
#
# externalTrafficPolicy: Local keeps the client IP intact, which is what the
# plugin matches its ICE candidates against.
#
# Two things live outside this file:
#   - the router has to forward WAN udp/8443 (and tcp/8443, the fallback for
#     clients that block UDP) to 10.0.0.2
#   - "Test mode" has to be off in System Console > Plugins > Calls, or only
#     admins can start a call. Plugin settings are a free-form map in the
#     config rather than fields on it, and MM_* environment overrides only
#     reach the fields -- so unlike everything else here, that toggle can't
#     be expressed in git. It's set on the workspace already.
#
# The RTC ports themselves are the plugin's defaults (8443 for both), and the
# public address is discovered at startup via STUN, so neither needs pinning.
apiVersion: v1
kind: Service
metadata:
  name: mattermost-calls
  namespace: mattermost
spec:
  type: LoadBalancer
  # Dual-stack: the CNI installs hostPort DNAT rules for v6 8443 regardless of
  # this, so leaving the Service IPv4-only means IPv6 clients reach the svclb
  # pod and get dropped there -- the plugin advertises a v6 ICE candidate that
  # then has to time out before the client falls back to v4.
  ipFamilyPolicy: RequireDualStack
  ipFamilies:
    - IPv4
    - IPv6
  externalTrafficPolicy: Local
  externalIPs:
    - 10.10.0.4
  selector:
    app: mattermost
  ports:
    - name: rtc-udp
      protocol: UDP
      port: 8443
      targetPort: 8443
    - name: rtc-tcp
      protocol: TCP
      port: 8443
      targetPort: 8443
