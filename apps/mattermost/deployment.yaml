apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost
  namespace: mattermost
  annotations:
    # 参照している Secret を Infisical operator が同期したら、自動でローリング再起動する
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  # /mattermost/data is ReadWriteOnce, same as postgres above.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mattermost
  template:
    metadata:
      labels:
        app: mattermost
    spec:
      # The image runs as uid/gid 2000, and the freshly-provisioned volume is
      # root-owned, so the mounts need to be group-writable for that uid.
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Mattermost retries the database only for a fixed window and then
        # exits, which on a first sync (empty volume, initdb still running)
        # means a CrashLoopBackOff until PostgreSQL catches up. Waiting here
        # keeps that first rollout clean.
        - name: wait-for-postgres
          image: postgres:17.10
          command:
            - bash
            - -c
            - |
              until pg_isready -h postgres -U mattermost -d mattermost; do
                echo "waiting for postgres to accept connections"
                sleep 5
              done
      containers:
        - name: mattermost
          # The enterprise image without a license key is the free "Entry"
          # edition: it has the full feature set (SSO included, unlike Team
          # Edition, which lost its last SSO option in v11) behind usage
          # limits -- notably only the newest 10,000 messages server-wide stay
          # visible and searchable. Nothing is deleted when that's crossed, so
          # switching to mattermost-team-edition later (same database, same
          # env) trades SSO back for unlimited history.
          image: mattermost/mattermost-enterprise-edition:11.9.0
          ports:
            - containerPort: 8065
          env:
            # POSTGRES_PASSWORD is only defined so the two DSNs below can
            # interpolate it -- kubelet expands $(VAR) against env entries
            # declared earlier in this list, which keeps the password itself
            # in exactly one place (the Secret external-secrets builds from Infisical).
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mattermost
                  key: postgres-password
            - name: MM_SQLSETTINGS_DRIVERNAME
              value: postgres
            - name: MM_SQLSETTINGS_DATASOURCE
              value: postgres://mattermost:$(POSTGRES_PASSWORD)@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
            # Pointing MM_CONFIG at the database (instead of the default
            # file store) keeps config.json out of the filesystem entirely,
            # so the app volume only has to hold uploads and plugins. The
            # MM_* variables below still override what's stored there on
            # every start, and show up read-only in the System Console --
            # which is what we want for something git owns.
            - name: MM_CONFIG
              value: postgres://mattermost:$(POSTGRES_PASSWORD)@postgres:5432/mattermost?sslmode=disable&connect_timeout=10

            # Not cosmetic: SiteURL is what the OAuth redirect and every
            # generated link/notification is built from.
            - name: MM_SERVICESETTINGS_SITEURL
              value: https://mm.doany.io

            # Entra ID via the "office365" service. Same tenant/app
            # registration as auth/, argocd, erpnext -- the redirect URI to
            # register there is
            # https://mm.doany.io/signup/office365/complete.
            #
            # "openid" in the scope is load-bearing: it's what makes the
            # server hand this service to its OpenID Connect provider (which
            # reads the discovery document and the standard claims) instead
            # of the older Graph-specific OAuth 2.0 path.
            - name: MM_OFFICE365SETTINGS_ENABLE
              value: "true"
            - name: MM_OFFICE365SETTINGS_ID
              value: b0fa498f-7e6a-4fe1-a1c6-16fbbb6f397e
            - name: MM_OFFICE365SETTINGS_SECRET
              valueFrom:
                secretKeyRef:
                  name: mattermost
                  key: oidc-client-secret
            - name: MM_OFFICE365SETTINGS_DIRECTORYID
              value: 22ac977d-b140-4dc8-8150-90d645d3475b
            - name: MM_OFFICE365SETTINGS_SCOPE
              value: profile openid email
            - name: MM_OFFICE365SETTINGS_DISCOVERYENDPOINT
              value: https://login.microsoftonline.com/22ac977d-b140-4dc8-8150-90d645d3475b/v2.0/.well-known/openid-configuration

            # Entra ID is the only way in: with these off the login page has
            # no password form at all, so accounts can't drift away from the
            # tenant. There's no admin account to seed either -- the first
            # account created on an empty server gets the system admin role,
            # whichever way it signs in, so that's whoever logs in through
            # Entra first (info@doany.io).
            #
            # If that ever needs undoing (bad OAuth config, wrong first
            # login), the image enables mmctl's local mode, which
            # authenticates over a unix socket inside the container rather
            # than with credentials:
            #   kubectl -n mattermost exec deploy/mattermost -- \
            #     /mattermost/bin/mmctl --local roles system_admin <email>
            - name: MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL
              value: "false"
            - name: MM_EMAILSETTINGS_ENABLESIGNINWITHEMAIL
              value: "false"
            - name: MM_EMAILSETTINGS_ENABLESIGNINWITHUSERNAME
              value: "false"
            # Entra has already verified the address it hands over, and with
            # the email login gone there's no password to reset either.
            - name: MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION
              value: "false"

            # Mobile push goes through Mattermost's hosted service (HPNS),
            # which Entry is allowed to use for 10,000 notifications a month.
            # Self-hosting a push proxy isn't an alternative here: the
            # official iOS/Android apps only accept notifications from a proxy
            # holding the APNs certificate for their bundle id, so it would
            # mean shipping our own builds of both apps.
            #
            # ap is the Japan endpoint the System Console's location dropdown
            # picks (global geobalances instead). Accepting the HPNS terms is
            # a click in that same screen and isn't stored in the config, so
            # it isn't reproduced here -- it's already been accepted on this
            # workspace.
            - name: MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS
              value: "true"
            - name: MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER
              value: https://ap.push.mattermost.com

            # Outgoing mail via Exchange Online SMTP AUTH on the same
            # info@doany.io mailbox erpnext sends from. Only used for
            # notifications and invites now that logins go through Entra.
            - name: MM_EMAILSETTINGS_SMTPSERVER
              value: smtp.office365.com
            - name: MM_EMAILSETTINGS_SMTPPORT
              value: "587"
            - name: MM_EMAILSETTINGS_CONNECTIONSECURITY
              value: STARTTLS
            - name: MM_EMAILSETTINGS_ENABLESMTPAUTH
              value: "true"
            - name: MM_EMAILSETTINGS_SMTPUSERNAME
              value: info@doany.io
            - name: MM_EMAILSETTINGS_SMTPPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mattermost
                  key: smtp-password
            - name: MM_EMAILSETTINGS_FEEDBACKEMAIL
              value: info@doany.io
            - name: MM_EMAILSETTINGS_REPLYTOADDRESS
              value: info@doany.io
          # The first start runs the schema migrations, so the slow boot is
          # absorbed by the startup probe rather than by a long liveness
          # initialDelay (which would also delay restarts later on).
          startupProbe:
            httpGet:
              path: /api/v4/system/ping
              port: 8065
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: 8065
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: 8065
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: mattermost-data
              mountPath: /mattermost/data
              subPath: data
            # Plugins are extracted at startup and installed ones live here,
            # so they share the volume rather than being lost on restart.
            - name: mattermost-data
              mountPath: /mattermost/plugins
              subPath: plugins
            - name: mattermost-data
              mountPath: /mattermost/client/plugins
              subPath: client-plugins
      volumes:
        - name: mattermost-data
          persistentVolumeClaim:
            claimName: mattermost-data
