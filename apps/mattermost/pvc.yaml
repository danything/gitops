# Two volumes: PostgreSQL holds everything Mattermost considers state
# (messages, users, and -- because MM_CONFIG points at the database --
# config.json itself), while the app volume only holds uploaded files and
# installed plugins.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: mattermost
  annotations:
    # ファイルとしてのバックアップはホストの backup/k3s-backup がやっている。
    # k8up には論理バックアップ(pg_dump)だけ取らせるので、PVC そのものは対象外にする。
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mattermost-data
  namespace: mattermost
  annotations:
    # ファイルとしてのバックアップはホストの backup/k3s-backup がやっている。
    # k8up には論理バックアップ(pg_dump)だけ取らせるので、PVC そのものは対象外にする。
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 20Gi
