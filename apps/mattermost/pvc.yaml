# Two volumes: PostgreSQL holds everything Mattermost considers state
# (messages, users, and -- because MM_CONFIG points at the database --
# config.json itself), while the app volume only holds uploaded files and
# installed plugins.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: mattermost
  annotations:
    # **DB はファイルとして取らない。** postgres.yaml の k8up.io/backupcommand が
    # pg_dump を出しているので、そちらだけで足りる。
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mattermost-data
  namespace: mattermost
  annotations:
    # **こちらはファイルとして取る。** 添付とプラグインだけで DB ではないので、
    # 動いたままコピーしても部分的に古くなるだけ。
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 20Gi
