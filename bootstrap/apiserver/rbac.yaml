# GitHub Actions(bootstrap-apply.yml)がこのクラスタで何をしてよいかの定義。
#
# 当てるのは人か machine config。ワークフローではない。bootstrap-apply.yml は
# `bootstrap/apiserver/` を除外している。ここを当てられるとワークフローが自分の
# 権限を書き換えられてしまう。k3s 期は手で当てていた。Talos ではこのファイルを
# [../../talos/render.sh](../../talos/render.sh) が inlineManifest に描くので、
# machine config を当てた時点で入っている(このファイルが正本で、写しは作らない)。
#
# cluster-admin は渡さない。bootstrap/ の中で実際に使われている種類だけを列挙してある
# (SOPS で暗号化した 4 ファイルはワークフロー側で除外しているので、Secret は入っていない)。
# これで、GitHub 側が乗っ取られても Secret を読まれることはない。
#
# delete も渡していない。ワークフローは apply しかせず、prune もしない。
# 消すのは人の手で、というのは apps/ の方針(git から消えたら消える)とは逆だが、
# ここはクラスタの土台で、事故の範囲が違う。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bootstrap-applier
rules:
  - apiGroups: [""]
    resources: [namespaces, services]
    verbs: [get, list, create, update, patch]
  # cilium-drift.yml が git の値とクラスタを見比べるためだけの読み取り。
  # `resourceNames` でこの 1 つに絞ってあるので、他の ConfigMap は読めない
  # (`list` は名前で絞れないので付けない。`get` だけで足りる)。
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cilium-config]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, update, patch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, create, update, patch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, create, update, patch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, grpcroutes, referencegrants]
    verbs: [get, list, create, update, patch]
  - apiGroups: [cert-manager.io]
    resources: [certificates, clusterissuers]
    verbs: [get, list, create, update, patch]
  - apiGroups: [secrets.infisical.com]
    resources: [infisicalsecrets]
    verbs: [get, list, create, update, patch]
  - apiGroups: [argoproj.io]
    resources: [applicationsets]
    verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bootstrap-applier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bootstrap-applier
subjects:
  # authentication-config.yaml の claimMappings.username.expression が作る名前。
  # `sub` は組織 ID / リポジトリ ID 入りの形に変わったので使っていない。
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "gha:danything/gitops:refs/heads/main"
---
# ここから下は人。Entra の id_token を Headlamp が API サーバへ転送してくる
# (authentication-config.yaml の 2 つめの issuer)。アプリロール admin を持つ人は
# entra:admin、それ以外は entra:viewer のグループになって届く。
#
# CI と同じくこのファイルは machine config に載るので、クラスタを作り直した
# 直後から効く。ArgoCD も CI も要らない ── 締め出されたときに直せる層に置く。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: entra-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "entra:admin"
---
# 組み込みの view は Secret を含まない代わりに、CRD もノードも含まない。
# 足りないぶんはこれ。どれも get/list/watch だけ。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: readonly-extra
rules:
  - apiGroups: ["apiextensions.k8s.io", "apiregistration.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - storage.k8s.io
      - scheduling.k8s.io
      - admissionregistration.k8s.io
      - rbac.authorization.k8s.io
      - metrics.k8s.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # クラスタに実際に居る CRD の群。InfisicalSecret は値ではなく参照しか持たないので
  # 読めても秘密は出ない。
  - apiGroups:
      - gateway.networking.k8s.io
      - argoproj.io
      - cert-manager.io
      - acme.cert-manager.io
      - cilium.io
      - k8up.io
      - secrets.infisical.com
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: entra-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "entra:viewer"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: entra-viewer-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: readonly-extra
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "entra:viewer"
