# **API サーバに GitHub Actions の OIDC を受けさせる設定。**
# これは Kubernetes のマニフェストではなく、**API サーバに渡すファイル**。
#
#   k3s  : /etc/rancher/k3s/authentication-config.yaml に置き、config.yaml の
#          kube-apiserver-arg に `authentication-config=...` を足す
#   Talos: machine config の cluster.apiServer に載せる(../../talos/patches/)
#
# ## なぜこれが要るか
#
# 「サーバに何も置かず git だけで回す」ためには、**クラスタの外から apply する経路**が要る。
# ArgoCD に bootstrap/ を持たせると「ArgoCD が自分の公開経路を握る」循環になるので、
# 外側(GitHub Actions)から当てる。そこで問題になるのが資格情報で、
# **kubeconfig を GitHub に置くとアカウントが落ちた時点でクラスタ全部が落ちる。**
#
# GitHub Actions の OIDC を直接受ければ、**保存する秘密がゼロ**になる。
# トークンは実行のたびに発行され、数分で切れ、`sub` に「どのリポジトリのどのブランチの
# どのワークフローか」が入っている。それを下の CEL で縛る。
#
# ## 気をつける点
#
# **issuer は誰でもトークンを取れる公開の IdP。** `token.actions.githubusercontent.com` は
# 世界中の GitHub Actions が使うので、**issuer を信じるだけでは誰でも入れる。**
# 効いているのは claimValidationRules のほうで、ここを緩めると即座に穴になる。
apiVersion: apiserver.config.k8s.io/v1
kind: AuthenticationConfiguration
jwt:
  - issuer:
      url: https://token.actions.githubusercontent.com
      # ワークフロー側で `&audience=` に同じ値を指定する。既定の audience
      # (リポジトリ所有者の URL)のままにしないこと — 他のワークフローと共有されるため
      audiences:
        - https://ks.doany.io
    claimMappings:
      # 例: gha:repo:danything/gitops:ref:refs/heads/main
      username:
        claim: sub
        prefix: "gha:"
    claimValidationRules:
      - expression: 'claims.repository == "danything/gitops"'
        message: "danything/gitops 以外は受け付けない"
      - expression: 'claims.ref == "refs/heads/main"'
        message: "main 以外のブランチからは受け付けない"
      # ワークフローのファイルまで固定する。リポジトリに別のワークフローが増えても、
      # それが勝手にクラスタを触れるようにはならない
      - expression: 'claims.workflow_ref.startsWith("danything/gitops/.github/workflows/bootstrap-apply.yml@")'
        message: "bootstrap-apply.yml 以外のワークフローからは受け付けない"
