# ノード main の machine config のうち、手で書く部分の全部。render.sh が `gen config --config-patch` に渡す。
# chart から描く部分(Cilium・ArgoCD・infisical・cert-manager・OpenEBS LVM)は render.sh が足す。版は下のコメント。
#
# **SOPS で password の値だけ暗号化してある**(../.sops.yaml)。平文の部分はそのまま直してよい。
# パスワードを変えるときは `sops edit bootstrap/talos.sops.yaml`。render.sh が `sops -d` してから渡す。
# 各ドキュメントの末尾の `sops:` は SOPS のメタデータ(触らない)。
#
# 型付きドキュメントと v1alpha1 で書く場所が決まっている(../docs/talos.md「machine config の作法」)。
# ドキュメントは上から順に当たる(KubeNodeConfig の delete → 書き戻し は順番に意味がある)。
#
# Talos・Kubernetes・Gateway API の版と schematic。chart の <name>-values.yaml と同じく、`# renovate:` の次の
# `# version:` の行を Renovate が上げ、render.sh が読む(値にすると machine config に混ざるのでコメント)。
# 適用は手で(ノード 1 台なので upgrade は全停止)。手順は talos.md「上げ方 / 当て直し方」。
#
# Talos。Factory のレジストリはタグ一覧を返さないので github-releases で追う。tools/Dockerfile の talosctl と同じ depName。
# dvb-pt3 が v1.15.0-alpha.1 からなので alpha に乗っている(Renovate は次の alpha / beta も出す)。
# renovate: datasource=github-releases depName=siderolabs/talos
# version: v1.15.0-alpha.2
# 拡張(dvb-pt3、i915、intel-ucode)とカーネル引数(intel_iommu=on / iommu=pt)を焼き込んだ Image Factory の ID。i915 は Z440 の Arc A310(DG2)用。
# schematic: e56c70a76ad63c2fc46cb50ed4556a0992bac334016efed6f0424b2336c42944
#
# Kubernetes。上げるのは upgrade-k8s で、マイナーを飛ばさない。tools/Dockerfile の kubectl と同じ depName。
# renovate: datasource=github-releases depName=kubernetes/kubernetes
# version: v1.37.2
#
# Gateway API の CRD(standard チャンネルで足りる)。
# renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
# version: v1.7.0
#
# VolumeSnapshot の CRD と snapshot-controller(storage.yaml の VolumeSnapshotClass が使う)。
# renovate: datasource=github-releases depName=kubernetes-csi/external-snapshotter
# version: v8.7.0
machine:
    sysctls:
        # 無いと IPv6 の既定経路が消える(Kubernetes が forwarding=1 にすると accept_ra=1 は RA を無視する)
        net.ipv6.conf.bond0.accept_ra: "2"
        # IID を MAC 由来にしない。2(stable-privacy)は stable_secret が無いと書き込みが失敗し続ける
        net.ipv6.conf.bond0.addr_gen_mode: "3"
        # SLAAC のアドレスを付けない(あると cloudflare-ddns が静的な ::2 でなくそちらを AAAA に書く)。
        # RA の既定経路はそのまま受ける。
        net.ipv6.conf.bond0.autoconf: "0"
        # Forgejo の Runner(dind)のファイル監視。既定の 128 では EMFILE で落ちる
        fs.inotify.max_user_instances: "8192"
        fs.inotify.max_user_watches: "1048576"
        # IPv6 は bond0 に一本化する(10.10 側の RA に既定経路を奪われると非対称になる)。
        # sysctl はカーネルの名前で書くので、別名(jcom0)は使えない。Z440 の 361T のポート 1 の名前は、移した日に
        # `talosctl get links` で見て足す(無い名前の行は効かないだけ)
        net.ipv6.conf.eno4.disable_ipv6: "1"
    network:
        # PV の nodeAffinity(OpenEBS の openebs.io/nodename)が main を指している
        hostname: main
    # PT3 のドライバ(../docs/decisions.md「PT3 チューナー」)。dvb-pt3 は earth_pt3 を blacklist しているので明示で読ませる。
    # 復調とチューナー(tc90522・qm1d1c0042・mxl301rf)は、v1.15.0-alpha.2 から Talos がカーネルの要求で読む(siderolabs/talos#14724)。
    kernel:
        modules:
            - name: earth-pt3
            # PVC の thin プール(storage.yaml)。Talos のカーネルではモジュールで、OpenEBS のコンテナからは読めない
            - name: dm_thin_pool
    # etcd スナップショットの日次取得(../deploy/k8up/etcd-snapshot.yaml)のため、Pod から Talos API を叩く。
    # 役割は os:etcd:backup だけ、namespace も k8up に絞る(os:admin を Pod に置かずに済む唯一の仕組み)。
    features:
        kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
                - os:etcd:backup
            allowedKubernetesNamespaces:
                - k8up
    # fj.doany.io(Forgejo のコンテナレジストリ)の資格情報。ノード単位なので namespace ごとの imagePullSecrets が要らない。
    # username は Forgejo が見ない(トークンの持ち主で決まる)。password は SOPS で暗号化(冒頭)。取りに行く先は下の StaticHostConfig。
    registries:
        config:
            fj.doany.io:
                auth:
                    username: info
                    password: ENC[AES256_GCM,data:70jLNgZEchTI/4VkDLTBz0ki+teDAGkLewwKK4SzKRYFckDsl0f7rg==,iv:Oa5dXLkZdjVAYdwONlsSoWMStuz+3uH2OTxHCLNISKU=,tag:In/zIG9ZiZzwTrnb+SXiKw==,type:str]
sops:
    age:
        - enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IFgyNTUxOSBIQnpITHlrS0lxZkZXb3dy
            UmNMYUhFamtsR2Rpb3BTMXozYjQwQkoxOEhFClFOeDRQV2tTYTBlL09RUS9oMUZG
