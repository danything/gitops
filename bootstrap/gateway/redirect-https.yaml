# 公開経路。証明書は Gateway([../gateway/](../gateway/))のリスナーに付いているので指定しない。
# **この層は ArgoCD が同期しない**(理由と手順は ../README.md「公開経路(HTTPRoute)もここにある」)。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-https
  namespace: kube-system
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
