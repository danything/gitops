# Cilium LB-IPAM。Gateway の待ち受けアドレスを LAN から払い出す(いまは 10.10.0.53)。
# ノードの IP でも受けられるように、Gateway の Service は 80/443 を nodePort としても開いている
# (Cilium の nodePort.range を 80,443 に絞ってあるのはこのため。docs/decisions.md)。
# AdGuard の DNS と Mattermost calls は Gateway を通らないので hostPort でノードの IP に直接出している。
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
spec:
  blocks:
    - start: "10.10.0.50"
      stop: "10.10.0.55"
---
# 払い出したアドレスを eno4(社内 LAN 側)で ARP 応答する。
# 注意: LB IP は ICMP に応答しないので ping では確認できない。TCP で叩くこと。
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan
spec:
  loadBalancerIPs: true
  interfaces: ["^eno4$"]
  nodeSelector:
    matchLabels: {}
