# **Gateway の Service の nodePort を 80/443 に揃える。** git に書けない唯一の値で、しかも**公開経路そのもの**
# (Cilium の L7LB リダイレクト。../cilium/values.yaml の `nodePort` に実測あり)。Service は Cilium の operator が
# 作るもので、CiliumGatewayClassConfig にも nodePort の欄が無い(Cilium 1.20 の docs で確認)。Cilium が Service を
# 作り直すと API サーバが範囲内のランダムな値を割り当てるので、**まっさらなクラスタでは必ずズレている。**
# 一度揃えれば operator は戻さない(2026-10-17、live の managedFields は operator だけで 80/443 のまま)。
#
# ArgoCD が `bootstrap` を同期するたびに流す(PostSync)。冪等。Service がまだ無ければ Job が落ち、
# 同期の retry(../argocd/repos.yaml の `bootstrap`)でやり直す。2026-10-17 まで bootstrap-apply.yml の 1 step だった。
# **Service が作り直されたら(Gateway の作り直しなど)、ArgoCD で `bootstrap` を手で Sync する。** selfHeal は
# ArgoCD の管理外の Service には効かないので、次に git が変わるまで 80/443 に戻らない。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-nodeport
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-nodeport
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: [services]
    resourceNames: [cilium-gateway-doany]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-nodeport
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-nodeport
subjects:
  - kind: ServiceAccount
    name: gateway-nodeport
    namespace: kube-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-nodeport
  namespace: kube-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: gateway-nodeport
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kubectl
          image: registry.k8s.io/kubectl:v1.37.1
          args:
            - -n
            - kube-system
            - patch
            - svc
            - cilium-gateway-doany
            - --type=json
            - -p
            - '[{"op":"replace","path":"/spec/ports/0/nodePort","value":80},{"op":"replace","path":"/spec/ports/1/nodePort","value":443}]'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
