# Cilium Gateway(Gateway API)。Traefik と並走させ、HTTPRoute を 1 つずつ移す。
# 証明書は cert-manager が ClusterIssuer letsencrypt(Cloudflare DNS-01)で発行する。
# ワイルドカードなのでホストを足すたびに証明書を増やさなくてよい。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: doany-wildcard
  namespace: kube-system
spec:
  secretName: doany-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - doany.io
    - "*.doany.io"
---
# `sub`(*.s.doany.io)は 2 段のワイルドカードなので上の証明書では覆えない。別に発行する。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: doany-sub-wildcard
  namespace: kube-system
spec:
  secretName: doany-sub-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.s.doany.io"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: doany
  namespace: kube-system
spec:
  gatewayClassName: cilium
  listeners:
    # HTTP は全部 HTTPS に飛ばす(Traefik の redirect-https ミドルウェアの置き換え)。
    # 実際のリダイレクトは apps/gateway-routes/redirect-https.yaml の HTTPRoute フィルタが行う。
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # `*.doany.io` は 1 段だけなので apex は別リスナーが要る(証明書は同じ)。
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.doany.io"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: doany-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    # *.s.doany.io(SSO 付きで LAN のホストへ中継)。証明書は 2 段目のワイルドカード。
    - name: https-sub
      protocol: HTTPS
      port: 443
      hostname: "*.s.doany.io"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: doany-sub-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-apex
      protocol: HTTPS
      port: 443
      hostname: doany.io
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: doany-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
