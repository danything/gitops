# Let's Encrypt を Cloudflare の DNS-01 で。Traefik 内蔵 ACME(mydnschallenge)の置き換え先。
# トークンは Traefik と同じ Secret を cert-manager の namespace にも置く必要がある
# (cert-manager は自分の namespace の Secret しか読めない)。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@doany.io
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: CF_DNS_API_TOKEN
