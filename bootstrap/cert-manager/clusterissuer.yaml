# Let's Encrypt を Cloudflare の DNS-01 で。ワイルドカード証明書を取るので DNS-01。
# トークンは同じ namespace の Secret にしか置けない(cert-manager は自分の namespace の
# Secret しか読まない)ので、cloudflare-secret.yaml がここに置いている。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@doany.io
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: CF_DNS_API_TOKEN
