# cert-manager の Helm 値。版は [version.yaml](version.yaml)。
#
# 当てるのは [../../talos/render.sh](../../talos/render.sh)。この値で `helm template` して
# machine config の inlineManifest にする(Cilium と同じ。更新は render.sh → apply-config → upgrade-k8s)。
#
# 2026-09-08 まで版も値も git に無かった(`helm install` した一度きり)。
# 作り直すと下の `enableGatewayAPI` が既定(false)に戻り、証明書が 1 枚も発行されなくなる。

# Gateway API を見る。これが無いと Gateway の `cert-manager.io/cluster-issuer`
# 注釈から Certificate を作ってくれない。
config:
  enableGatewayAPI: true

# CRD は chart から描かせない。6 つで 1.30 MB あり、描き出しの 97%。
# render.sh が `KubeExternalManifestConfig` で URL を渡す(argocd・gateway-api と同じ手)。
# なぜ URL なのかは [../../docs/decisions.md](../../docs/decisions.md)「層の分け方」。
crds:
  enabled: false
