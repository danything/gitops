# The Entra client secret ArgoCD's OIDC login uses, as a Secret ArgoCD can
# reference from argocd-cm ($argocd-oidc:client-secret in helmchart.yaml).
# The label is what lets argocd-server read it. Only the login depends on
# this: syncing runs on the GitHub App credential that stays plaintext in
# helmchart.yaml, so Infisical being down never blocks its own recovery.
# Applied by hand like the rest of this directory (the apps Application only
# syncs repos.yaml).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /argocd/argocd-oidc
        recursive: false
  managedKubeSecretReferences:
    - secretName: argocd-oidc
      secretNamespace: argocd
      # Orphan: CR を消しても Secret は残す（移行や再作成で稼働中の Pod を巻き込まない）
      creationPolicy: Orphan
      template:
        # includeAllSecrets が無いと template がフォルダの中身を捨てて空の Secret になる
        includeAllSecrets: true
        metadata:
          labels:
            app.kubernetes.io/part-of: argocd
