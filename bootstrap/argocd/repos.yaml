# **Forgejo 側は別の ApplicationSet(下の `repos-forgejo`)に分けてある(2026-10-05)。**
# ApplicationSet は generator が 1 つでも失敗すると**全体の Application を 1 本も作らず**
# 戻る(argo-cd の applicationset_controller.go: `GenerateApplications` がエラーを返したら
# 生成も更新もせずに requeue)。まっさらなクラスタでは Forgejo はまだ空で、読むための
# `forgejo-repo-creds` も無い(それを当てるのは **このリポジトリの Application** ──
# apps/forgejo/argocd-creds.yaml)。同じ ApplicationSet に同居させていると、gitea 側が落ちて
# このリポジトリ自身の Application も作られず、Forgejo もデプロイされないので**自力で抜けられない**。
# 分けておけば GitHub 側が先に全部立ち、Forgejo が戻った時点で下が追いつく。
# 2 つの template は同じ形を保つこと(片方だけ直すとアプリの扱いが Git の置き場で変わる)。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: repos
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    # Every key referenced below has to exist in the repo's argocd.yaml.
    # A missing or misspelled one fails the generator loudly instead of
    # rendering an Application with an empty name or path.
    - missingkey=error
  generators:
    # Two steps: find the repos, then let each repo describe itself.
    #   1. scmProvider walks the danything org and keeps repos that carry a
    #      deploy/argocd.yaml (this replaces the "argocd" GitHub topic
    #      that the deleted sync-webhooks.sh used to look for).
    #   2. git reads that file out of the repo, and its keys become the
    #      template parameters below.
    # Adding an app is therefore "push manifests + deploy/argocd.yaml to a new repo".
    # This file is the one piece that isn't decided per-repo, because it's the
    # rule for *finding* the repos -- it can't live in the repos it finds.
    - matrix:
        generators:
          - scmProvider:
              cloneProtocol: https
              github:
                organization: danything
                # Default branch only. allBranches: true would produce one
                # Application per branch, which is for preview environments.
                allBranches: false
                # The GitHub App repo-creds ArgoCD already uses to clone
                # danything/*, reused for the org API scan -- so there's no
                # second credential to create, no anonymous 60 req/hr ceiling
                # (this scan runs every 3 minutes), and worklog-cloud doesn't
                # go invisible for being private.
                appSecretName: creds-2776534691
              filters:
                - pathsExist:
                    - deploy/argocd.yaml
          - git:
              repoURL: '{{ .url }}'
              revision: '{{ .branch }}'
              files:
                - path: deploy/argocd.yaml
  # generator の結果から repo が消えても(改名の途中、一時的な API エラー)、Application は消しても
  # その中の実リソース(Deployment や PVC)は道連れにしない。
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      # Declared per-repo rather than derived from the repo name, because the
      # hand-made Applications don't match their repos (denpa -> epg,
      # worklog-cloud -> worklog). Keeping the existing
      # names lets the controller adopt them in place -- it adds its
      # ownerReference to the Application that's already there instead of
      # standing up a second one fighting over the same resources.
      name: '{{ .name }}'
    spec:
      project: default
      source:
        repoURL: '{{ .url }}'
        targetRevision: '{{ .branch }}'
        path: '{{ .sourcePath }}'
        directory:
          include: '*.yaml'
          # gitops keeps its manifests at the repo root (sourcePath: .,
          # recurse: true), so its deploy/argocd.yaml ends up inside the synced
          # path one level down; without this the sync fails on a document
          # with no apiVersion/kind.  matches it there and at top level for
          # any repo whose sourcePath is the same directory argocd.yaml lives in.
          # bootstrap/ も外す。gitops repo は同期対象を apps/ に絞っているので通常は当たらないが、
          # sourcePath が `.` の瞬間(移行中や設定ミス)に SOPS 暗号化済みの bootstrap/*.yaml を
          # そのまま apply してしまうと Secret を壊すため、二重に防ぐ。
          # `_` で始まるディレクトリも外す。用意はしたが動かしていないアプリを、置き場を変えずに
          # 寝かせておくため (例: apps/_glitchtip/)。動かすときは `_` を外して git mv するだけ。
          # 照らすのは sourcePath からの相対パスで、gobwas/glob を区切り無しで使う (`*` も `/` を
          # 跨ぐ) ので、`**/_*/**` は頭に `/` が要り、いちばん上の `_glitchtip/…` には当たらない。
          # そのために `_*/**` も並べる
          exclude: '{**/argocd.yaml,bootstrap/**,_*/**,**/_*/**}'
      destination:
        server: https://kubernetes.default.svc
        # Empty for a repo whose manifests span several namespaces, which is
        # fine because every manifest in these repos carries its own.
        namespace: '{{ .namespace }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        # CRD を入れる Application より先に同期しにいったものは、既定の 5 回で諦めて
        # OutOfSync のまま止まる(refresh=hard では戻らない。ドリル 5 回目で踏んだ)。
        # backoff を伸ばして自力で戻るようにする。15s から倍々で上限 5 分、10 回で約 33 分。
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
  # These four live in the patch rather than in template because plain
  # templating only substitutes strings, and they're booleans.
  templatePatch: |
    spec:
      source:
        directory:
          recurse: {{ .recurse }}
      syncPolicy:
        automated:
          enabled: {{ .autoSync }}
          prune: {{ .prune }}
          selfHeal: {{ .selfHeal }}
---
# Forgejo(fj.doany.io)の doa を見る。上の `repos` と分けている理由は上のコメント。
# **ここが失敗していても上の `repos` は止まらない。** 失敗中は
# `kubectl -n argocd get applicationset repos-forgejo -o yaml` の `ErrorOccurred` に理由が出る。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: repos-forgejo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    # 同じ形で Forgejo(fj.doany.io)の doa(2026-09-16 に danything から改名)も見る。
    # **改名したら必ずここを直す。** 旧名のままだと Forgejo が 307 を返し、ArgoCD の
    # git クライアントはリダイレクトを追わないので、対象のアプリが丸ごと Unknown で止まる。
    # あわせて Infisical /argocd/forgejo-repo-creds の url も直すこと(repo-creds は URL の
    # 接頭辞で照合するため、ずれると資格情報が付かない)。**プライベートのリポジトリは GitHub に置かず
    # Forgejo にだけ置く**方針(2026-09-15。GitHub Actions の課金はプライベートにだけ掛かる)。
    # Forgejo の API は Gitea と同じなので gitea の scmProvider で読める。
    # 読むための資格情報は apps/forgejo/argocd-creds.yaml(Infisical から)。scan と clone の両方に使う。
    # **同じリポジトリが GitHub と Forgejo の両方にあると Application 名がぶつかる**(上の `repos` と
    # 同じ Application を取り合い、所有者の食い違いで片方が ErrorOccurred になる)。
    # 移すときは GitHub 側を消してから(apps/forgejo/README.md)。
    - matrix:
        generators:
          - scmProvider:
              cloneProtocol: https
              gitea:
                owner: doa
                api: https://fj.doany.io/
                allBranches: false
                tokenRef:
                  secretName: forgejo-repo-creds
                  key: password
              filters:
                - pathsExist:
                    - deploy/argocd.yaml
          - git:
              repoURL: '{{ .url }}'
              revision: '{{ .branch }}'
              files:
                - path: deploy/argocd.yaml
  # generator の結果から repo が消えても(改名の途中、一時的な API エラー)、Application は消しても
  # その中の実リソース(Deployment や PVC)は道連れにしない。
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      # Declared per-repo rather than derived from the repo name, because the
      # hand-made Applications don't match their repos (denpa -> epg,
      # worklog-cloud -> worklog). Keeping the existing
      # names lets the controller adopt them in place -- it adds its
      # ownerReference to the Application that's already there instead of
      # standing up a second one fighting over the same resources.
      name: '{{ .name }}'
    spec:
      project: default
      source:
        repoURL: '{{ .url }}'
        targetRevision: '{{ .branch }}'
        path: '{{ .sourcePath }}'
        directory:
          include: '*.yaml'
          # gitops keeps its manifests at the repo root (sourcePath: .,
          # recurse: true), so its deploy/argocd.yaml ends up inside the synced
          # path one level down; without this the sync fails on a document
          # with no apiVersion/kind.  matches it there and at top level for
          # any repo whose sourcePath is the same directory argocd.yaml lives in.
          # bootstrap/ も外す。gitops repo は同期対象を apps/ に絞っているので通常は当たらないが、
          # sourcePath が `.` の瞬間(移行中や設定ミス)に SOPS 暗号化済みの bootstrap/*.yaml を
          # そのまま apply してしまうと Secret を壊すため、二重に防ぐ。
          # `_` で始まるディレクトリも外す。用意はしたが動かしていないアプリを、置き場を変えずに
          # 寝かせておくため (例: apps/_glitchtip/)。動かすときは `_` を外して git mv するだけ。
          # 照らすのは sourcePath からの相対パスで、gobwas/glob を区切り無しで使う (`*` も `/` を
          # 跨ぐ) ので、`**/_*/**` は頭に `/` が要り、いちばん上の `_glitchtip/…` には当たらない。
          # そのために `_*/**` も並べる
          exclude: '{**/argocd.yaml,bootstrap/**,_*/**,**/_*/**}'
      destination:
        server: https://kubernetes.default.svc
        # Empty for a repo whose manifests span several namespaces, which is
        # fine because every manifest in these repos carries its own.
        namespace: '{{ .namespace }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        # CRD を入れる Application より先に同期しにいったものは、既定の 5 回で諦めて
        # OutOfSync のまま止まる(refresh=hard では戻らない。ドリル 5 回目で踏んだ)。
        # backoff を伸ばして自力で戻るようにする。15s から倍々で上限 5 分、10 回で約 33 分。
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
  # These four live in the patch rather than in template because plain
  # templating only substitutes strings, and they're booleans.
  templatePatch: |
    spec:
      source:
        directory:
          recurse: {{ .recurse }}
      syncPolicy:
        automated:
          enabled: {{ .autoSync }}
          prune: {{ .prune }}
          selfHeal: {{ .selfHeal }}
