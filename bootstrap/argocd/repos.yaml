# Forgejo 側は別の ApplicationSet(下の `repos-forgejo`)に分ける。generator が 1 つでも失敗すると
# Application を 1 本も作らないので、まっさらなクラスタ(Forgejo も forgejo-repo-creds もまだ無い)で
# 同居させると自力で抜けられない。2 つの template は同じ形を保つこと。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: repos
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    # argocd.yaml にキーが欠けたら、空の名前で描かずに落とす
    - missingkey=error
  generators:
    # deploy/argocd.yaml を持つリポジトリを探し、そのファイルのキーを template の引数にする
    - matrix:
        generators:
          - scmProvider:
              cloneProtocol: https
              github:
                organization: danything
                allBranches: false
                # clone と同じ GitHub App(匿名だと 60 req/h の上限と、private が見えない)
                appSecretName: creds-2776534691
              filters:
                - pathsExist:
                    - deploy/argocd.yaml
          - git:
              repoURL: '{{ .url }}'
              revision: '{{ .branch }}'
              files:
                - path: deploy/argocd.yaml
  # generator から repo が一時的に消えても、実リソース(PVC など)は道連れにしない
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      project: default
      source:
        repoURL: '{{ .url }}'
        targetRevision: '{{ .branch }}'
        path: '{{ .sourcePath }}'
        directory:
          include: '*.yaml'
          # argocd.yaml は manifest でない。bootstrap/ は sourcePath が `.` になったとき SOPS 済みを当てない保険。
          # `_` で始まるディレクトリは寝かせているアプリ。`*` は `/` も跨ぐが `**/_*/**` は頭の `/` が要るので
          # `_*/**` も並べる
          exclude: '{**/argocd.yaml,bootstrap/**,_*/**,**/_*/**}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        # CRD より先に同期したものは既定の 5 回で諦めて止まる(refresh=hard でも戻らない)。約 33 分まで粘る
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
  # 真偽値は template では文字列になるので patch で入れる
  templatePatch: |
    spec:
      source:
        directory:
          recurse: {{ .recurse }}
      syncPolicy:
        automated:
          enabled: {{ .autoSync }}
          prune: {{ .prune }}
          selfHeal: {{ .selfHeal }}
---
# bootstrap/ の平文のマニフェスト(Gateway・auth・ClusterIssuer・InfisicalSecret など)。
# machine config が持つもの(値・版・SOPS・Namespace・apiserver/・cilium/)と、`apps` が持つこのファイルは外す。
# `*` は `/` もまたぐ。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/danything/gitops.git
    targetRevision: main
    path: bootstrap
    directory:
      recurse: true
      exclude: '{*values.yaml,*version.yaml,*.sops.yaml,apiserver/*,cilium/*,argocd/repos.yaml,argocd/namespace.yaml,cert-manager/namespace.yaml,infisical/namespace.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # InfisicalSecret の CRD は別の Application が入れるので、まっさらなクラスタでは最初は落ちる
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
---
# Forgejo(fj.doany.io)の doa を見る。失敗の理由は `get applicationset repos-forgejo -o yaml` の ErrorOccurred。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: repos-forgejo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    # owner を改名したら必ずここと Infisical /argocd/forgejo-repo-creds の url を直す
    # (Forgejo の 307 を ArgoCD は追わず、repo-creds は URL の接頭辞で照合する)。
    # 同じリポジトリが GitHub にもあると Application 名がぶつかる。移すときは GitHub 側を消してから。
    - matrix:
        generators:
          - scmProvider:
              cloneProtocol: https
              gitea:
                owner: doa
                api: https://fj.doany.io/
                allBranches: false
                tokenRef:
                  secretName: forgejo-repo-creds
                  key: password
              filters:
                - pathsExist:
                    - deploy/argocd.yaml
          - git:
              repoURL: '{{ .url }}'
              revision: '{{ .branch }}'
              files:
                - path: deploy/argocd.yaml
  # ここから下は上の `repos` と同じ。直すときは両方そろえる
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      project: default
      source:
        repoURL: '{{ .url }}'
        targetRevision: '{{ .branch }}'
        path: '{{ .sourcePath }}'
        directory:
          include: '*.yaml'
          exclude: '{**/argocd.yaml,bootstrap/**,_*/**,**/_*/**}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
  templatePatch: |
    spec:
      source:
        directory:
          recurse: {{ .recurse }}
      syncPolicy:
        automated:
          enabled: {{ .autoSync }}
          prune: {{ .prune }}
          selfHeal: {{ .selfHeal }}
