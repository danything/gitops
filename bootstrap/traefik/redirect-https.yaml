# http -> https のリダイレクト。
#
# 以前は web エントリポイント自体に redirections を付けていたが、それだと
# ルータに入る手前で全ホストが飛ばされ、ルート単位で外せない。
# LAN 内向けの平文の口 (dp.home.arpa など、公開ドメインではないので ACME で
# 証明書を取れないもの) が作れなくなるため、doany.io 系だけを飛ばす形にした。
#
# priority を上げているのは、各アプリの Ingress が web にもルータを作るため。
# 既定の優先度はルールの長さで決まるので、明示しないと取りこぼす。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: kube-system
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redirect-https
  namespace: kube-system
spec:
  entryPoints:
    - web
  routes:
    # doany.io と *.doany.io だけ。これ以外は平文のまま各ルータへ渡す
    - match: HostRegexp(`^(.+\.)?doany\.io$`)
      kind: Rule
      priority: 1000
      middlewares:
        - name: redirect-https
      # ミドルウェアが必ず 301 を返すのでここへは届かない。
      # ルータには service が要るので、常に存在する traefik 自身を置いている
      services:
        - name: traefik
          port: 80
