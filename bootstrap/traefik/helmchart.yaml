apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  values:
    # ServiceLB(k3s 組み込み)をやめたので、ノードの全アドレス(bond0 の v4/v6 と eno4)で
    # 受けるために hostPort を持つ。Talos には ServiceLB 相当が無いので、この形が移行先でもそのまま使える。
    # IPv6 のプレフィックスは RA 由来で変わりうるため、externalIPs に固定で書かず hostPort に寄せている。
    ports:
      web:
        hostPort: 80
      websecure:
        hostPort: 443
    service:
      spec:
        externalIPs:
          - 10.10.0.4
        externalTrafficPolicy: Local
    envFrom:
      - secretRef:
          name: traefik-cloudflare
    deployment:
      # hostPort を持つので RollingUpdate だと新旧の Pod がポートを奪い合って新しい方が Pending になる。
      # DaemonSet なら古い Pod を落としてから作るので単一ノードでも詰まらない。
      kind: DaemonSet
      additionalVolumes:
        - name: traefik-acme
          persistentVolumeClaim:
            claimName: traefik-acme
    additionalVolumeMounts:
      - name: traefik-acme
        mountPath: /data/acme.json
        subPath: acme.json
    certificatesResolvers:
      mydnschallenge:
        acme:
          email: admin@doany.io
          storage: /data/acme.json
          dnsChallenge:
            provider: cloudflare
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    logs:
      access:
        enabled: true