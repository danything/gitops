apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  values:
    service:
      spec:
        externalIPs:
          - 10.10.0.4
        externalTrafficPolicy: Local
    envFrom:
      - secretRef:
          name: traefik-cloudflare
    deployment:
      additionalVolumes:
        - name: traefik-acme
          persistentVolumeClaim:
            claimName: traefik-acme
    additionalVolumeMounts:
      - name: traefik-acme
        mountPath: /data/acme.json
        subPath: acme.json
    certificatesResolvers:
      mydnschallenge:
        acme:
          email: admin@doany.io
          storage: /data/acme.json
          dnsChallenge:
            provider: cloudflare
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    logs:
      access:
        enabled: true