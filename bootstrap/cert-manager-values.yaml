# chart と版。Renovate が上げ、render.sh が読む(README.md「Helm で入れるもの」)。
# renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
# version: v1.21.3
# cert-manager の chart の値。描いて machine config に載せるのは render.sh。

# 無いと Gateway の `cert-manager.io/cluster-issuer` 注釈から Certificate を作らず、証明書が 1 枚も出ない
config:
  enableGatewayAPI: true

# CRD は描かせない(1.30 MB で描き出しの 97%)。render.sh が URL で渡す。
crds:
  enabled: false
