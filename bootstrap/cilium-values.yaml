# chart と版。Renovate が上げ、render.sh が読む(README.md「Helm で入れるもの」)。
# renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io
# version: 1.20.4
# Cilium の値の正本。render.sh が描いて inlineManifest にする(render.sh → apply-config → upgrade-k8s)。
# cilium-config を直接いじらない(次の upgrade-k8s で黙って戻る)。

# kube-proxy は talos.sops.yaml で止めている
kubeProxyReplacement: true
# KubePrism。Talos が localhost:7445 で API サーバを負荷分散する。違うと Cilium が上がらない(render.sh の needle が見ている)。
k8sServiceHost: localhost
k8sServicePort: 7445

# Talos は cgroup を自分で用意する。自動マウントさせると衝突する。
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

ipam:
  mode: kubernetes
ipv6:
  enabled: true

# 送信元 IP を保つ。無いと hostPort に来る IPv4 の送信元が cilium_host に潰れる
# (NetBird の STUN が外側アドレスを誤って返す、AdGuard のクライアント別ルールが効かない、など)。
bpf:
  masquerade: true

# 既定はどれも無効。無いと Pod は Running なのにホストのポートに何も来ない(確認は `cilium-dbg service list`)。
hostPort:
  enabled: true
externalIPs:
  enabled: true
nodePort:
  enabled: true
  # 範囲は既定のまま。広げないこと: 範囲に入る hostPort を Cilium は張らない(853・8443・3129 が一斉に落ちた)。

# Gateway API。CRD が古いと GatewayClass が無言で止まる。
gatewayAPI:
  enabled: true
  # Envoy がノードの 80/443 に直接 bind する(Service は NodePort になるが、値は経路に関係しない)。
  # ポートの指定は無い。httpPort などは ingressController.hostNetwork 側の項目。
  hostNetwork:
    # 下の envoy.securityContext とセット。無いと 80/443 の bind が Permission denied で公開 Web が全部落ちる。
    #   確認: kubectl -n kube-system exec ds/cilium-envoy -- grep CapEff /proc/7/status → 0000000000000400
    enabled: true
  # gRPC に要る(無いと ALPN で h2 を広告せず、NetBird のピアが `missing selected ALPN property` で繋がらない)。
  # 全リスナーが HTTP/2 になるが、WebSocket はブラウザが HTTP/1.1 に落ちるので動く。
  enableAlpn: true

# UI 自身は認証を持たない。前段の oauth2-proxy(../deploy/auth/hubble-proxy.yaml)で守る。UI の Service を直接 HTTPRoute に繋がない。
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
  # 証明書はクラスタ内の CronJob が作る。既定の `helm` は描くたびに作り直し、machine config に秘密鍵が載る。
  tls:
    auto:
      method: cronJob

# 特権ポートの bind。cilium-envoy-starter が fork 後に capability を落とすので keepCapNetBindService も要る。
# 既定の NET_ADMIN / SYS_ADMIN を消さないよう両方書く。
envoy:
  securityContext:
    capabilities:
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE
      keepCapNetBindService: true

securityContext:
  privileged: true
operator:
  replicas: 1
