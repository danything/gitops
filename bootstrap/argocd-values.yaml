# chart と版。Renovate が上げ、render.sh が読む(README.md「Helm で入れるもの」)。
# renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
# version: 10.11.6
# argo-cd の chart の値。秘密の値は argocd-secret-values.sops.yaml。描いて machine config に載せるのは render.sh。
# CRD は描かせない(1.83 MB で描き出しの 95%)。render.sh が URL で渡す。
crds:
    install: false
# 既定の ecr-public は匿名の取得が絞られて ImagePullBackOff になる。mirror.gcr.io は Docker Hub のキャッシュ。
# 上書きしたので chart に付いてこない。chart を上げる PR ではこの tag を新しい chart の既定と見比べる。
redis:
    image:
        repository: mirror.gcr.io/library/redis
        tag: 8.10.3-alpine
# Dex を使わず Entra ID に直接 OIDC(auth/deployment.yaml と同じアプリ登録)
dex:
    enabled: false
configs:
    params:
        # TLS は Gateway で終端する(二重 TLS のリダイレクトループを避ける)
        server.insecure: true
    cm:
        url: https://ac.doany.io
        # ローカルの admin は使わない。chart の既定 admin.enabled: true も上書きする
        accounts.admin.enabled: "false"
        admin.enabled: "false"
        oidc.config: |
            name: Microsoft Entra ID
            issuer: https://login.microsoftonline.com/22ac977d-b140-4dc8-8150-90d645d3475b/v2.0
            clientID: b0fa498f-7e6a-4fe1-a1c6-16fbbb6f397e
            # Secret argocd-oidc, built by oidc-secret.yaml from Infisical.
            clientSecret: $argocd-oidc:client-secret
            requestedScopes:
              - openid
              - profile
              - email
        # Secret は管理対象から外す。Infisical operator の Secret は CR の tracking-id がコピーされ、
        # 外さないと sync で prune される。
        resource.exclusions: |
            - apiGroups: [""]
              kinds: ["Secret"]
              clusters: ["*"]
    rbac:
        policy.default: role:readonly
        policy.csv: |
            g, admin, role:admin
        scopes: '[roles, email]'
notifications:
    secret:
        # helm の空の Secret が外で管理する argocd-notifications-secret と取り合う
        create: false
    # 通知の設定は chart が argocd-notifications-cm を描き直すのでここに書く(別に当てると消える)。
    # notifiers は secret-values.sops.yaml。送り先は Matrix の hookshot だが、名前は mattermost のまま
    # (テンプレートと subscriptions が参照している)。
    templates:
        template.app-sync-result: "webhook:\n  mattermost:\n    method: POST\n    body: |\n      {\"text\": \"[ArgoCD] {{.app.metadata.name}}: {{.app.status.operationState.phase}} {{if eq .app.status.operationState.phase \"Succeeded\"}}✅{{else if eq .app.status.operationState.phase \"Running\"}}\U0001F680{{else}}❌{{end}} ({{now | date \"2006-01-02 15:04:05\"}})\"}\n"
        template.app-health-status: "webhook:\n  mattermost:\n    method: POST\n    body: |\n      {\"text\": \"[ArgoCD] {{.app.metadata.name}}: {{.app.status.health.status}} {{if eq .app.status.health.status \"Healthy\"}}\U0001F49A{{else if eq .app.status.health.status \"Progressing\"}}\U0001F504{{else if eq .app.status.health.status \"Degraded\"}}\U0001F494{{else if eq .app.status.health.status \"Suspended\"}}⏸️{{else if eq .app.status.health.status \"Missing\"}}❓{{else}}❔{{end}} ({{now | date \"2006-01-02 15:04:05\"}})\"}\n"
    triggers:
        # oncePer で revision ごとに 1 回。Error/Failed は毎回
        trigger.on-sync-result: |
            - when: app.status.operationState.phase == 'Running'
              oncePer: app.status.sync.revision
              send: [app-sync-result]
            - when: app.status.operationState.phase in ['Error', 'Failed']
              send: [app-sync-result]
            - when: app.status.operationState.phase == 'Succeeded'
              oncePer: app.status.sync.revision
              send: [app-sync-result]
        # Healthy は on-sync-result の Succeeded で足りる
        trigger.on-health-change: |
            - when: app.status.health.status == 'Progressing'
              oncePer: app.status.sync.revision
              send: [app-health-status]
            - when: app.status.health.status in ['Degraded', 'Suspended', 'Missing', 'Unknown']
              send: [app-health-status]
    subscriptions:
        - recipients:
            - mattermost
          triggers:
            - on-sync-result
            - on-health-change
# ArgoCD が自分を管理し始める種。chart は各要素を `tpl` に通すので、Go テンプレートを含むもの
# (ApplicationSet)は repos.yaml に置く。
extraObjects:
    # danything/* を読む GitHub App の repo-creds(git から取れないのでここに置く)。名前は UI で作ったときのもの。
    # 鍵は argocd-secret-values.sops.yaml。リストは値ファイルを重ねると丸ごと置き換わるので、map を toYaml して 1 要素にする。
    - '{{ toYaml .Values.githubAppRepoCreds }}'
    # app-of-apps。include を広げると bootstrap/ の他のファイルまで prune/selfHeal の対象になり、消すと ArgoCD が消える。
    - apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: apps
        namespace: argocd
      spec:
        project: default
        source:
            repoURL: https://github.com/danything/gitops.git
            targetRevision: main
            path: bootstrap/argocd
            directory:
                include: repos.yaml
        destination:
            server: https://kubernetes.default.svc
            namespace: argocd
        syncPolicy:
            automated:
                prune: true
                selfHeal: true
githubAppRepoCreds:
    apiVersion: v1
    kind: Secret
    metadata:
        name: creds-2776534691
        namespace: argocd
        labels:
            argocd.argoproj.io/secret-type: repo-creds
    type: Opaque
    stringData:
        url: https://github.com/danything
        githubAppID: "4434943"
        githubAppInstallationID: "150067651"
        # githubAppPrivateKey は secret-values.sops.yaml
