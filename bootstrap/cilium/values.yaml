# **Cilium の Helm 値。これがクラスタの土台。**
#
# **これまで git に無かった(2026-09-07 に取り込んだ)。** 入れたのは手で `helm install` した
# ときの一度きりで、以後の調整は `cilium-config` の ConfigMap を直接いじって当てていた。
#
# ## **`helm upgrade` する前に必ずここを読むこと**
#
# ConfigMap を直接いじった設定は Helm のリリースに記録されていない。つまり
# **素で `helm upgrade` すると黙って元に戻り、外向きの通信が壊れる。**
# 実際に記録から漏れていたのは次の 2 つ(2026-09-07 に確認):
#
# | 設定 | live の ConfigMap | Helm の values(当時) | 戻ると何が起きるか |
# | --- | --- | --- | --- |
# | `node-port-range` | `80,443` | 無し | Gateway の Service は 80/443 を固定の nodePort で持っている。既定の 30000-32767 に戻ると割り当てが無効になり、**公開している Web が全部落ちる** |
# | `enable-l2-announcements` | `true` | 無し | LB-IPAM の 10.10.0.53 が ARP に応答しなくなる |
#
# **このファイルはその 2 つを含んだ「あるべき値」。** 以後の変更はここを直してから
#
#   helm upgrade cilium cilium/cilium --version 1.20.1 -n kube-system -f bootstrap/cilium/values.yaml
#
# で当てる。ConfigMap は直接いじらない。
#
# ## Talos に移るときに変わるところ
#
# - `k8sServiceHost` / `k8sServicePort` は KubePrism の `localhost:7445` になる
# - `cgroup.autoMount.enabled: false` と `cgroup.hostRoot: /sys/fs/cgroup` を足す
# (../docs/decisions.md)

# kube-proxy は使わない(k3s 側で disable-kube-proxy)。
kubeProxyReplacement: true
# k3s の API サーバはノード上に居るので loopback で足りる。
k8sServiceHost: 127.0.0.1
k8sServicePort: 6443

ipam:
  mode: kubernetes
ipv6:
  enabled: true

# **送信元 IP を保つのに要る(2026-09-07)。** 既定は iptables で SNAT していて、
# **hostPort に入ってくる IPv4 の送信元が cilium_host(10.42.0.148)に潰れていた。**
# IPv6 は素通りしていたので気づきにくい。実害:
#
# | | |
# | --- | --- |
# | NetBird の STUN(3478) | 外側アドレスを誤って返す → **IPv4 の NAT 越えが成立せず relay 専用に落ちる** |
# | AdGuard(53/853) | IPv4 クライアントのクエリログとクライアント別ルールが効かない |
# | 3proxy(3129/8444)・Mattermost calls(8443) | 送信元が全部同じに見える |
#
# `kubeProxyReplacement: true` と組み合わせるときの推奨設定でもある。
bpf:
  masquerade: true

# **既定はどれも無効。** 有効にしないと Pod は Running なのにホストのポートに何も来ない
# (eBPF なので `ss` にも現れない。確認は `cilium-dbg service list`)。
hostPort:
  enabled: true
externalIPs:
  enabled: true
nodePort:
  enabled: true
  # **80 と 443 だけ。** Gateway の Service にこの 2 つを固定で割り当てている。
  # 範囲を広げると、その中に入る hostPort を Cilium が張らなくなる
  # (AdGuard の 853、Mattermost calls の 8443、3proxy の 3129 が一斉に落ちた)。
  range: "80,443"

# Gateway API。CRD は v1.6.1 が要る(v1.5.1 だと GatewayClass が無言で止まる)。
gatewayAPI:
  enabled: true
  # **Envoy をホストネットワークで待たせる(2026-09-07)。** LoadBalancer Service も
  # nodePort も介さず、ノードの 80/443 に直接 bind する。
  #
  # ## なぜ変えたか
  #
  # 以前は Service の nodePort を **手で 80/443 に当てて**いた。Cilium は手で入れた
  # nodePort を上書きしないので動いてはいたが、**git にもどこにも書けない状態**だった
  # (`CiliumGatewayClassConfig.spec.service` にポート番号の項目が無い)。
  # 復元リハーサルで実際に壊れた ── Cilium が Service を作り直して 31024/30229 になり、
  # **ノード IP 経由の公開 Web が全部死んだ**(docs/restore-drill.md)。
  #
  # hostNetwork なら**この値ごと git に入る**ので、復元しても再現される。
  #
  # ## 経路が変わらないことの確認(2026-09-07 実測)
  #
  # | 経路 | 前 | 後 |
  # | --- | --- | --- |
  # | 外部(router → 10.0.0.2:443) | nodePort | ノード IP なのでそのまま |
  # | LAN(10.10.0.4:443。AdGuard の *.l.doany.io はここを指す) | nodePort | そのまま |
  # | 10.10.0.53(LB-IPAM) | 200 | **無くなる** ── 参照はドキュメントの中だけだった |
  #
  # **ポートの指定は無い。** Gateway のリスナー(80 / 443)がそのままホストに bind される。
  # `httpPort` / `httpsPort` / `sharedListenerPort` は `ingressController.hostNetwork`
  # 側の項目で、こちらには無い(値の見た目が似ているので混同しやすい)。
  #
  # **Service は消えず NodePort になる**(`operator/pkg/model/translation/gateway-api/translator.go`
  # の `toServiceType`: `if HostNetworkConfig.Enabled { return ServiceTypeNodePort }`)。
  # 割り当てられるポートはランダムだが、**実通信はそこを通らない**ので気にしなくてよい。
  # 効果として **LoadBalancer が 1 つも無くなる**ので、LB-IPAM と L2 アナウンスを外せる。
  hostNetwork:
    # **下の envoy.securityContext とセット。** 80/443 は特権ポートなので、
    # NET_BIND_SERVICE が無いと `cannot bind '0.0.0.0:80': Permission denied` で
    # **公開 Web が全部落ちる**(2026-09-07 に実際にやった)。
    # 実際に付いていることは fork 後のプロセスで確認する:
    #   kubectl -n kube-system exec ds/cilium-envoy -- grep CapEff /proc/7/status
    #   → 0000000000000400 (CAP_NET_BIND_SERVICE のみ。starter が他を落とす)
    enabled: true
  # **gRPC を通すのに要る(2026-09-07)。** 既定は false で、その場合 Envoy は TLS の
  # ALPN で `h2` を広告しない。grpc-go のクライアントは ALPN の合意を必須にしているので、
  # NetBird のピアが `missing selected ALPN property` で管理サーバに繋げなかった。
  #
  # 有効にすると全リスナーが「HTTP/2 を試して、駄目なら HTTP/1.1」を広告する。
  # つまり**ブラウザからの既存サイトも HTTP/2 になる**。WebSocket は HTTP/2 上では
  # 拡張 CONNECT が要るが、ブラウザはそれが使えなければ HTTP/1.1 の別接続に落ちるので
  # Mattermost・ArgoCD・Infisical はそのまま動く(適用後に実際に確認した)。
  #
  # チャートの注記どおり appProtocol サポートも一緒に有効になるが、
  # **このクラスタに appProtocol を宣言している Service は 1 つも無い**ので影響しない。
  enableAlpn: true

# LB-IPAM が払い出したアドレスを LAN に知らせる。**ConfigMap に入れるだけでは効かない** —
# cilium エージェント(DaemonSet)の再起動が要る。
l2announcements:
  enabled: true

# **クラスタ内の通信を見る画面。** Cilium 本体の hubble は元から有効(:4244 で待ち受け)で、
# 足りていなかったのは Relay と UI の 2 Pod だけ。
#
# **UI 自身は認証を持たない。** oauth2-proxy を前段に置いて守る
# (Cilium の Gateway には ext auth が無いので、*.s.doany.io と同じ「前段プロキシ」方式。
# ../auth/hubble-proxy.yaml)。UI の Service を直接 HTTPRoute に繋がないこと。
hubble:
  relay:
    enabled: true
  ui:
    enabled: true

# **Envoy に特権ポートを bind させるための権限。** Gateway のリスナーは 80/443 で、
# hostNetwork にするとホストのその番号を直接掴む。既定の Envoy にはこの権限が無い。
#
# **2 つ要る。** コンテナに capability を渡すだけでは足りず、`cilium-envoy-starter` が
# fork 後に全部落とすので、`keepCapNetBindService` で明示的に残す必要がある
# (chart の values のコメントに書いてある)。
#
# 既定は `[NET_ADMIN, SYS_ADMIN]`。**既定を消さないよう両方書く。**
envoy:
  securityContext:
    capabilities:
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE
      keepCapNetBindService: true

securityContext:
  privileged: true
operator:
  replicas: 1
