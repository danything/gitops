# Cilium の Helm 値。これがクラスタの土台。
#
# このファイルが「あるべき値」。当てるのは talos/render.sh で、ここから `helm template` して
# machine config の inlineManifest にする(更新は render.sh → apply-config → upgrade-k8s。
# talos/README.md「上げ方 / 当て直し方」)。`cilium-config` の ConfigMap を直接いじらない ──
# 次の upgrade-k8s で黙って戻る(2026-09-07 まで値が git に無く、`node-port-range: "80,443"` が
# ConfigMap 直いじりでしか入っていなかった。戻ると公開している Web が全部落ちる)。

# kube-proxy は使わない(Talos 側は talos/patches/cni.yaml で止めている)。
kubeProxyReplacement: true
# KubePrism。Talos が localhost:7445 で API サーバを負荷分散する。
# ここが違うと Cilium が API サーバに繋げず上がらない(talos-validate が `7445` を見ている)。
k8sServiceHost: localhost
k8sServicePort: 7445

# Talos は cgroup を自分で用意する。Cilium に自動マウントさせると衝突する。
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

ipam:
  mode: kubernetes
ipv6:
  enabled: true

# 送信元 IP を保つのに要る(2026-09-07)。既定は iptables で SNAT していて、
# hostPort に入ってくる IPv4 の送信元が cilium_host(10.42.0.148)に潰れていた。
# IPv6 は素通りしていたので気づきにくい。実害:
#
# | | |
# | --- | --- |
# | NetBird の STUN(3478) | 外側アドレスを誤って返す → IPv4 の NAT 越えが成立せず relay 専用に落ちる |
# | AdGuard(53/853) | IPv4 クライアントのクエリログとクライアント別ルールが効かない |
# | 3proxy(3129/8444)・LiveKit(8443。Matrix の通話) | 送信元が全部同じに見える |
#
# `kubeProxyReplacement: true` と組み合わせるときの推奨設定でもある。
bpf:
  masquerade: true

# 既定はどれも無効。有効にしないと Pod は Running なのにホストのポートに何も来ない
# (eBPF なので `ss` にも現れない。確認は `cilium-dbg service list`)。
hostPort:
  enabled: true
externalIPs:
  enabled: true
nodePort:
  enabled: true
  # 80 と 443 だけ。Gateway の Service がこの 2 つを nodePort として握っている。
  # 範囲を広げると、その中に入る hostPort を Cilium が張らなくなる
  # (AdGuard の 853、Mattermost calls の 8443(いまは LiveKit)、3proxy の 3129 が一斉に落ちた)。
  #
  # hostNetwork にしても外せない。Service は NodePort 型のまま残り(下の
  # gatewayAPI.hostNetwork のコメント)、この 2 つの NodePort フロントエンドが
  # 経路そのものになっている。2026-09-08 に実測した。
  #
  # `cilium-dbg bpf lb list` にはこう出る:
  #
  #   10.0.0.2:80/TCP  0.0.0.0:0 (1189) [NodePort, l7-load-balancer] (L7LB Proxy Port: 80)
  #
  # Envoy は確かにホストの `0.0.0.0:80` を LISTEN しているが、そのソケットに
  # 直接来た接続は通らない。実通信は L7LB リダイレクト経由で Envoy に入る。
  # 試しに port-80 の nodePort だけ 30080 に振り直したところ、外部・LAN・Pod・ホストの
  # すべてから 80 番が死んだ(443 は無事。すぐ戻した)。
  #
  # 帰結が 3 つある:
  #
  # 1. ここと API サーバの `service-node-port-range=80-32767`(talos/patches/apiserver.yaml)は外せない
  # 2. 復元では当て直しが要る。Cilium が Service を作り直すと API サーバが
  #    範囲内のランダムな値を割り当てる。`.github/workflows/bootstrap-apply.yml` がパッチを当てる
  # 3. 副作用として、ノード自身からノードの 80/443 に繋ぐと応答が返らない。
  #    これは実害を出した(2026-09-08)。hostNetwork の Pod も「ノード自身」で、netbird のルーティングピアが
  #    `nb.doany.io:443` に繋げず `Management: Disconnected` で止まった
  #    (VPN 越しの DNS も LAN への RDP も落ちる)。あちらを hostNetwork から外して直した
  #    (apps/netbird/routing-peer.yaml)。hostNetwork の Pod を足すときは必ずこれを思い出すこと。
  range: "80,443"

# Gateway API。CRD は v1.6.1 が要る(v1.5.1 だと GatewayClass が無言で止まる)。
gatewayAPI:
  enabled: true
  # Envoy をホストネットワークで待たせる(2026-09-07)。LoadBalancer Service も
  # nodePort も介さず、ノードの 80/443 に直接 bind する。
  #
  # 何が変わったか
  #
  # LoadBalancer Service が 1 つも無くなった。それまで Gateway は LB-IPAM から
  # `10.10.0.53` をもらう LoadBalancer で、参照はドキュメントの中だけだった。
  # おかげで LB-IPAM と L2 アナウンスを撤去できた(2026-09-07)。
  # Gateway の `status.addresses` はノードの `10.0.0.2` になる。
  #
  # Service は消えず NodePort になる(`operator/pkg/model/translation/gateway-api/translator.go`
  # の `toServiceType`: `if HostNetworkConfig.Enabled { return ServiceTypeNodePort }`)。
  #
  # nodePort の手当ては消えなかった(2026-09-08 訂正)
  #
  # この変更は当初「手で当てていた nodePort 80/443 が要らなくなる」つもりで入れた。
  # それは誤りだった。Envoy はホストの `0.0.0.0:80` を LISTEN するが、
  # そこに直接来た接続は通らない。実通信は Cilium の L7LB リダイレクト経由で入る。
  # 詳しくは上の `nodePort.range` のコメント(実測つき)。
  #
  # したがって bootstrap-apply.yml の当て直しは今も要る(#91 で消したが戻した)。
  #
  # ポートの指定は無い。Gateway のリスナー(80 / 443)がそのままホストに bind される。
  # `httpPort` / `httpsPort` / `sharedListenerPort` は `ingressController.hostNetwork`
  # 側の項目で、こちらには無い(値の見た目が似ているので混同しやすい)。
  hostNetwork:
    # 下の envoy.securityContext とセット。80/443 は特権ポートなので、
    # NET_BIND_SERVICE が無いと `cannot bind '0.0.0.0:80': Permission denied` で
    # 公開 Web が全部落ちる(2026-09-07 に実際にやった)。
    # 実際に付いていることは fork 後のプロセスで確認する:
    #   kubectl -n kube-system exec ds/cilium-envoy -- grep CapEff /proc/7/status
    #   → 0000000000000400 (CAP_NET_BIND_SERVICE のみ。starter が他を落とす)
    enabled: true
  # gRPC を通すのに要る(2026-09-07)。既定は false で、その場合 Envoy は TLS の
  # ALPN で `h2` を広告しない。grpc-go のクライアントは ALPN の合意を必須にしているので、
  # NetBird のピアが `missing selected ALPN property` で管理サーバに繋げなかった。
  #
  # 有効にすると全リスナーが「HTTP/2 を試して、駄目なら HTTP/1.1」を広告する。
  # つまりブラウザからの既存サイトも HTTP/2 になる。WebSocket は HTTP/2 上では
  # 拡張 CONNECT が要るが、ブラウザはそれが使えなければ HTTP/1.1 の別接続に落ちるので
  # Mattermost・ArgoCD・Infisical はそのまま動く(適用後に実際に確認した)。
  #
  # チャートの注記どおり appProtocol サポートも一緒に有効になるが、
  # このクラスタに appProtocol を宣言している Service は 1 つも無いので影響しない。
  enableAlpn: true

# クラスタ内の通信を見る画面。Cilium 本体の hubble は元から有効(:4244 で待ち受け)で、
# 足りていなかったのは Relay と UI の 2 Pod だけ。
#
# UI 自身は認証を持たない。oauth2-proxy を前段に置いて守る
# (Cilium の Gateway には ext auth が無いので、*.s.doany.io と同じ「前段プロキシ」方式。
# ../auth/hubble-proxy.yaml)。UI の Service を直接 HTTPRoute に繋がないこと。
hubble:
  relay:
    enabled: true
  ui:
    enabled: true

# Envoy に特権ポートを bind させるための権限。Gateway のリスナーは 80/443 で、
# hostNetwork にするとホストのその番号を直接掴む。既定の Envoy にはこの権限が無い。
#
# 2 つ要る。コンテナに capability を渡すだけでは足りず、`cilium-envoy-starter` が
# fork 後に全部落とすので、`keepCapNetBindService` で明示的に残す必要がある
# (chart の values のコメントに書いてある)。
#
# 既定は `[NET_ADMIN, SYS_ADMIN]`。既定を消さないよう両方書く。
envoy:
  securityContext:
    capabilities:
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE
      keepCapNetBindService: true

securityContext:
  privileged: true
operator:
  replicas: 1
