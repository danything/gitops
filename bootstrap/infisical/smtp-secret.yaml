# Infisical の /infisical/infisical-smtp を operator が Secret にする(UI で書き換えれば数秒で同期)。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-smtp
  namespace: infisical
  annotations:
    # bootstrap/README.md「`InfisicalSecret` には sync-options を 2 つ付けること」
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /infisical/infisical-smtp
        recursive: false
  managedKubeSecretReferences:
    - secretName: infisical-smtp
      secretNamespace: infisical
      # Orphan: CR を消しても Secret は残す（移行や再作成で稼働中の Pod を巻き込まない）
      creationPolicy: Orphan
