# infisical-standalone の chart の値(Postgres + Redis 同梱)。DB と Redis のパスワードは secret-values.sops.yaml。
# 描いて machine config に載せるのは talos/render.sh(ArgoCD に置けない理由は docs/decisions.md)。
infisical:
    # 無いと名前が infisical-infisical-standalone-infisical になる
    fullnameOverride: infisical
    replicaCount: 1
    image:
        # Docker Hub の匿名取得は絞られるので mirror.gcr.io から。chart の既定の tag は遅れるので固定する
        repository: mirror.gcr.io/infisical/infisical
        tag: v0.167.0
    # ENCRYPTION_KEY / AUTH_SECRET / SITE_URL は infisical/secrets.sops.yaml
    kubeSecretRef: infisical-secrets
    extraEnv:
        # Kubernetes auth の TokenReview で kubernetes.default.svc を叩くのを SSRF ガードが拒むため
        - name: ALLOW_INTERNAL_IP_CONNECTIONS
          value: "true"
        # パスワードだけ Infisical 自身にある(smtp-secret.yaml)ので optional。まっさらな状態ではメール無しで
        # 上がり、operator が Secret を作ったあと rollout restart でメールが有効になる。
        - name: SMTP_HOST
          value: smtp.office365.com
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USERNAME
          value: info@doany.io
        - name: SMTP_FROM_ADDRESS
          value: info@doany.io
        - name: SMTP_FROM_NAME
          value: Infisical
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
                name: infisical-smtp
                key: SMTP_PASSWORD
                optional: true
ingress:
    # 公開は Gateway(apps/infisical/httproute.yaml)
    enabled: false
    nginx:
        # 同梱の ingress-nginx の切り替えも兼ねる
        enabled: false
postgresql:
    enabled: true
    auth:
        username: infisical
        database: infisicalDB
    primary:
        persistence:
            # chart を消しても PVC は残る。後ろ盾は k8up の日次 pg_dump
            storageClass: local-path
            size: 5Gi
        podAnnotations:
            k8up.io/backupcommand: /bin/sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" /opt/bitnami/postgresql/bin/pg_dump -U infisical -d infisicalDB --clean --if-exists'
            k8up.io/file-extension: .sql
redis:
    enabled: true
    auth:
    master:
        persistence:
            # キューとキャッシュだけ
            enabled: false
