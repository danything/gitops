# Infisical 自身の根っこの秘密(DB の暗号鍵など)。Infisical がほかの秘密を全部持つための層なので、
# Infisical からは取れない。値のキーだけ SOPS で暗号化してある(../../.sops.yaml)。
#
# ENCRYPTION_KEY encrypts everything Infisical stores in Postgres. Losing or
# changing it makes the whole database unreadable -- it's the one value here
# that must survive.
# AUTH_SECRET only signs sessions and can be rotated (everyone gets logged
# out).
