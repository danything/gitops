# Infisical の Webhook を即時リコンサイルに変えるブリッジ (自作・公開)。
# https://github.com/danything/infisical-push-bridge
# 無料版は operator のポーリング同期のみなので、保存 → 数秒反映はこれが担う。
# 落ちていても operator の resyncInterval に落ちるだけで壊れない。
#
# セットアップ: Infisical のフォルダ /infisical-push-bridge/infisical-push-bridge に
# `webhook-secret` を置き、プロジェクトの Project Settings → Webhooks で
# URL http://infisical-push-bridge.infisical-push-bridge.svc.cluster.local、
# Secret Path は必ず `/**`（既定の `/` はルートにしかマッチしない）、
# 同じ secret key の Webhook を作る (README 参照)。
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: infisical-push-bridge
  namespace: kube-system
spec:
  chart: oci://ghcr.io/danything/charts/infisical-push-bridge
  version: 0.1.1
  targetNamespace: infisical-push-bridge
  createNamespace: true
  valuesContent: |-
    infisicalSecret:
      enabled: true
      hostAPI: http://infisical.infisical.svc:8080/api
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      serviceAccountName: infisical-auth
      serviceAccountNamespace: infisical
      projectSlug: doany
      secretsPath: /infisical-push-bridge/infisical-push-bridge
