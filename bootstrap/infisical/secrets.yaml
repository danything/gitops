# Infisical's own root secrets. Plaintext is the same call as the Entra
# client secret in argocd/helmchart.yaml -- this repo is private, and this is
# the layer *below* Infisical (it's what lets Infisical hold every other
# secret), so it can't come out of Infisical itself.
#
# ENCRYPTION_KEY encrypts everything Infisical stores in Postgres. Losing or
# changing it makes the whole database unreadable -- it's the one value here
# that must survive.
# AUTH_SECRET only signs sessions and can be rotated (everyone gets logged
# out).
