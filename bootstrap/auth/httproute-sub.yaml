apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sub
  namespace: auth
spec:
  parentRefs:
    - name: doany
      namespace: kube-system
      sectionName: https-sub
  hostnames: ["*.s.doany.io"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: auth-sub
          port: 4180
