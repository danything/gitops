# ah.doany.io の管理画面を SSO で守る oauth2-proxy。
#
# AdGuard Home には SSO が無い。認証は設定ファイルに書いた bcrypt の basic 認証だけで、
# 利用者の管理機能も無い。上流の認証プロキシ対応の要望(AdguardTeam/AdGuardHome#1737)は
# 2020 年から open のまま。公式の答えも「前段で認証しろ」なので、Hubble と同じ形にする。
#
# `/dns-query` はここを通さない。AdGuard は Web の口で管理画面と DoH の両方を出しているので、
# 全部を後ろに置くと DoH にも認証がかかって名前解決が止まる(2026-09-07 朝に一度やった)。
# HTTPRoute でパスを分けてあり、`/dns-query` は DoH サイドカーへ直接行く。
#
# 通すのは Entra のアプリロール `admin` を持つ人だけ。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-adguard
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-adguard
  template:
    metadata:
      labels:
        app: auth-adguard
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:latest
        args:
        - --http-address=0.0.0.0:4180
        - --trusted-proxy-ip=10.42.0.0/16
        env:
        - name: OAUTH2_PROXY_PROVIDER
          value: entra-id
        - name: OAUTH2_PROXY_OIDC_ISSUER_URL
          value: https://login.microsoftonline.com/22ac977d-b140-4dc8-8150-90d645d3475b/v2.0
        - name: OAUTH2_PROXY_SCOPE
          value: openid email profile
        - name: OAUTH2_PROXY_CLIENT_ID
          value: b0fa498f-7e6a-4fe1-a1c6-16fbbb6f397e
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: oidc-client-secret
              name: auth-secrets
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              key: cookie-secret
              name: auth-secrets
        - name: OAUTH2_PROXY_REDIRECT_URL
          value: https://ah.doany.io/oauth2/callback
        - name: OAUTH2_PROXY_COOKIE_DOMAINS
          value: .doany.io
        - name: OAUTH2_PROXY_WHITELIST_DOMAINS
          value: .doany.io
        - name: OAUTH2_PROXY_EMAIL_DOMAINS
          value: '*'
        # a.doany.io 側と同じく Entra のアプリロール admin で絞る。
        # グループクレームから移した理由は docs/entra.md
        - name: OAUTH2_PROXY_OIDC_GROUPS_CLAIM
          value: roles
        - name: OAUTH2_PROXY_ALLOWED_GROUPS
          value: admin
        - name: OAUTH2_PROXY_REVERSE_PROXY
          value: 'true'
        - name: OAUTH2_PROXY_SET_XAUTHREQUEST
          value: 'false'
        - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
          value: 'true'
        - name: OAUTH2_PROXY_UPSTREAMS
          value: http://adguardhome-web.adguardhome.svc.cluster.local
        # a.doany.io 側と同じ。理由は deployment.yaml
        - name: OAUTH2_PROXY_SESSION_STORE_TYPE
          value: cookie
        - name: OAUTH2_PROXY_SESSION_COOKIE_MINIMAL
          value: 'true'
        ports:
        - containerPort: 4180
---
apiVersion: v1
kind: Service
metadata:
  name: auth-adguard
  namespace: auth
spec:
  selector:
    app: auth-adguard
  ports:
  - name: http
    port: 4180
    targetPort: 4180
