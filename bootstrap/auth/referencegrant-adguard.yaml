# adguardhome の HTTPRoute から auth の Service を指す許可(名前空間をまたぐ backendRef は指される側に置く)
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: adguardhome-to-auth
  namespace: auth
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: adguardhome
  to:
    - group: ""
      kind: Service
      name: auth-adguard
