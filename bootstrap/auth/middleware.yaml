apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth
  namespace: auth
spec:
  forwardAuth:
    address: http://auth.auth.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
---
# forwardAuth alone just relays oauth2-proxy's bare 401 to the browser --
# nothing makes it follow a login redirect. Chain this after forward-auth
# on every route that uses it so the 401 gets rewritten to a 302 into
# oauth2-proxy's own sign-in flow instead.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth-errors
  namespace: auth
spec:
  errors:
    status:
      - "401"
    statusRewrites:
      "401": 302
    query: /oauth2/sign_in?rd={url}
    service:
      name: auth
      port: 4180
