# *.s.doany.io を SSO 付きで LAN のホスト(sub-backend)へ中継する oauth2-proxy。
# Gateway に ext auth が無いので前段のプロキシにする。コールバックは a.doany.io 側が受ける(cookie secret を共有)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-sub
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-sub
  template:
    metadata:
      labels:
        app: auth-sub
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:latest
        args:
        - --http-address=0.0.0.0:4180
        - --trusted-proxy-ip=10.42.0.0/16
        env:
        - name: OAUTH2_PROXY_PROVIDER
          value: entra-id
        - name: OAUTH2_PROXY_OIDC_ISSUER_URL
          value: https://login.microsoftonline.com/22ac977d-b140-4dc8-8150-90d645d3475b/v2.0
        - name: OAUTH2_PROXY_SCOPE
          value: openid email profile
        - name: OAUTH2_PROXY_CLIENT_ID
          value: b0fa498f-7e6a-4fe1-a1c6-16fbbb6f397e
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: oidc-client-secret
              name: auth-secrets
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              key: cookie-secret
              name: auth-secrets
        - name: OAUTH2_PROXY_REDIRECT_URL
          value: https://a.doany.io/oauth2/callback
        - name: OAUTH2_PROXY_COOKIE_DOMAINS
          value: .doany.io
        - name: OAUTH2_PROXY_WHITELIST_DOMAINS
          value: .doany.io
        - name: OAUTH2_PROXY_EMAIL_DOMAINS
          value: '*'
        # Entra のアプリロール admin だけ
        - name: OAUTH2_PROXY_OIDC_GROUPS_CLAIM
          value: roles
        - name: OAUTH2_PROXY_ALLOWED_GROUPS
          value: admin
        - name: OAUTH2_PROXY_REVERSE_PROXY
          value: 'true'
        - name: OAUTH2_PROXY_SET_XAUTHREQUEST
          value: 'false'
        - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
          value: 'true'
        - name: OAUTH2_PROXY_UPSTREAMS
          value: http://sub-backend.kube-system.svc.cluster.local
        # a.doany.io 側と同じ。理由は deployment.yaml
        - name: OAUTH2_PROXY_SESSION_STORE_TYPE
          value: cookie
        - name: OAUTH2_PROXY_SESSION_COOKIE_MINIMAL
          value: 'true'
        ports:
        - containerPort: 4180
---
apiVersion: v1
kind: Service
metadata:
  name: auth-sub
  namespace: auth
spec:
  selector:
    app: auth-sub
  ports:
  - name: http
    port: 4180
    targetPort: 4180
