# *.s.doany.io の中継先。LAN のホスト(10.10.0.2)を名前で指せるようにするためだけの
# Service と、手書きの EndpointSlice。Endpoint は selector では作れない(Pod ではない)。
# 使うのは auth-sub の oauth2-proxy(sub-proxy.yaml の OAUTH2_PROXY_UPSTREAMS)。
apiVersion: v1
kind: Service
metadata:
  name: sub-backend
  namespace: kube-system
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: sub-backend-manual
  namespace: kube-system
  labels:
    kubernetes.io/service-name: sub-backend
addressType: IPv4
# API サーバが足す既定値(`protocol`・`conditions`)も書く。どちらも丸ごと比べるリストなので、
# 書かないと ArgoCD がずっと OutOfSync と見る(2026-10-17、`bootstrap` に移したときに出た)
ports:
  - name: http
    port: 80
    protocol: TCP
endpoints:
  - addresses: ["10.10.0.2"]
    conditions: {}
