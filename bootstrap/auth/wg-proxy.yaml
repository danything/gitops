# wg.doany.io を SSO で守る oauth2-proxy。
#
# **二重ログインになる。これは避けられない。** wg-easy には認証を切る手段が無く
# (要望 wg-easy/wg-easy#1923 は 2025-06 から open)、ネイティブ OIDC も Entra とは
# 組み合わせられない(userinfo が `email_verified` を返さないため。要望 #2741 は
# **not_planned で却下済み**)。それでも前段に置く価値はある —
# **いままで wg-easy のログインフォームがそのままインターネットに出ていた。**
# これで Entra のアプリロール `admin` を持つ人しかフォームに到達できない。
#
# wg-easy は hostNetwork で 10.0.0.2:51821 を持つが、Service 経由で繋ぐ。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-wg
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-wg
  template:
    metadata:
      labels:
        app: auth-wg
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:latest
        args:
        - --http-address=0.0.0.0:4180
        - --trusted-proxy-ip=10.42.0.0/16
        env:
        - name: OAUTH2_PROXY_PROVIDER
          value: entra-id
        - name: OAUTH2_PROXY_OIDC_ISSUER_URL
          value: https://login.microsoftonline.com/22ac977d-b140-4dc8-8150-90d645d3475b/v2.0
        - name: OAUTH2_PROXY_SCOPE
          value: openid email profile
        - name: OAUTH2_PROXY_CLIENT_ID
          value: b0fa498f-7e6a-4fe1-a1c6-16fbbb6f397e
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: oidc-client-secret
              name: auth-secrets
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              key: cookie-secret
              name: auth-secrets
        - name: OAUTH2_PROXY_REDIRECT_URL
          value: https://wg.doany.io/oauth2/callback
        - name: OAUTH2_PROXY_COOKIE_DOMAINS
          value: .doany.io
        - name: OAUTH2_PROXY_WHITELIST_DOMAINS
          value: .doany.io
        - name: OAUTH2_PROXY_EMAIL_DOMAINS
          value: '*'
        # a.doany.io 側と同じく Entra のアプリロール admin で絞る。
        # グループクレームから移した理由は docs/entra.md
        - name: OAUTH2_PROXY_OIDC_GROUPS_CLAIM
          value: roles
        - name: OAUTH2_PROXY_ALLOWED_GROUPS
          value: admin
        - name: OAUTH2_PROXY_REVERSE_PROXY
          value: 'true'
        - name: OAUTH2_PROXY_SET_XAUTHREQUEST
          value: 'false'
        - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
          value: 'true'
        - name: OAUTH2_PROXY_UPSTREAMS
          value: http://wg-easy.wireguard.svc.cluster.local:51821
        # a.doany.io 側と同じ。理由は deployment.yaml
        - name: OAUTH2_PROXY_SESSION_STORE_TYPE
          value: cookie
        - name: OAUTH2_PROXY_SESSION_COOKIE_MINIMAL
          value: 'true'
        ports:
        - containerPort: 4180
---
apiVersion: v1
kind: Service
metadata:
  name: auth-wg
  namespace: auth
spec:
  selector:
    app: auth-wg
  ports:
  - name: http
    port: 4180
    targetPort: 4180
