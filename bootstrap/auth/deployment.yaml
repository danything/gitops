apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: quay.io/oauth2-proxy/oauth2-proxy:latest
          args:
            - --http-address=0.0.0.0:4180
            # Only trust X-Forwarded-* from in-cluster traffic (i.e. the Cilium
            # Gateway's Envoy), not literally anyone per --reverse-proxy's default.
            - --trusted-proxy-ip=10.42.0.0/16
          ports:
            - containerPort: 4180
          env:
            # The generic oidc provider tries to request a literal "groups"
            # OAuth scope when OIDC_GROUPS_CLAIM is set, which Entra rejects
            # (AADSTS650053) -- groups come from the ID token automatically
            # once groupMembershipClaims is set on the app, no scope needed.
            # The dedicated entra-id provider knows this.
            - name: OAUTH2_PROXY_PROVIDER
              value: entra-id
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://login.microsoftonline.com/22ac977d-b140-4dc8-8150-90d645d3475b/v2.0
            - name: OAUTH2_PROXY_SCOPE
              value: openid email profile
            - name: OAUTH2_PROXY_CLIENT_ID
              value: b0fa498f-7e6a-4fe1-a1c6-16fbbb6f397e
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: oidc-client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: cookie-secret
            # Single fixed callback registered in the Entra app -- Entra
            # requires an exact redirect URI match, so this can't vary
            # per-subdomain the way the forwardAuth check itself does.
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: https://a.doany.io/oauth2/callback
            - name: OAUTH2_PROXY_COOKIE_DOMAINS
              value: .doany.io
            - name: OAUTH2_PROXY_WHITELIST_DOMAINS
              value: .doany.io
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            # Same admin-only restriction the email whitelist gave us, but
            # via the Entra "admins" group now -- anyone else in the tenant
            # can still complete OIDC login but gets rejected here before
            # reaching *.s.doany.io. Shared with ArgoCD's RBAC (see
            # argocd/helmchart.yaml) so membership only needs managing once.
            - name: OAUTH2_PROXY_ALLOWED_GROUPS
              value: 5847ec59-0f80-4713-89f9-3624cc217468
            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: "true"
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_UPSTREAMS
              value: static://202
            # Entra ID's ID token embeds the user's group GUIDs directly (see
            # groupMembershipClaims note above), which can push the session
            # past the browser's per-cookie size limit and get split into
            # chunked cookies -- since COOKIE_DOMAINS is .doany.io, those
            # chunks ride along to every subdomain and can blow past a
            # backend's max header size. Store the session in Redis instead
            # so the cookie only holds a session ID reference.
            - name: OAUTH2_PROXY_SESSION_STORE_TYPE
              value: redis
            - name: OAUTH2_PROXY_REDIS_CONNECTION_URL
              value: redis://auth-redis.auth.svc.cluster.local:6379
