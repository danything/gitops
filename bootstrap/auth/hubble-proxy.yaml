# hl.doany.io を SSO 付きで Hubble UI へ中継する oauth2-proxy。
# Hubble UI 自身は認証を持たないので、直接 HTTPRoute に繋いではいけない。
# Cilium の Gateway には ext auth が無いので、*.s.doany.io と同じ「oauth2-proxy 自身を
# 前段のプロキシにする」方式(--upstream で中継先を持つ)。
# コールバックは自分で受ける。a.doany.io 側に投げると、あちらは元のホストを
# 知らないので認証後に a.doany.io に着地してしまう(`*.s.doany.io` は名前が
# ワイルドカードで Entra に個別の redirect URI を登録できないため共有しているが、
# こちらは固定の 1 ホストなので自前で持てる)。
# Entra のアプリ登録に https://hl.doany.io/oauth2/callback を追加済み。
# cookie secret は a.doany.io 側と共有しているので、どちらかで入れば両方通る。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-hubble
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-hubble
  template:
    metadata:
      labels:
        app: auth-hubble
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:latest
        args:
        - --http-address=0.0.0.0:4180
        - --trusted-proxy-ip=10.42.0.0/16
        env:
        - name: OAUTH2_PROXY_PROVIDER
          value: entra-id
        - name: OAUTH2_PROXY_OIDC_ISSUER_URL
          value: https://login.microsoftonline.com/22ac977d-b140-4dc8-8150-90d645d3475b/v2.0
        - name: OAUTH2_PROXY_SCOPE
          value: openid email profile
        - name: OAUTH2_PROXY_CLIENT_ID
          value: b0fa498f-7e6a-4fe1-a1c6-16fbbb6f397e
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: oidc-client-secret
              name: auth-secrets
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              key: cookie-secret
              name: auth-secrets
        - name: OAUTH2_PROXY_REDIRECT_URL
          value: https://hl.doany.io/oauth2/callback
        - name: OAUTH2_PROXY_COOKIE_DOMAINS
          value: .doany.io
        - name: OAUTH2_PROXY_WHITELIST_DOMAINS
          value: .doany.io
        - name: OAUTH2_PROXY_EMAIL_DOMAINS
          value: '*'
        # a.doany.io 側と同じく Entra のアプリロール admin で絞る。
        # グループクレームから移した理由は docs/entra.md
        - name: OAUTH2_PROXY_OIDC_GROUPS_CLAIM
          value: roles
        - name: OAUTH2_PROXY_ALLOWED_GROUPS
          value: admin
        - name: OAUTH2_PROXY_REVERSE_PROXY
          value: 'true'
        - name: OAUTH2_PROXY_SET_XAUTHREQUEST
          value: 'false'
        - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
          value: 'true'
        - name: OAUTH2_PROXY_UPSTREAMS
          value: http://hubble-ui.kube-system.svc.cluster.local
        # a.doany.io 側と同じ。理由は deployment.yaml
        - name: OAUTH2_PROXY_SESSION_STORE_TYPE
          value: cookie
        - name: OAUTH2_PROXY_SESSION_COOKIE_MINIMAL
          value: 'true'
        ports:
        - containerPort: 4180
---
apiVersion: v1
kind: Service
metadata:
  name: auth-hubble
  namespace: auth
spec:
  selector:
    app: auth-hubble
  ports:
  - name: http
    port: 4180
    targetPort: 4180
